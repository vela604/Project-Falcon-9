<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merlin 1D — plume from sea level to vacuum</title>
<style>
:root{--ink:#e9dccb;--dim:#8d8378;--hot:#ff8a3d}
html,body{margin:0;height:100%;background:#05060a;color:var(--ink);font:15px/1.3 system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
background:linear-gradient(transparent,rgba(5,6,10,.85) 55%)}
.out{min-width:8.5em}.out b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.out span{display:block;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.sl{display:flex;flex-direction:column;gap:4px}.sl div{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
input[type=range]{width:100%;accent-color:var(--hot);height:28px;margin:0}
button{font:inherit;font-weight:600;color:#14100c;background:var(--hot);border:0;border-radius:999px;padding:11px 22px;min-width:96px}
button.on{background:#3a2a1f;color:var(--hot);box-shadow:inset 0 0 0 1.5px var(--hot)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:560px){.ui{grid-template-columns:1fr auto}.sl{grid-column:1/-1;order:3}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui">
 <div class="out"><b id="F">0 kN</b><span id="P">101.3 kPa ambient</span></div>
 <label class="sl"><input id="s" type="range" min="0" max="1" step="0.0005" value="0" aria-label="Ambient pressure">
  <div><span>Sea level</span><span>Vacuum</span></div></label>
 <button id="b">Ignite</button>
</div>
<script>
/* =====================================================================
   MERLIN-1D-CLASS PLUME  —  raw WebGL2, one fragment shader, no libraries.
   Why no Three.js: the whole scene is one analytic ray-marched volume plus an
   SDF engine. A scene graph would add weight and nothing else, and a single
   fullscreen pass lets me scale resolution adaptively to hold 60 fps.

   PHYSICS (all in JS, evaluated every frame from the slider; shader receives
   only the derived numbers — nothing is switched by altitude):
   1. Nozzle: area ratio eps=16 -> exit Mach Me by solving the isentropic
      area-Mach relation (gamma 1.22, typical RP-1/LOX exhaust). Exit pressure
      pe = pc*(1+(g-1)/2 Me^2)^(-g/(g-1)).
   2. Free-jet expansion to ambient: if pa is reached isentropically the jet
      Mach is Mj = f(pc/pa). Prandtl-Meyer turning at the lip is
      theta = nu(Mj) - nu(Me): negative (plume contracts) when over-expanded,
      positive (flares) when under-expanded.
   3. Plume equilibrium radius rj = re*sqrt(A(Mj)/A(Me)) (mass conservation).
   4. Shock-cell length: Prandtl's  L = 1.306 * Dj * sqrt(Mj^2-1).
   5. Boundary: r(x) = rj + (re-rj)cos(kx) + (theta/k) sin(kx), k = 2pi/L.
      This matches r(0)=re and r'(0)=theta exactly and is periodic with the
      true cell length; shear-layer mixing damps it downstream.
   6. Thrust: F = pc*At*Cf, Cf = momentum term + (pe-pa)/pc * eps.
   SIMPLIFICATIONS (honest list): quasi-1D streamtubes instead of the full
   method of characteristics (so no Mach-disk or barrel-shock curvature),
   boundary lip angle is soft-capped (~57 deg) to keep the vacuum bell
   renderable (real flow turns up to ~100+ deg then thins out invisibly),
   radiation is a plausible emission model (density x diamond compression),
   not a spectral solve. A real version would run MOC or CFD (e.g. Cart3D).
   ===================================================================== */
const G=1.22, EPS=16, PC=10e6, RE=0.497, RT=RE/Math.sqrt(EPS), AT=Math.PI*RT*RT, PA0=101325;
const Aq=M=>1/M*Math.pow((2/(G+1))*(1+(G-1)/2*M*M),(G+1)/(2*(G-1)));
const nu=M=>{const a=Math.sqrt((G+1)/(G-1));return a*Math.atan(Math.sqrt(M*M-1)/a)-Math.atan(Math.sqrt(M*M-1))};
const machFromP=r=>Math.sqrt(2/(G-1)*(Math.pow(r,(G-1)/G)-1));
let Me=2;{let lo=1.0001,hi=12;for(let i=0;i<60;i++){Me=(lo+hi)/2;Aq(Me)<EPS?lo=Me:hi=Me}}
const GAM=Math.sqrt(2*G*G/(G-1)*Math.pow(2/(G+1),(G+1)/(G-1)));
function solve(pa,pc){
  const pe=pc*Math.pow(1+(G-1)/2*Me*Me,-G/(G-1));
  const Mj=Math.max(1.05,machFromP(pc/pa));
  const rj=RE*Math.sqrt(Aq(Mj)/Aq(Me));
  const th0=nu(Mj)-nu(Me), TM=1.0, theta=TM*Math.tanh(th0/TM);  // soft cap
  const sM=Math.sqrt(Mj*Mj-1), L=1.306*2*rj*sM;
  const Cf=GAM*Math.sqrt(1-Math.pow(pe/pc,(G-1)/G))+(pe-pa)/pc*EPS;
  return {pe,Mj,rj,theta,sM,L,F:pc*AT*Cf,R:pe/pa};
}
const bound=(x,S)=>{const k=2*Math.PI/S.L,d=Math.exp(-x/(6*S.L));
  return Math.max(.05,S.rj+.02*x+((RE-S.rj)*Math.cos(k*x)+S.theta/k*Math.sin(k*x))*d)};

/* ---------------- shaders ---------------- */
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uRes;uniform float uT,uRj,uTh,uL,uSM,uSat,uE,uAB,uThr,uFl,uRc,uShake;
uniform vec3 uCam,uTgt;out vec4 o;
const float RE=0.497,RT=0.1243,LN=1.6;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float rw(float y){float u=clamp(y/LN,0.,1.);return RT+(RE-RT)*pow(1.-u,.62);}   // bell contour
float cap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.))-r;}
float cyl(vec3 p,float r,float y0,float y1){vec2 d=vec2(length(p.xz)-r,abs(p.y-.5*(y0+y1))-.5*(y1-y0));
 return min(max(d.x,d.y),0.)+length(max(d,0.));}
vec2 map(vec3 p){   // x = distance, y = material (1 nozzle, 2 chamber, 3 turbopump/plumbing)
 float rho=length(p.xz);
 float dn=(abs(rho-rw(p.y))-.012)*.8; dn=max(dn,max(-p.y,p.y-LN));
 dn=min(dn,length(vec2(rho-RE-.004,p.y-.03))-.022);                       // exit stiffener ring
 dn=min(dn,length(vec2(rho-rw(LN*.55)-.03,p.y-LN*.55))-.016);             // coolant manifold
 float ch=min(cyl(p,.17,LN-.02,LN+.42),length(vec3(p.xz,(p.y-LN-.42)*1.4).xzy)-.17);
 ch=min(ch,cyl(p,.21,LN+.42,LN+.56));                                      // injector head
 vec2 pc=p.xz-vec2(.36,0.);
 float tp=min(cyl(vec3(pc.x,p.y,pc.y),.085,LN+.18,LN+.62),length(vec2(length(pc)-.11,p.y-LN-.28))-.04);
 tp=min(tp,cap(p,vec3(.36,LN+.62,0),vec3(.08,LN+.58,0),.03));
 tp=min(tp,cap(p,vec3(.36,LN+.2,0),vec3(.47,LN-.4,0),.026));
 tp=min(tp,cap(p,vec3(.28,LN+.25,0),vec3(.12,LN+.3,0),.025));
 vec2 r=vec2(dn,1.);if(ch<r.x)r=vec2(ch,2.);if(tp<r.x)r=vec2(tp,3.);return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.002,-.002);
 return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float bnd(float xa){ // plume boundary, same closed form as the JS physics
 float k=6.2831853/uL,d=exp(-xa/(6.*uL));
 return max(.05,uRj+.02*xa+((RE-uRj)*cos(k*xa)+uTh/k*sin(k*xa))*d);}

void main(){
 vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;
 vec3 ro=uCam+uShake*vec3(sin(uT*61.),sin(uT*47.+2.),0.)*.004*uE;
 vec3 ww=normalize(uTgt-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);
 vec3 bg=mix(vec3(.012,.014,.022),vec3(.03,.025,.03),smoothstep(-1.,1.,uv.y*-.5+.3));

 // ---------- engine: sphere trace inside a bounding sphere ----------
 vec3 col=bg;float tE=1e4;
 vec3 oc=ro-vec3(0,1.2,0);float bb=dot(oc,rd),cc=dot(oc,oc)-3.2,hh=bb*bb-cc;
 if(hh>0.){float t=max(0.,-bb-sqrt(hh));
  for(int i=0;i<90;i++){vec2 m=map(ro+rd*t);if(m.x<.0007){tE=t;break;}t+=m.x;if(t>-bb+sqrt(hh))break;}
  if(tE<1e3){vec3 p=ro+rd*tE;vec3 n=nrm(p);float mat=map(p).y;
   float yy=p.y/LN,rho=length(p.xz);
   vec3 base=mat==1.?vec3(.30,.29,.28):mat==2.?vec3(.42,.40,.38):vec3(.55,.52,.47);
   // heat tint: gold -> violet-blue temper colours towards the throat
   float heat=smoothstep(.35,1.,yy)*step(mat,1.5);
   base=mix(base,mix(vec3(.55,.40,.16),vec3(.25,.22,.45),smoothstep(.7,1.,yy)),heat*.7);
   // soot: streaky, thickest on the inside of the skirt (normal pointing at the axis)
   float inner=smoothstep(.1,-.4,dot(n,normalize(vec3(p.x,0,p.z)+1e-4)));
   float st=vn(vec2(atan(p.z,p.x)*40.,p.y*6.))*.6+vn(vec2(atan(p.z,p.x)*9.,p.y*2.))*.4;
   float soot=step(mat,1.5)*inner*smoothstep(.9,.0,yy)*(.55+.45*st);
   base=mix(base,vec3(.015),soot*.92);
   vec3 L1=normalize(vec3(-.5,.6,.6));vec3 pl=normalize(vec3(0,-1.2,0)-p);
   float dif=max(dot(n,L1),0.)*.55+.12+max(dot(n,pl),0.)*uThr*1.4;
   vec3 hv=normalize(L1-rd);float sp=pow(max(dot(n,hv),0.),40.)*.5*(1.-soot);
   float rim=pow(1.-max(dot(n,-rd),0.),3.)*.25;
   col=base*(dif*vec3(.8,.85,1.)+uThr*1.1*vec3(1.,.5,.2)*max(dot(n,pl),0.))+sp*vec3(.9,.95,1.)+rim*vec3(.2,.3,.5);
   col+=vec3(1.,.38,.08)*heat*uThr*.35*smoothstep(.75,1.,yy)*step(mat,1.5);   // glowing throat
  }}

 // ---------- plume: emissive ray-march of the analytic boundary field ----------
 float yT=1.0,yB=-uE*1.8;vec2 ts=vec2(0.,1e4);
 if(abs(rd.y)>1e-5){float a=(yT-ro.y)/rd.y,b=(yB-ro.y)/rd.y;ts=vec2(min(a,b),max(a,b));}
 else if(ro.y>yT||ro.y<yB)ts=vec2(1.,0.);
 float A=dot(rd.xz,rd.xz),B=dot(ro.xz,rd.xz),C=dot(ro.xz,ro.xz)-uRc*uRc,D=B*B-A*C;
 if(A>1e-6){if(D>0.){float s=sqrt(D);ts=vec2(max(ts.x,(-B-s)/A),min(ts.y,(-B+s)/A));}else ts=vec2(1.,0.);}
 else if(C>0.)ts=vec2(1.,0.);
 ts.x=max(ts.x,0.);ts.y=min(ts.y,tE);
 vec3 em=vec3(0.);float T=1.;
 if(ts.y>ts.x&&uThr>.002){
  const int N=72;float dt=(ts.y-ts.x)/float(N);
  float t=ts.x+dt*hash(gl_FragCoord.xy+fract(uT));float k=6.2831853/uL;
  for(int i=0;i<N;i++,t+=dt){
   vec3 p=ro+rd*t;float xa=-p.y,rho=length(p.xz);
   float rb=xa<0.?rw(p.y):bnd(xa);float q=rho/rb;if(q>2.6)continue;
   float inside=smoothstep(1.05,.88,q);
   float dens=min(pow(RE/rb,2.),4.)*(1.-.45*q*q)*exp(-max(xa,0.)/(25.*RE));  // streamtube: rho ~ 1/A
   dens*=smoothstep(uE*1.8,uE*1.0,xa);
   // Diamonds: compression focus where the cell phase hits pi; phase is skewed by
   // rho*sqrt(Mj^2-1) so that each diamond is a cone (Mach-angle lean), not a flat slab.
   float ph=k*(xa+.5*rho*uSM),dm=0.;
   if(xa>0.)dm=pow(.5-.5*cos(ph),4.)*exp(-xa/(6.*uL))*exp(-q*q*1.6);
   float gl=dens*inside*(.5+3.2*uSat*dm);
   float hot=clamp(dens*.55+dm*uSat,0.,1.);
   vec3 c=mix(vec3(1.,.42,.1),vec3(1.,.86,.62),hot);
   c=mix(c,vec3(1.,.95,.9),clamp(dm*uSat*1.2,0.,1.));
   float edge=exp(-pow((q-1.)/.08,2.))*dens*uAB;                       // afterburning shear layer
   float halo=(q>1.?exp(-(q-1.)*4.):0.)*dens*.07*(.4+uAB);
   em+=T*dt*1.5*(gl*c+edge*vec3(1.,.3,.07)*1.6+halo*vec3(1.,.4,.12));
   T*=exp(-dens*inside*.12*dt);
  }}
 col=col*T+em*uThr+uFl*vec3(1.,.8,.55)*exp(-length(uv)*2.)*.6;
 col=1.-exp(-col*1.25);col=pow(col,vec3(.4545));
 col*=1.-.35*dot(uv*.5,uv*.5);col+=(hash(gl_FragCoord.xy+uT)-.5)*.012;
 o=vec4(col,1.);}`;

/* ---------------- GL setup ---------------- */
const cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false,powerPreference:'high-performance'});
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};['uRes','uT','uRj','uTh','uL','uSM','uSat','uE','uAB','uThr','uFl','uRc','uShake','uCam','uTgt'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

/* ---------------- state / UI ---------------- */
const sl=document.getElementById('s'),btn=document.getElementById('b'),oF=document.getElementById('F'),oP=document.getElementById('P');
let thr=0,on=false,flash=0,sS=0,E=3.4,az=.5,drag=null,scale=.7,tPrev=performance.now(),acc=0,nf=0,cd=12,cy=0;
btn.onclick=()=>{on=!on;btn.classList.toggle('on',on);btn.textContent=on?'Shut down':'Ignite';if(on){flash=1;audio()}};
cv.addEventListener('pointerdown',e=>drag=e.clientX);addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(drag!==null){az-=(e.clientX-drag)*.006;drag=e.clientX}});

let AC,gain,lp;function audio(){if(AC)return;AC=new AudioContext();
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}                // brown noise = rocket roar
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;lp=AC.createBiquadFilter();lp.type='lowpass';
  gain=AC.createGain();gain.gain.value=0;s.connect(lp);lp.connect(gain);gain.connect(AC.destination);s.start();}

function frame(now){
  const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;
  // adaptive resolution: protect 60 fps
  acc+=dt;nf++;if(acc>.6){const ms=acc/nf*1000;if(ms>18)scale=Math.max(.3,scale-.07);else if(ms<12)scale=Math.min(1,scale+.04);acc=nf=0}
  const W=Math.max(2,Math.round(innerWidth*Math.min(devicePixelRatio,2)*scale)),H=Math.max(2,Math.round(innerHeight*Math.min(devicePixelRatio,2)*scale));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;gl.viewport(0,0,W,H)}
  // pressure slider is logarithmic: 101325 Pa -> 1 Pa
  sS+=(+sl.value-sS)*Math.min(1,dt*14);
  const pa=PA0*Math.exp(-sS*Math.log(PA0));
  thr+=((on?1:0)-thr)*Math.min(1,dt*(on?5:3));flash=Math.max(0,flash-dt*2.5);
  const pc=PC*(.35+.65*thr), S=solve(pa,pc);
  // framing: derived from the physical shell-cell length so nothing is cropped
  const Et=Math.min(12,Math.max(3.4,.85*S.L));E+=(Et-E)*Math.min(1,dt*3);
  let Rc=0;for(let i=0;i<48;i++)Rc=Math.max(Rc,bound(E*1.8*i/47,S));Rc=Math.min(Rc,40)+.3;
  const top=2.4,Ht=top+1.8*E,Rv=Math.min(bound(E,S),30),asp=innerWidth/innerHeight;
  const dT=1.6*.5*Math.max(Ht,2*Rv/asp)*1.08,tgtY=(top-1.8*E)/2;cd+=(dT-cd)*Math.min(1,dt*3);cy+=(tgtY-cy)*Math.min(1,dt*3);
  if(drag===null)az+=dt*.03;
  const now_s=now/1000, paN=pa/PA0;
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uT,now_s);
  gl.uniform1f(U.uRj,S.rj);gl.uniform1f(U.uTh,S.theta);gl.uniform1f(U.uL,S.L);gl.uniform1f(U.uSM,S.sM);
  gl.uniform1f(U.uSat,Math.tanh(.5*Math.abs(Math.log(S.R))));              // diamond strength from pe/pa
  gl.uniform1f(U.uE,E);gl.uniform1f(U.uRc,Rc);
  gl.uniform1f(U.uAB,.12+.88*Math.pow(paN,.35));                           // afterburn needs ambient O2
  gl.uniform1f(U.uThr,thr*(1+flash*1.5));gl.uniform1f(U.uFl,flash*thr);
  gl.uniform1f(U.uShake,thr*Math.sqrt(paN)*.9+thr*.1);
  gl.uniform3f(U.uCam,Math.sin(az)*cd,cy+cd*.06,Math.cos(az)*cd);gl.uniform3f(U.uTgt,0,cy,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const F=S.F*thr*thr*(thr>.01?1:0)/Math.max(thr,1e-3)*Math.min(1,thr*1.0)/Math.min(1,thr||1);
  oF.textContent=Math.round(thr>.005?S.F*Math.min(1,thr*1.4)/1000:0)+' kN';
  oP.textContent=(pa>=1000?(pa/1000).toFixed(1)+' kPa':pa>=10?pa.toFixed(0)+' Pa':'≈ vacuum')+' ambient';
  if(gain){gain.gain.value=thr*(.03+.5*Math.sqrt(paN));lp.frequency.value=250+900*Math.sqrt(paN)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
