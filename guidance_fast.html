<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guidance Fast — Rocket Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060912; --panel: #0d1424; --panel-2: #101a30; --border: #1c2b45;
  --cyan: #35d6ff; --green: #4ade80; --yellow: #ffd23f; --danger: #ff5f7e;
  --orange: #ff9248; --purple: #a78bfa;
  --text: #dbe6f5; --dim: #6b7d9c;
  --font-head: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-head); font-size: 13px; }
#app { display: flex; flex-direction: column; min-height: 100vh; }

#topBar { display: flex; align-items: baseline; gap: 14px; padding: 12px 24px;
  background: linear-gradient(180deg, #101a30, #0b1220);
  border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 13px; }
.brand { color: var(--cyan); font-weight: 700; letter-spacing: 0.5px; text-decoration: none; }
.brand-sub { color: var(--dim); }
.spacer { flex: 1; }
a.back { color: var(--dim); text-decoration: none; font-size: 12px; }
a.back:hover { color: var(--cyan); }

#controls { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#controls label { color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
#controls select, #controls input[type=number] {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 9px; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; }
.btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 7px 14px; border-radius: 7px; cursor: pointer; font-family: var(--font-head); font-size: 12px; }
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-run { border-color: var(--green); color: var(--green); }
.btn-run:hover { background: rgba(74,222,128,0.1); }
.btn-stop { border-color: var(--danger); color: var(--danger); }
.btn-stop:hover { background: rgba(255,95,126,0.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#envPanel { display: flex; gap: 24px; flex-wrap: wrap; padding: 10px 24px 12px; background: #0a1020; border-bottom: 1px solid var(--border); }
.env-group { display: flex; flex-direction: column; gap: 3px; }
.env-title { color: var(--cyan); font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
.env-group label { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); }
.env-group input[type=number] { width: 62px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; }
.env-group input[type=checkbox] { accent-color: var(--cyan); }

#presetPanel { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: #0a1020; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#presetPanel label { color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
#presetPanel select { min-width: 240px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 6px 9px; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; }
#presetStatus { color: var(--dim); font-family: var(--font-mono); font-size: 11px; margin-left: auto; }

#tunables { background: #0a1020; border-bottom: 1px solid var(--border); padding: 10px 24px 14px; }
.tunables-title { color: var(--cyan); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
#tunablesBody { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 18px; }
.tunable-row { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; }
.tunable-row label { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tunable-row input { width: 110px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 4px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; }

#main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 24px 24px; min-height: 0; }

.card { background: #0a1020; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
.card-title { color: var(--cyan); font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.run-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 20px; font-family: var(--font-mono); font-size: 12px; }
.run-summary .k { color: var(--dim); }
.run-summary .v { color: var(--text); }

#filterRow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.filter-chip { padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--dim); cursor: pointer; font-family: var(--font-mono); font-size: 11px; }
.filter-chip.active { color: var(--cyan); border-color: var(--cyan); background: rgba(53,214,255,0.1); }

#capturesList { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.capture { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; background: #0d1424; font-family: var(--font-mono); font-size: 11.5px; }
.capture.type-phase  { border-left: 3px solid var(--cyan); }
.capture.type-orbit  { border-left: 3px solid var(--green); }
.capture.type-abort  { border-left: 3px solid var(--danger); }
.capture.type-event  { border-left: 3px solid var(--yellow); }
.capture.type-peak   { border-left: 3px solid var(--orange); }
.capture.type-end    { border-left: 3px solid var(--purple); }
.capture .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.capture .time { color: var(--cyan); font-weight: 700; min-width: 78px; }
.capture .label { color: var(--text); font-weight: 600; }
.capture .sublabel { color: var(--dim); }
.capture .body { margin-top: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 18px; color: #c6d2e6; }
.capture .body .k { color: var(--dim); }
.capture .body .hi { color: var(--orange); }
.capture .body .warn { color: var(--danger); }

#compareBox { display: none; }
#compareBox.show { display: block; }
.compare-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 20px; font-family: var(--font-mono); font-size: 12px; }
.compare-row { display: flex; gap: 8px; }
.compare-row .k { color: var(--dim); min-width: 140px; }
.compare-row .a { color: #b8c7e0; }
.compare-row .arrow { color: var(--dim); }
.compare-row .b { color: var(--cyan); font-weight: 600; }
.compare-row .b.bad { color: var(--danger); }
.compare-row .b.good { color: var(--green); }

#status { color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; padding: 8px 24px; background: var(--panel); border-top: 1px solid var(--border); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">

  <div id="topBar">
    <span class="brand">⚡ GUIDANCE FAST</span>
    <span class="brand-sub">numeric mission run · event captures</span>
    <div class="spacer"></div>
    <a class="back" href="index.html">← Home</a>
  </div>

  <div id="controls">
    <label for="guideSelect">Guide:</label>
    <select id="guideSelect"></select>
    <label for="durationInput">Duration (s):</label>
    <input id="durationInput" type="number" value="800" min="1" max="5000" step="10" style="width:90px;">
    <button class="btn btn-run" id="startBtn">▶ Run</button>
    <button class="btn btn-stop" id="stopBtn" disabled>■ Stop</button>
  </div>

  <div id="envPanel">
    <div class="env-group">
      <div class="env-title">Wind</div>
      <label><input type="checkbox" id="envWindEnabled"> Enabled</label>
      <label>Speed <input type="number" id="envWindSpeed" value="0" step="1" min="0" max="60"> m/s</label>
      <label>Dir <input type="number" id="envWindDir" value="0" step="5" min="0" max="360"> °</label>
    </div>
    <div class="env-group">
      <div class="env-title">Fuel</div>
      <label>Load <input type="number" id="envFuelPct" value="100" step="5" min="0" max="100"> %</label>
    </div>
    <div class="env-group">
      <div class="env-title">Physics</div>
      <label><input type="checkbox" id="envAtmosphere" checked> Atmosphere</label>
      <label><input type="checkbox" id="envSlosh" checked> Fuel slosh</label>
    </div>
    <div class="env-group">
      <div class="env-title">Guidance</div>
      <label><input type="checkbox" id="envImu"> IMU noise</label>
    </div>
  </div>

  <div id="presetPanel">
    <label for="presetSelect">Preset:</label>
    <select id="presetSelect"><option value="">— select a preset —</option></select>
    <button class="btn" id="presetLoadBtn">Load</button>
    <button class="btn" id="presetSaveBtn">Save as…</button>
    <button class="btn" id="presetDeleteBtn">Delete</button>
    <button class="btn" id="presetExportBtn">Export</button>
    <button class="btn" id="presetImportBtn">Import</button>
    <span id="presetStatus"></span>
  </div>

  <div id="tunables" style="display:none;">
    <div class="tunables-title">Constants (tunable, session-only unless saved as preset)</div>
    <div id="tunablesBody"></div>
  </div>

  <div id="main">

    <div class="card" id="summaryCard">
      <div class="card-title">Run summary</div>
      <div id="summaryBody" class="run-summary"><span class="k">No run yet.</span></div>
    </div>

    <div class="card" id="compareBox">
      <div class="card-title">Compare with previous run</div>
      <div id="compareBody" class="compare-grid"></div>
    </div>

    <div class="card" style="flex: 1; min-height: 0;">
      <div class="card-title">
        <span>Event captures</span>
        <span id="captureCount" style="color: var(--dim);">0</span>
      </div>
      <div id="filterRow">
        <span class="filter-chip active" data-type="all">all</span>
        <span class="filter-chip" data-type="phase">phase</span>
        <span class="filter-chip" data-type="orbit">orbit</span>
        <span class="filter-chip" data-type="abort">abort</span>
        <span class="filter-chip" data-type="event">event</span>
        <span class="filter-chip" data-type="peak">peak</span>
        <span class="filter-chip" data-type="end">end</span>
      </div>
      <div id="capturesList"></div>
    </div>

  </div>

  <div id="status">Ready.</div>
</div>

<!-- ============ 1. Data layer + config ============ -->
<script src="js/componentLibrary.js"></script>
<script src="js/customDesign.js"></script>
<script src="js/fleet.js"></script>
<script src="js/config.js"></script>

<!-- ============ 2. Core physics ============ -->
<script src="js/simJs/core/massProps.js"></script>
<script src="js/simJs/core/environment.js"></script>
<script src="js/simJs/core/vehicle.js"></script>
<script src="js/simJs/core/rcs.js"></script>
<script src="js/simJs/core/physics.js"></script>
<script src="js/simJs/core/collision.js"></script>

<!-- ============ 3. Guidance modules ============ -->
<script src="js/simJs/guidance/imu.js"></script>
<script src="js/simJs/guidance/derivation.js"></script>
<script src="js/simJs/guidance/guidercs.js"></script>
<script src="js/simJs/guidance/guidance.js"></script>

<!-- ============ 4. Preset store ============ -->
<script src="js/guideConfigDefaults.js"></script>
<script src="js/guidancePresets.js"></script>

<!-- ============ 5. Boot ============ -->
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Library cache (same pattern as other pages — componentLibrary hit hard)
  // ---------------------------------------------------------------------------
  (function patchLibraryCache() {
    var _cache = null;
    var _origLoadCL = loadComponentLibrary;
    loadComponentLibrary = function () {
      if (_cache) return _cache;
      _cache = _origLoadCL();
      return _cache;
    };
    if (typeof saveCustomComponentTypes === 'function') {
      var _origSave = saveCustomComponentTypes;
      saveCustomComponentTypes = function (types) {
        _origSave(types); _cache = null;
      };
    }
  })();

  // ---------------------------------------------------------------------------
  // Stack handoff
  // ---------------------------------------------------------------------------
  const members = (typeof getActiveStackMembers === 'function') ? getActiveStackMembers() : [];
  window.SIM_STACK_MEMBERS = members;

  function _stripFns(obj) {
    return JSON.parse(JSON.stringify(obj, (k, v) => (typeof v === 'function' ? undefined : v)));
  }
  function collectStackData() {
    const typeIds = new Set();
    members.forEach(m => {
      ['engineTypeId','recoveryTypeId','rcsTypeId','bodyMetalTypeId','legsMetalTypeId',
       'payloadSpaceTypeId','payloadSpaceMetalTypeId','chuteTypeId',
       'gridFinTypeId','gridFinMetalTypeId'].forEach(k => { if (m[k]) typeIds.add(m[k]); });
      if (m.fuel && m.fuel.typeId) typeIds.add(m.fuel.typeId);
      if (m.engineThrusters) Object.keys(m.engineThrusters).forEach(gk => {
        const g = m.engineThrusters[gk];
        if (g && g.thrusterTypeId) typeIds.add(g.thrusterTypeId);
      });
      if (m.rcsThruster && m.rcsThruster.thrusterTypeId) typeIds.add(m.rcsThruster.thrusterTypeId);
      if (m.payloadSpace && m.payloadSpace.typeId) typeIds.add(m.payloadSpace.typeId);
      if (m.payloadSpace && m.payloadSpace.metalTypeId) typeIds.add(m.payloadSpace.metalTypeId);
    });
    const types = {};
    typeIds.forEach(id => {
      const t = (typeof getComponentType === 'function') ? getComponentType(id) : null;
      if (t) types[id] = _stripFns(t);
    });
    const activeStk = (typeof getActiveStack === 'function') ? getActiveStack() : null;
    const derived = (activeStk && activeStk.derived) ? activeStk.derived : null;
    let stackPayloadMass = 0;
    if (activeStk && activeStk.payloadId && typeof getPayload === 'function') {
      const pl = getPayload(activeStk.payloadId);
      if (pl && Number.isFinite(pl.mass)) stackPayloadMass = pl.mass;
    }
    return {
      members: members.map(_stripFns), types, stackPayloadMass, derived,
      env: {
        EARTH_RADIUS: CONFIG.EARTH_RADIUS, GM_EARTH: CONFIG.GM_EARTH,
        EARTH_OMEGA: CONFIG.EARTH_OMEGA,
        LAUNCH_SITE_ALTITUDE: CONFIG.LAUNCH_SITE_ALTITUDE,
        LAUNCH_SITE_ANGLE_0: CONFIG.LAUNCH_SITE_ANGLE_0,
        G0: (typeof G0 !== 'undefined') ? G0 : 9.80665,
        REMOTE_AREA_MID_WEST_DEG:
          ((CONFIG.REMOTE_AREA_WEST_START_DEG || 0) + (CONFIG.REMOTE_AREA_WEST_END_DEG || 0)) / 2,
        REMOTE_AREA_WEST_START_DEG: CONFIG.REMOTE_AREA_WEST_START_DEG || 0,
        REMOTE_AREA_WEST_END_DEG: CONFIG.REMOTE_AREA_WEST_END_DEG || 0,
        PAYLOAD_EJECT_KICK_MPS: CONFIG.PAYLOAD_EJECT_KICK_MPS,
        SEA_LEVEL_DENSITY: CONFIG.SEA_LEVEL_DENSITY,
        SCALE_HEIGHT: CONFIG.SCALE_HEIGHT, DRAG_CD: CONFIG.DRAG_CD,
        DT: CONFIG.DT, GIMBAL_MAX_DEG: CONFIG.GIMBAL_MAX_DEG,
        GIMBAL_RATE_DEG_S: CONFIG.GIMBAL_RATE_DEG_S,
      },
    };
  }
  Derivation.setStackData(collectStackData());

  // ---------------------------------------------------------------------------
  // Local dispatch — same as tester / fast
  // ---------------------------------------------------------------------------
  function clampFlow(en, cmd) {
    if (!(cmd > 0)) return 0;
    return Math.max(Math.min(cmd, en.maxMassFlowRate || 0), en.minMassFlowRate || 0);
  }
  function localDispatch(msg) {
    let b;
    if (Number.isInteger(msg.targetBodyIdx) &&
        msg.targetBodyIdx >= 0 && msg.targetBodyIdx < state.bodies.length) {
      b = state.bodies[msg.targetBodyIdx];
    } else {
      b = state.bodies[state.activeBodyIndex];
    }
    if (!b) return;
    switch (msg.type) {
      case 'setGimbalRate': {
        if (!b.engines) break;
        const lim = CONFIG.GIMBAL_RATE_DEG_S;
        const rate = Math.max(-lim, Math.min(lim, msg.degPerSec));
        const onlyCenter = (msg.target === 'center');
        b.engines.filter(en => en.gimbal && (!onlyCenter || en.isCenter))
          .forEach(en => { en.targetGimbalRateDegS = rate; });
        break;
      }
      case 'setGimbal': {
        if (!b.engines) break;
        const lim = CONFIG.GIMBAL_MAX_DEG;
        const d = Math.max(-lim, Math.min(lim, msg.deg));
        b.engines.filter(en => en.gimbal).forEach(en => {
          en.targetGimbalDeg = d; en.targetGimbalRateDegS = NaN;
        });
        break;
      }
      case 'setAllThrottle': {
        if (!b.engines) break;
        b.engines.forEach(en => { en.targetMassFlowRate = clampFlow(en, msg.value); });
        break;
      }
      case 'setCenterThrottle': {
        if (!b.engines) break;
        b.engines.filter(en => en.isCenter).forEach(en => {
          en.targetMassFlowRate = clampFlow(en, msg.value);
        });
        break;
      }
      case 'setGroupThrottle': {
        if (!b.engines) break;
        (msg.angles || []).forEach(a => {
          const en = b.engines.find(e => e.angleDeg === a);
          if (en) en.targetMassFlowRate = clampFlow(en, msg.value);
        });
        break;
      }
      case 'rcs': { if (!b.rcsCmd) b.rcsCmd = {}; b.rcsCmd[msg.key] = !!msg.on; b.rcsDuty = null; break; }
      case 'rcsDuty': { if (msg.duties == null) b.rcsDuty = null; else b.rcsDuty = msg.duties; break; }
      case 'legs': { if (!b.legs) b.legs = { deployed: false, progress: 0 }; b.legs.deployed = !!msg.deployed; break; }
      case 'separate': { if (typeof requestSeparate === 'function') requestSeparate(b); break; }
      case 'splitFairing': { if (typeof splitFairingOnActiveBody === 'function') splitFairingOnActiveBody(b); break; }
      case 'releasePayload': { if (typeof requestReleasePayload === 'function') requestReleasePayload(msg, b); break; }
      case 'emergencyEject': { if (typeof emergencyEjectPayload === 'function') emergencyEjectPayload(b); break; }
      case 'takeControl': { if (typeof takeControlOfBody === 'function') takeControlOfBody(msg.idx); break; }
      default: break;
    }
  }
  Guidance.init(localDispatch);

  // ---------------------------------------------------------------------------
  // UI elements
  // ---------------------------------------------------------------------------
  const sel         = document.getElementById('guideSelect');
  const durInput    = document.getElementById('durationInput');
  const startBtn    = document.getElementById('startBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const tunPanel    = document.getElementById('tunables');
  const tunBody     = document.getElementById('tunablesBody');
  const presetSel   = document.getElementById('presetSelect');
  const presetStat  = document.getElementById('presetStatus');
  const summaryBody = document.getElementById('summaryBody');
  const captureList = document.getElementById('capturesList');
  const captureCnt  = document.getElementById('captureCount');
  const compareBox  = document.getElementById('compareBox');
  const compareBody = document.getElementById('compareBody');
  const statusEl    = document.getElementById('status');

  const guides = (Guidance.listGuides && Guidance.listGuides()) || [];
  const _labelOf = (g) => (Guidance.getGuideStatusLabel && Guidance.getGuideStatusLabel(g)) || '';
  sel.innerHTML = guides.length ?
    guides.map(g => {
      const lbl = _labelOf(g);
      return `<option value="${g}">${g}${lbl ? ' — ' + lbl : ''}</option>`;
    }).join('') :
    '<option value="">(no guides registered)</option>';

  if (!members.length) statusEl.textContent = '⚠ No active stack in fleet.';
  else statusEl.textContent = `Active stack: ${members.map(m => m.name).join(' → ')}`;

  // ---------------------------------------------------------------------------
  // Tunables
  // ---------------------------------------------------------------------------
  function _stepFor(key) {
    if (/SIGN|THRESHOLD|FRAC|K_DAMP|K_DQ|K_P|K_D|K_I|K_LEAD|T_SCALE|MARGIN|TOL|OMEGA/.test(key)) return 'any';
    if (/KM|_S$|S$/.test(key)) return 0.5;
    if (/DEG/.test(key)) return 0.1;
    if (/Q_SCALE|Q_REF/.test(key)) return 100;
    return 'any';
  }
  function tunableFieldsFor(guideName) {
    try {
      if (guideName === 'ascentAoaHold' && typeof Guidance.getAscentHoldConfig === 'function') {
        const c = Guidance.getAscentHoldConfig();
        return Object.keys(c).map(k => ({ key: k, value: c[k], step: _stepFor(k) }));
      }
      if (guideName === 'ascentRR' && typeof Guidance.getAscentRRConfig === 'function') {
        const c = Guidance.getAscentRRConfig();
        return Object.keys(c).map(k => ({ key: k, value: c[k], step: _stepFor(k) }));
      }
      if (guideName === 'predictivePlus' && typeof Guidance.getPredictiveGains === 'function') {
        const c = Guidance.getPredictiveGains();
        return Object.keys(c).map(k => ({ key: k, value: c[k], step: _stepFor(k) }));
      }
      if (guideName === 'leoInsertion' && typeof Guidance.getLeoInsertionConfig === 'function') {
        const c = Guidance.getLeoInsertionConfig();
        const out = [];
        Object.keys(c).forEach(k => {
          const v = c[k];
          if (v && typeof v === 'object' && !Array.isArray(v)) {
            Object.keys(v).forEach(kk => out.push({ key: k + '.' + kk, value: v[kk], step: _stepFor(kk) }));
          } else out.push({ key: k, value: v, step: _stepFor(k) });
        });
        return out;
      }
      if (guideName === 'leoInsertionV2' && typeof Guidance.getLeoInsertionV2Config === 'function') {
        const c = Guidance.getLeoInsertionV2Config();
        const out = [];
        Object.keys(c).forEach(k => {
          const v = c[k];
          if (v && typeof v === 'object' && !Array.isArray(v)) {
            Object.keys(v).forEach(kk => out.push({ key: k + '.' + kk, value: v[kk], step: _stepFor(kk) }));
          } else out.push({ key: k, value: v, step: _stepFor(k) });
        });
        return out;
      }
      if (guideName === 'predictivePlusAoAPush') {
        return [{ key: 'SWEEP_S', value: 10.0, step: 0.5 }];
      }
    } catch (e) { console.warn('[fast] tunableFieldsFor', e); }
    return [];
  }

  const tunablesState = {}; // guideName → { key: value }

  function renderTunablesFor(guideName) {
    const fields = tunableFieldsFor(guideName);
    if (!fields.length) { tunPanel.style.display = 'none'; tunBody.innerHTML = ''; return; }
    tunPanel.style.display = 'block';
    if (!tunablesState[guideName]) {
      tunablesState[guideName] = {};
      fields.forEach(f => { tunablesState[guideName][f.key] = f.value; });
    }
    tunBody.innerHTML = fields.map(f => {
      const v = tunablesState[guideName][f.key];
      return `<div class="tunable-row"><label title="${f.key}">${f.key}</label>
        <input type="number" data-key="${f.key}" value="${v}" step="${f.step}"></div>`;
    }).join('');
    tunBody.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        if (Number.isFinite(v)) tunablesState[guideName][e.target.dataset.key] = v;
      });
    });
  }

  function applyTunables(guideName) {
    const t = tunablesState[guideName];
    if (!t) return;
    try {
      if (guideName === 'ascentAoaHold') Guidance.setAscentHold(t);
      else if (guideName === 'ascentRR') Guidance.setAscentRR(t);
      else if (guideName === 'predictivePlus') Guidance.setPredictiveGains(t);
      else if (guideName === 'predictivePlusAoAPush') {
        if (Number.isFinite(t.SWEEP_S)) Guidance.setSweepDuration(t.SWEEP_S);
      } else if (guideName === 'leoInsertion' || guideName === 'leoInsertionV2') {
        const patch = {};
        Object.keys(t).forEach(k => {
          if (k.indexOf('.') >= 0) {
            const [outer, inner] = k.split('.');
            if (!patch[outer]) patch[outer] = {};
            patch[outer][inner] = t[k];
          } else patch[k] = t[k];
        });
        if (guideName === 'leoInsertion') Guidance.setLeoInsertion(patch);
        else Guidance.setLeoInsertionV2(patch);
      }
    } catch (e) { console.warn('[fast] applyTunables', e); }
  }

  sel.addEventListener('change', () => { renderTunablesFor(sel.value); refreshPresetList(); });
  if (guides.length) { renderTunablesFor(sel.value); }

  // ---------------------------------------------------------------------------
  // Preset system — flat/nested helpers from guidancePresets.js are available.
  // ---------------------------------------------------------------------------
  function _flatten(obj, prefix, out) {
    out = out || {}; prefix = prefix || '';
    if (!obj || typeof obj !== 'object') return out;
    Object.keys(obj).forEach(k => {
      const v = obj[k];
      const path = prefix ? prefix + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) _flatten(v, path, out);
      else out[path] = v;
    });
    return out;
  }
  function _nestedFromFlat(flat) {
    const out = {};
    Object.keys(flat).forEach(k => setByPath(out, k, flat[k]));
    return out;
  }

  function currentTunablesFlat() {
    return Object.assign({}, tunablesState[sel.value] || {});
  }

  function refreshPresetList() {
    const guideName = sel.value;
    if (!guideName || typeof getAllPresetsForGuide !== 'function') {
      presetSel.innerHTML = '<option value="">— presets unavailable —</option>';
      presetSel.disabled = true; return;
    }
    const list = getAllPresetsForGuide(guideName);
    presetSel.disabled = false;
    if (!list.length) {
      presetSel.innerHTML = '<option value="">— no presets —</option>'; return;
    }
    presetSel.innerHTML = '<option value="">— select a preset —</option>' +
      list.map(p => `<option value="${p.id}">${p.name}${p.isDefault ? ' · DEFAULT' : ''}</option>`).join('');
  }

  document.getElementById('presetLoadBtn').addEventListener('click', () => {
    const id = presetSel.value;
    if (!id) { presetStat.textContent = 'Select a preset first.'; return; }
    const p = getPresetById(id);
    if (!p) return;
    const ref = (typeof getGuideDefaultPreset === 'function') ? getGuideDefaultPreset(sel.value) : null;
    if (ref && typeof validateConstantsStrict === 'function') {
      const v = validateConstantsStrict(p.constants, ref.constants);
      if (!v.ok) { presetStat.textContent = 'Preset incompatible: ' + v.error; return; }
    }
    const flat = _flatten(p.constants);
    tunablesState[sel.value] = flat;
    renderTunablesFor(sel.value);
    presetStat.textContent = 'Loaded "' + p.name + '" (' + Object.keys(flat).length + ' keys).';
  });

  document.getElementById('presetSaveBtn').addEventListener('click', () => {
    const name = prompt('Preset name:', 'F9 LEO tuned');
    if (!name) return;
    const guideName = sel.value;
    if (!guideName) return;
    const flat = currentTunablesFlat();
    const nested = _nestedFromFlat(flat);
    let stackId = '', stackName = '';
    if (typeof getActiveStack === 'function') {
      const stk = getActiveStack();
      if (stk) { stackId = stk.id; stackName = stk.name; }
    }
    const rec = addUserPreset({
      name, description: '', guideName, stackId, stackName,
      tags: [], constants: nested,
    });
    if (rec) { refreshPresetList(); presetStat.textContent = 'Saved "' + rec.name + '".'; }
    else presetStat.textContent = 'Save failed.';
  });

  document.getElementById('presetDeleteBtn').addEventListener('click', () => {
    const id = presetSel.value;
    if (!id) { presetStat.textContent = 'Select a preset first.'; return; }
    const p = getPresetById(id);
    if (!p || p.isDefault) { presetStat.textContent = 'Default presets cannot be deleted.'; return; }
    if (!confirm('Delete preset "' + p.name + '"?')) return;
    if (deleteUserPreset(id)) { refreshPresetList(); presetStat.textContent = 'Deleted.'; }
  });

  document.getElementById('presetExportBtn').addEventListener('click', () => {
    const flat = currentTunablesFlat();
    const nested = _nestedFromFlat(flat);
    const json = JSON.stringify(nested, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(
        () => { presetStat.textContent = 'Copied ' + Object.keys(flat).length + ' keys.'; },
        () => { presetStat.textContent = 'Clipboard write failed.'; }
      );
    }
  });

  document.getElementById('presetImportBtn').addEventListener('click', () => {
    const raw = prompt('Paste constants JSON:');
    if (!raw) return;
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch (e) { presetStat.textContent = 'JSON parse error: ' + e.message; return; }
    const guideName = sel.value;
    const ref = (typeof getGuideDefaultPreset === 'function') ? getGuideDefaultPreset(guideName) : null;
    const nested = (Object.keys(parsed).some(k => k.includes('.'))) ? _nestedFromFlat(parsed) : parsed;
    if (ref && typeof validateConstantsStrict === 'function') {
      const v = validateConstantsStrict(nested, ref.constants);
      if (!v.ok) { presetStat.textContent = 'Validation failed: ' + v.error; return; }
    }
    tunablesState[guideName] = _flatten(nested);
    renderTunablesFor(guideName);
    presetStat.textContent = 'Imported ' + Object.keys(tunablesState[guideName]).length + ' keys.';
  });

  refreshPresetList();

  // ---------------------------------------------------------------------------
  // Capture logic
  // ---------------------------------------------------------------------------
  function _orbitalElements(rx, ry, vx, vy) {
    const GM = CONFIG.GM_EARTH;
    const r = Math.hypot(rx, ry);
    const ux = rx / r, uy = ry / r;
    const ex = ry / r, ey = -rx / r;
    const vr = vx * ux + vy * uy;
    const vt = vx * ex + vy * ey;
    const E = 0.5 * (vr * vr + vt * vt) - GM / r;
    const h = r * vt;
    let apo_km = Infinity, peri_km = -Infinity, ecc = NaN, a_km = Infinity, vApo = 0;
    const eSq = 1 + 2 * E * h * h / (GM * GM);
    const e = Math.sqrt(Math.max(0, eSq));
    ecc = e;
    if (E < 0) {
      const a = -GM / (2 * E);
      a_km = a / 1000;
      const ra = a * (1 + e);
      const rp = a * (1 - e);
      apo_km = (ra - CONFIG.EARTH_RADIUS) / 1000;
      peri_km = (rp - CONFIG.EARTH_RADIUS) / 1000;
      vApo = (ra > 0) ? Math.abs(h) / ra : 0;
    } else {
      apo_km = Infinity;
      peri_km = (E > 0) ? ((h * h / GM / (1 + e)) - CONFIG.EARTH_RADIUS) / 1000 : -Infinity;
    }
    return { r, vr, vt, apo_km, peri_km, ecc, a_km, vApo, h };
  }

  function _captureState() {
    const idx = state.activeBodyIndex;
    const b = state.bodies[idx];
    if (!b) return null;
    const gs = (Guidance.getGuideStatus && Guidance.getGuideStatus()) || {};
    const orb = _orbitalElements(b.rx, b.ry, b.vx, b.vy);
    const r = orb.r;
    const alt_km = (r - CONFIG.EARTH_RADIUS) / 1000;
    const phiI = Math.atan2(b.rx, b.ry);
    const phiEF = phiI - CONFIG.EARTH_OMEGA * state.simTime;
    const down_km = (CONFIG.EARTH_RADIUS * (phiEF - (CONFIG.LAUNCH_SITE_ANGLE_0 || 0))) / 1000;
    const localVert = Math.atan2(-b.rx, b.ry);
    const theta_rel_deg = (b.theta - localVert) * 180 / Math.PI;
    // Mass / fuel
    let mass_t = 0;
    try {
      const geom = (typeof geometryOf === 'function') ? geometryOf(b) : null;
      if (geom) mass_t = geom.M / 1000;
    } catch (e) {}
    const fuel_t = (b.fuelMass || 0) / 1000;
    const fuelArr = Array.isArray(b.memberFuel) ? b.memberFuel.map(x => x / 1000) : [];
    // Engines
    let thrust_MN = 0, mdot_kgps = 0, gimbalSum = 0, gimbalCount = 0;
    (b.engines || []).forEach(e => {
      thrust_MN += (e.currentF || 0) / 1e6;
      mdot_kgps += (e.massFlowRate || 0);
      if (e.gimbal) { gimbalSum += (e.gimbalDeg || 0); gimbalCount++; }
    });
    const gimbal_avg_deg = gimbalCount > 0 ? gimbalSum / gimbalCount : 0;
    // Aero / Q
    const w = (typeof windInertialVector === 'function') ? windInertialVector(b.rx, b.ry) : { wx: 0, wy: 0 };
    const sv = (typeof earthSurfaceVelocity === 'function') ? earthSurfaceVelocity(b.rx, b.ry) : { vx: 0, vy: 0 };
    const relVx = b.vx - (w.wx + sv.vx);
    const relVy = b.vy - (w.wy + sv.vy);
    const speedRel = Math.hypot(relVx, relVy);
    const rho = (typeof airDensity === 'function') ? airDensity(Math.max(0, alt_km * 1000)) : 0;
    const Q_kPa = 0.5 * rho * speedRel * speedRel / 1000;
    const cosT = Math.cos(b.theta), sinT = Math.sin(b.theta);
    const velBodyX = speedRel > 1e-6 ? (relVx * cosT + relVy * sinT) : 0;
    const sinAlpha = speedRel > 1e-6 ? Math.max(-1, Math.min(1, velBodyX / speedRel)) : 0;
    const aoa_deg = Math.asin(sinAlpha) * 180 / Math.PI;
    // Body list summary
    const bodyList = state.bodies.map(x => {
      const tag = x.isActive ? 'A' :
        (x.payloadBody ? 'P' : x.fairingHalf ? 'F' : x.isDiscarded ? 'B' : 'D');
      return tag;
    }).join(',');
    return {
      simTime: state.simTime,
      phase: gs.phase || '?',
      ascentPhase: gs.ascentPhase || null,
      alt_km, down_km,
      vr: orb.vr, vt: orb.vt,
      theta_rel_deg,
      omega: b.omega,
      apo_km: orb.apo_km, peri_km: orb.peri_km,
      ecc: orb.ecc, a_km: orb.a_km, vApo: orb.vApo,
      mass_t, fuel_t, fuelArr,
      thrust_MN, gimbal_avg_deg, mdot_kgps,
      Q_kPa, rho, aoa_deg,
      coastDV: (gs.coastDeltaV != null) ? gs.coastDeltaV : null,
      coastTRem: (gs.coastTRem != null) ? gs.coastTRem : null,
      stageBurnLocked: !!gs.stageBurnLocked,
      stageBurnTargetTiltDeg: gs.stageBurnTargetTiltDeg != null ? gs.stageBurnTargetTiltDeg : null,
      circAchieved: !!gs.circAchieved,
      bodyCount: state.bodies.length,
      bodyList,
      crashed: !!state.crashed, landed: !!state.landed, halted: !!state.halted,
    };
  }

  function _fmt(n, d) { return Number.isFinite(n) ? n.toFixed(d) : '—'; }

  function renderCaptures() {
    const filter = document.querySelector('.filter-chip.active').dataset.type;
    const shown = (filter === 'all') ? captures : captures.filter(c => c.type === filter);
    captureCnt.textContent = shown.length + ' / ' + captures.length;
    if (!shown.length) {
      captureList.innerHTML = '<div style="color: var(--dim); padding: 12px;">No captures of this type.</div>';
      return;
    }
    captureList.innerHTML = shown.map(c => {
      const s = c.state;
      const sub = s.ascentPhase ? ` <span class="sublabel">(ascent: ${s.ascentPhase})</span>` : '';
      const apoStr = Number.isFinite(s.apo_km) ? _fmt(s.apo_km, 1) + ' km' : '∞';
      const periStr = Number.isFinite(s.peri_km) ? _fmt(s.peri_km, 1) + ' km' : '—';
      const fuelArrStr = s.fuelArr.length ? s.fuelArr.map(x => _fmt(x, 1)).join(' / ') + ' t' : '—';
      return `<div class="capture type-${c.type}">
        <div class="head">
          <span class="time">T+${_fmt(c.simTime, 2)}s</span>
          <span class="label">${c.label}</span>
          ${sub}
        </div>
        <div class="body">
          <span><span class="k">phase</span> ${s.phase}</span>
          <span><span class="k">alt</span> ${_fmt(s.alt_km, 2)} km</span>
          <span><span class="k">down</span> ${_fmt(s.down_km, 2)} km</span>
          <span><span class="k">vr</span> ${_fmt(s.vr, 1)}</span>
          <span><span class="k">vt</span> ${_fmt(s.vt, 1)}</span>
          <span><span class="k">θ_rel</span> ${_fmt(s.theta_rel_deg, 3)}°</span>
          <span><span class="k">ω</span> ${_fmt(s.omega, 5)}</span>
          <span><span class="k">apogee</span> ${apoStr}</span>
          <span><span class="k">perigee</span> ${periStr}</span>
          <span><span class="k">e</span> ${_fmt(s.ecc, 4)}</span>
          <span><span class="k">v_apo</span> ${_fmt(s.vApo, 1)}</span>
          <span><span class="k">mass</span> ${_fmt(s.mass_t, 2)} t</span>
          <span><span class="k">fuel</span> ${_fmt(s.fuel_t, 2)} t</span>
          <span><span class="k">member fuel</span> ${fuelArrStr}</span>
          <span><span class="k">thrust</span> ${_fmt(s.thrust_MN, 3)} MN</span>
          <span><span class="k">mdot</span> ${_fmt(s.mdot_kgps, 1)} kg/s</span>
          <span><span class="k">gimbal avg</span> ${_fmt(s.gimbal_avg_deg, 4)}°</span>
          <span><span class="k">Q</span> ${_fmt(s.Q_kPa, 2)} kPa</span>
          <span><span class="k">ρ</span> ${_fmt(s.rho, 5)}</span>
          <span><span class="k">AoA</span> ${_fmt(s.aoa_deg, 3)}°</span>
          <span><span class="k">coastΔv</span> ${s.coastDV != null ? _fmt(s.coastDV, 2) : '—'}</span>
          <span><span class="k">coast t_rem</span> ${s.coastTRem != null ? _fmt(s.coastTRem, 1) : '—'}</span>
          <span><span class="k">lock</span> ${s.stageBurnLocked ? 'Y @ ' + _fmt(s.stageBurnTargetTiltDeg, 1) + '°' : 'N'}</span>
          <span><span class="k">bodies</span> ${s.bodyCount} [${s.bodyList}]</span>
          ${s.crashed ? '<span class="warn">CRASHED</span>' : ''}
          ${s.landed ? '<span class="hi">LANDED</span>' : ''}
          ${s.halted ? '<span class="warn">HALTED</span>' : ''}
        </div>
      </div>`;
    }).join('');
  }

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderCaptures();
    });
  });

  // ---------------------------------------------------------------------------
  // Run
  // ---------------------------------------------------------------------------
  let running = false, abort = false;
  let captures = [];        // current run
  let previousRun = null;   // { meta, tunables, summary, captures }

  function yieldToBrowser() { return new Promise(r => setTimeout(r, 0)); }

  function _pushCapture(type, label, st) {
    captures.push({ type, label, simTime: st.simTime, state: st });
  }

  async function run() {
    if (running) return;
    const guideName = sel.value;
    if (!guideName) { statusEl.textContent = 'Select a guide first.'; return; }

    running = true; abort = false;
    startBtn.disabled = true; stopBtn.disabled = false;

    applyTunables(guideName);
    captures = [];

    // Env
    if (typeof wind !== 'undefined' && wind) {
      wind.enabled = document.getElementById('envWindEnabled').checked;
      wind.speed = parseFloat(document.getElementById('envWindSpeed').value) || 0;
      wind.directionDeg = parseFloat(document.getElementById('envWindDir').value) || 0;
    }
    const fuelPct = Math.max(0, Math.min(100, parseFloat(document.getElementById('envFuelPct').value) || 0));
    CONFIG.DEFAULT_FUEL_FRACTION = fuelPct / 100;
    if (typeof atmosphereEnabled !== 'undefined') {
      atmosphereEnabled = document.getElementById('envAtmosphere').checked;
    }
    CONFIG.SLOSH_ENABLED = document.getElementById('envSlosh').checked;
    try { Guidance.setImuEnabled(document.getElementById('envImu').checked); } catch (e) {}

    const durationS = Math.max(1, parseFloat(durInput.value) || 800);
    const dt = CONFIG.DT;
    const maxTicks = Math.ceil(durationS / dt);

    resetState(0);
    try { Guidance.startGuide(guideName); } catch (e) { console.error('[fast] startGuide', e); }

    // State trackers for event detection
    let prevPhase = null, prevAscentPhase = null;
    let prevVrSign = 0;
    let prevBodyCount = state.bodies.length;
    let prevPayloadReleased = false;
    let prevCrashed = false, prevLanded = false, prevHalted = false;
    let stageBurnVrNegCaptured = false;
    let peakQ = { value: -Infinity, state: null };
    let peakG = { value: -Infinity, state: null };
    let ticksRun = 0;
    const t0 = performance.now();
    const CHUNK = 800;

    for (let i = 0; i < maxTicks; i++) {
      if (abort) break;
      if (state.halted) break;

      // Exact copy of fastforward.worker.js's proven loop:
      //   1. updateLegs(dt) before physicsStep
      //   2. physicsStep(dt)
      //   3. raw state.bodies snapshot after (no .map projection —
      //      derivation reads live body objects directly)
      //   4. Guidance.onSnapshot
      try { updateLegs(dt); } catch (le) { console.error('[fast] updateLegs', le); }
      physicsStep(dt);
      ticksRun++;
      const snap = {
        simTime: state.simTime,
        activeBodyIndex: state.activeBodyIndex,
        halted: !!state.halted,
        wind: (typeof wind !== 'undefined') ? {
          enabled: !!wind.enabled, speed: wind.speed || 0, directionDeg: wind.directionDeg || 0,
        } : { enabled: false, speed: 0, directionDeg: 0 },
        bodies: state.bodies,
      };
      try { Guidance.onSnapshot(snap); } catch (ge) { console.error('[fast] onSnapshot', ge); }

      // --- Capture logic (cheap: only on event) ---
      const gs = (Guidance.getGuideStatus && Guidance.getGuideStatus()) || {};
      const activeBody = state.bodies[state.activeBodyIndex];
      if (activeBody) {
        const orb = _orbitalElements(activeBody.rx, activeBody.ry, activeBody.vx, activeBody.vy);
        const vrSign = orb.vr > 0 ? 1 : (orb.vr < 0 ? -1 : 0);

        // Phase transition
        if (gs.phase && gs.phase !== prevPhase) {
          const st = _captureState();
          if (st) _pushCapture('phase', `PHASE → ${gs.phase}`, st);
          prevPhase = gs.phase;
          stageBurnVrNegCaptured = false;
        }
        // Ascent sub-phase transition (leoInsertionV2 shows ascentPhase during ASCENT)
        if (gs.ascentPhase && gs.ascentPhase !== prevAscentPhase) {
          const st = _captureState();
          if (st) _pushCapture('phase', `ascent: ${prevAscentPhase || '—'} → ${gs.ascentPhase}`, st);
          prevAscentPhase = gs.ascentPhase;
        }
        // Orbit crossings
        if (prevVrSign !== 0 && vrSign !== 0 && vrSign !== prevVrSign) {
          const st = _captureState();
          if (st) {
            const isApo = (prevVrSign > 0 && vrSign < 0);
            _pushCapture('orbit', isApo ? 'APOGEE crossing' : 'PERIGEE crossing', st);
          }
        }
        prevVrSign = vrSign;
        // STAGE_BURN vr negative = too high abort condition
        if (gs.phase === 'STAGE_BURN' && orb.vr < 0 && !stageBurnVrNegCaptured) {
          const st = _captureState();
          if (st) _pushCapture('abort', 'STAGE_BURN: vr went negative', st);
          stageBurnVrNegCaptured = true;
        }
      }
      // Body count change
      if (state.bodies.length !== prevBodyCount) {
        const st = _captureState();
        if (st) _pushCapture('event', `body count ${prevBodyCount} → ${state.bodies.length}`, st);
        prevBodyCount = state.bodies.length;
      }
      // Payload release flip
      {
        const ab = state.bodies[state.activeBodyIndex];
        const rel = !!(ab && ab.payloadReleased);
        if (rel !== prevPayloadReleased) {
          const st = _captureState();
          if (st) _pushCapture('event', rel ? 'payload released' : 'payload un-released', st);
          prevPayloadReleased = rel;
        }
      }
      // Crash / landed / halted
      {
        if (state.crashed && !prevCrashed) {
          const st = _captureState();
          if (st) _pushCapture('abort', 'CRASHED', st);
          prevCrashed = true;
        }
        if (state.landed && !prevLanded) {
          const st = _captureState();
          if (st) _pushCapture('event', 'LANDED', st);
          prevLanded = true;
        }
        if (state.halted && !prevHalted) {
          const st = _captureState();
          if (st) _pushCapture('event', 'HALTED', st);
          prevHalted = true;
        }
      }
      // Peak Q / G — snapshot at every new max, keep latest
      {
        const ab = state.bodies[state.activeBodyIndex];
        if (ab) {
          const alt = Math.hypot(ab.rx, ab.ry) - CONFIG.EARTH_RADIUS;
          const w = (typeof windInertialVector === 'function') ? windInertialVector(ab.rx, ab.ry) : { wx: 0, wy: 0 };
          const sv = (typeof earthSurfaceVelocity === 'function') ? earthSurfaceVelocity(ab.rx, ab.ry) : { vx: 0, vy: 0 };
          const relVx = ab.vx - (w.wx + sv.vx);
          const relVy = ab.vy - (w.wy + sv.vy);
          const sr = Math.hypot(relVx, relVy);
          const rho = (typeof airDensity === 'function') ? airDensity(Math.max(0, alt)) : 0;
          const Q = 0.5 * rho * sr * sr;
          if (Q > peakQ.value) {
            peakQ.value = Q;
            peakQ.state = _captureState();
          }
          const gAcc = (typeof gravityAccel === 'function') ? gravityAccel(ab.rx, ab.ry) : { ax: 0, ay: 0 };
          const g_proper = Math.hypot((ab._lastAccelX || 0) - 0, (ab._lastAccelY || 0) - 0) / 9.80665;
          if (g_proper > peakG.value) {
            peakG.value = g_proper;
            peakG.state = _captureState();
          }
        }
      }

      if (i > 0 && i % CHUNK === 0) {
        const wall = (performance.now() - t0) / 1000;
        statusEl.textContent = `Running… t=${state.simTime.toFixed(1)}s / ${durationS}s  ` +
          `(${ticksRun} ticks, ${(ticksRun / wall).toFixed(0)} ticks/s, ${captures.length} captures)`;
        await yieldToBrowser();
      }
    }

    try { Guidance.stopGuide(); } catch (e) {}

    const elapsedMs = performance.now() - t0;
    const tps = ticksRun / (elapsedMs / 1000);

    // Push peak captures now (they only had a snapshot saved, not a
    // chronological push, so ordering is: phase/orbit/... first, then peak)
    if (peakQ.state) captures.push({ type: 'peak', label: `PEAK Q = ${peakQ.value.toFixed(2)} Pa`, simTime: peakQ.state.simTime, state: peakQ.state });
    if (peakG.state) captures.push({ type: 'peak', label: `PEAK G = ${peakG.value.toFixed(2)} g`, simTime: peakG.state.simTime, state: peakG.state });
    // Final end snapshot
    {
      const st = _captureState();
      if (st) captures.push({ type: 'end', label: 'RUN END', simTime: st.simTime, state: st });
    }
    // Sort by simTime (peak/end may be out of order)
    captures.sort((a, b) => a.simTime - b.simTime);

    // ---- Summary ----
    const finalSt = captures.length ? captures[captures.length - 1].state : null;
    const totalFuelUsed_t = (() => {
      if (!finalSt) return 0;
      // initial fuel load across all members was set by DEFAULT_FUEL_FRACTION
      // — approximate as capacity * fuelPct. Compute exact by re-reading
      // memberMaxFuel on the active stack bottom member at reset.
      // Simpler: report final remaining fuel and the loaded pct.
      return null;
    })();

    const summary = {
      guide: guideName,
      duration: durationS,
      ticks: ticksRun,
      wallSeconds: elapsedMs / 1000,
      ticksPerSecond: tps,
      finalPhase: finalSt ? finalSt.phase : '?',
      crashed: !!(state.crashed),
      landed: !!(state.landed),
      halted: !!(state.halted),
      apogee_km: finalSt ? finalSt.apo_km : null,
      perigee_km: finalSt ? finalSt.peri_km : null,
      coastDV: finalSt ? finalSt.coastDV : null,
      coastTRem: finalSt ? finalSt.coastTRem : null,
      circAchieved: finalSt ? finalSt.circAchieved : false,
      fuelLeft_t: finalSt ? finalSt.fuel_t : null,
      maxQ_kPa: peakQ.value > 0 ? peakQ.value / 1000 : null,
      maxG: peakG.value > 0 ? peakG.value : null,
      capturesCount: captures.length,
    };

    summaryBody.innerHTML = Object.entries({
      'guide': summary.guide,
      'duration (s)': summary.duration,
      'ticks run': summary.ticks,
      'wall (s)': summary.wallSeconds.toFixed(2),
      'ticks/s': summary.ticksPerSecond.toFixed(0),
      'final phase': summary.finalPhase,
      'crashed': summary.crashed ? 'YES' : 'no',
      'landed': summary.landed ? 'YES' : 'no',
      'halted': summary.halted ? 'YES' : 'no',
      'final apogee (km)': Number.isFinite(summary.apogee_km) ? summary.apogee_km.toFixed(2) : '—',
      'final perigee (km)': Number.isFinite(summary.perigee_km) ? summary.perigee_km.toFixed(2) : '—',
      'coast Δv (m/s)': summary.coastDV != null ? summary.coastDV.toFixed(2) : '—',
      'coast t_rem (s)': summary.coastTRem != null ? summary.coastTRem.toFixed(1) : '—',
      'circ achieved': summary.circAchieved ? 'YES' : 'no',
      'fuel left (t)': summary.fuelLeft_t != null ? summary.fuelLeft_t.toFixed(2) : '—',
      'peak Q (kPa)': summary.maxQ_kPa != null ? summary.maxQ_kPa.toFixed(2) : '—',
      'peak G': summary.maxG != null ? summary.maxG.toFixed(2) : '—',
      'captures': summary.capturesCount,
    }).map(([k, v]) => `<span><span class="k">${k}</span> <span class="v">${v}</span></span>`).join('');

    // ---- Compare with previous run ----
    const currentRun = {
      meta: summary,
      tunables: Object.assign({}, tunablesState[guideName] || {}),
      captures,
    };

    if (previousRun && previousRun.meta.guide === summary.guide) {
      const prev = previousRun.meta;
      const rows = [];
      const pushRow = (label, a, b, cmp) => {
        let cls = '';
        if (typeof cmp === 'function') cls = cmp(a, b);
        rows.push(`<div class="compare-row"><span class="k">${label}</span>
          <span class="a">${a}</span><span class="arrow">→</span>
          <span class="b ${cls}">${b}</span></div>`);
      };
      // Constants diff
      const prevT = previousRun.tunables || {};
      const currT = currentRun.tunables || {};
      const allKeys = new Set([...Object.keys(prevT), ...Object.keys(currT)]);
      const constDiffs = [];
      allKeys.forEach(k => {
        const a = prevT[k], b = currT[k];
        if (a !== b) constDiffs.push(`<div class="compare-row"><span class="k">${k}</span>
          <span class="a">${a}</span><span class="arrow">→</span>
          <span class="b">${b}</span></div>`);
      });
      if (constDiffs.length) {
        compareBody.innerHTML = '<div style="grid-column: 1/-1;"><div style="color: var(--dim); font-size: 11px; margin-bottom: 4px;">CONSTANTS CHANGED</div>' +
          constDiffs.join('') + '</div>';
      } else {
        compareBody.innerHTML = '<div style="grid-column: 1/-1; color: var(--dim); font-size: 11px;">(no constant changes)</div>';
      }
      // Metric diff
      const metrics = [
        ['final phase', prev.finalPhase, summary.finalPhase, null],
        ['crashed', prev.crashed ? 'YES' : 'no', summary.crashed ? 'YES' : 'no', (a, b) => b === 'YES' && a !== 'YES' ? 'bad' : (a === 'YES' && b !== 'YES' ? 'good' : '')],
        ['final apogee (km)', Number.isFinite(prev.apogee_km) ? prev.apogee_km.toFixed(2) : '—', Number.isFinite(summary.apogee_km) ? summary.apogee_km.toFixed(2) : '—', null],
        ['final perigee (km)', Number.isFinite(prev.perigee_km) ? prev.perigee_km.toFixed(2) : '—', Number.isFinite(summary.perigee_km) ? summary.perigee_km.toFixed(2) : '—', null],
        ['coast Δv (m/s)', prev.coastDV != null ? prev.coastDV.toFixed(2) : '—', summary.coastDV != null ? summary.coastDV.toFixed(2) : '—', null],
        ['coast t_rem (s)', prev.coastTRem != null ? prev.coastTRem.toFixed(1) : '—', summary.coastTRem != null ? summary.coastTRem.toFixed(1) : '—', null],
        ['circ achieved', prev.circAchieved ? 'YES' : 'no', summary.circAchieved ? 'YES' : 'no', (a, b) => b === 'YES' && a !== 'YES' ? 'good' : '' ],
        ['fuel left (t)', prev.fuelLeft_t != null ? prev.fuelLeft_t.toFixed(2) : '—', summary.fuelLeft_t != null ? summary.fuelLeft_t.toFixed(2) : '—', null],
        ['peak Q (kPa)', prev.maxQ_kPa != null ? prev.maxQ_kPa.toFixed(2) : '—', summary.maxQ_kPa != null ? summary.maxQ_kPa.toFixed(2) : '—', null],
        ['peak G', prev.maxG != null ? prev.maxG.toFixed(2) : '—', summary.maxG != null ? summary.maxG.toFixed(2) : '—', null],
      ];
      compareBody.innerHTML += '<div style="grid-column: 1/-1; margin-top: 8px;"><div style="color: var(--dim); font-size: 11px; margin-bottom: 4px;">METRICS</div></div>';
      metrics.forEach(([k, a, b, cmp]) => {
        let cls = '';
        if (typeof cmp === 'function') cls = cmp(a, b);
        compareBody.innerHTML += `<div class="compare-row"><span class="k">${k}</span>
          <span class="a">${a}</span><span class="arrow">→</span>
          <span class="b ${cls}">${b}</span></div>`;
      });
      compareBox.classList.add('show');
    } else {
      compareBox.classList.remove('show');
    }

    previousRun = currentRun;

    // Render
    renderCaptures();
    statusEl.textContent = `Done. ${ticksRun} ticks in ${(elapsedMs / 1000).toFixed(2)}s — ` +
      `${tps.toFixed(0)} ticks/s — ${captures.length} captures.`;

    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  startBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', () => { abort = true; statusEl.textContent = 'Aborting…'; });

  console.log('[fast] ready. Guides:', guides.join(', '));
})();
</script>
</body>
</html>
