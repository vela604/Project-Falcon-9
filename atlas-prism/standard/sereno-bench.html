<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sereno bench</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --fg:#d6e0ea; --dim:#7d8b99; --ac:#5eead4; --bad:#f87171; --pn:#121923; --bd:#223042; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 12px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--ac); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  select, input, button { font: inherit; background: var(--pn); color: var(--fg); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 10px; }
  input { width: 80px; }
  button { background: #0f2a2a; border-color: #1d5a55; color: var(--ac); }
  button.alt { background: var(--pn); color: var(--fg); border-color: var(--bd); }
  button:disabled { opacity: .45; }
  #st { color: var(--dim); min-height: 1.4em; }
  pre { background: var(--pn); border: 1px solid var(--bd); border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-word; margin: 8px 0; max-width: 100%; }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<h1>SERENO BENCH · worker speed lab</h1>
<div class="row">
  <select id="stackSel"></select>
  <label>km <input id="km" type="number" value="320"></label>
</div>
<div class="row">
  <button id="bQuick">RUN QUICK (~4 min)</button>
  <button id="bDeep" class="alt">RUN DEEP (real probes, ~8 min)</button>
  <button id="bExp" class="alt">RUN EXP (coast, ~1 min)</button>
  <button id="bVer" class="alt">RUN VERIFY (stage-only, ~2 min)</button>
  <button id="bDorm" class="alt">RUN DORMANT VERIFY (~4 min)</button>
  <button id="bCopy" class="alt">COPY REPORT</button>
</div>
<div id="st">idle</div>
<pre id="out">Page ko screen on rakhke chalao. Quick test pehle.</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/worker-pool.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const lines = [];
  function P(s) { lines.push(String(s)); $('out').textContent = lines.join('\n'); }
  function status(s) { $('st').textContent = s; }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = (x, d) => (Number.isFinite(x) ? x.toFixed(d) : '-');
  function stat(a) {
    a = a.filter(Number.isFinite).sort((x, y) => x - y);
    if (!a.length) return { med: NaN, min: NaN, max: NaN, n: 0 };
    return { med: a[a.length >> 1], min: a[0], max: a[a.length - 1], n: a.length };
  }
  const fs = (s, d) => f(s.med, d) + ' [' + f(s.min, d) + '-' + f(s.max, d) + ']';

  // ---------- stacks (same filter as sereno-flux.html) ----------
  function eligibleStacks() {
    let stacks = [];
    try { stacks = (typeof loadStacks === 'function') ? loadStacks() : []; } catch (e) {}
    return stacks.filter((s) => s && s.sequence === 'standard' && s.locked);
  }
  (function fill() {
    const l = eligibleStacks(), sel = $('stackSel');
    sel.innerHTML = l.length ? l.map((s) => '<option value="' + s.id + '">' + String(s.name).replace(/[<>&]/g, '') + '</option>').join('')
                             : '<option value="">(no eligible stacks)</option>';
  })();

  function baselineValues(km) {
    const C = TunerConfig;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: 0.60, PUSH_T_S: 4.82, MECO_TARGET_BOOSTER_FUEL_KG: 60494 },
      insertion: { TARGET_ORBIT_ALT_KM: km, STAGE_BURN_AOA_BIAS_DEG: 1.8, CIRC_TRIGGER_LEAD_S: 5.53 },
      done: { DEORBIT_ENABLED: !!C.fixed.deorbitEnabled },
    };
  }

  const hc = navigator.hardwareConcurrency || 4;
  const maxW = Math.max(1, hc - 1);
  const NS = Array.from(new Set([1, 2, 4, maxW].filter((x) => x <= maxW))).sort((a, b) => a - b);
  const RES = { cpu: {}, sim: {}, deep: {} };

  // ---------- A. pure-JS CPU scaling (no sim) ----------
  const CPU_SRC = 'onmessage=function(e){var R=e.data.reps,I=e.data.iters,o=[],x=0.5;for(var r=0;r<R;r++){var t=performance.now();for(var i=0;i<I;i++){x=Math.sin(x)*Math.sqrt(x*x+1.0)+1e-9*i;}o.push(performance.now()-t);}postMessage({o:o,x:x});};';
  async function cpuPhase(n) {
    const url = URL.createObjectURL(new Blob([CPU_SRC], { type: 'text/javascript' }));
    const ws = [];
    for (let i = 0; i < n; i++) ws.push(new Worker(url));
    // warm-up so all start together
    await Promise.all(ws.map((w) => new Promise((res) => { w.onmessage = () => res(); w.postMessage({ reps: 1, iters: 1000 }); })));
    const outs = await Promise.all(ws.map((w) => new Promise((res) => { w.onmessage = (e) => res(e.data.o); w.postMessage({ reps: 5, iters: 12e6 }); })));
    ws.forEach((w) => w.terminate()); URL.revokeObjectURL(url);
    const per = outs.map((o) => stat(o).med);   // median rep per worker
    const s = stat(per); RES.cpu[n] = s;
    P('  n=' + n + '  ms/rep ' + fs(s, 0));
  }

  // ---------- B. sim phase ----------
  function newStats(n) { const a = []; for (let i = 0; i < n; i++) a.push({ ticks: 0, p: {}, bench: null }); return a; }
  async function makePool(n, stkId, st) {
    try { setSelectedStackId(stkId); } catch (e) {}
    const pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' });
    pool.workers.forEach((w, i) => w.addEventListener('message', (ev) => {
      const m = ev.data || {}, s = st[i]; if (!s) return;
      if (m.type === 'ops') s.ticks += +m.n || 0;
      else if (m.type === 'prof') {
        if (m.d) for (const k in m.d) s.p[k] = (s.p[k] || 0) + (+m.d[k] || 0);
        if (m.bench) s.bench = m.bench;
      }
    }));
    await pool.waitReady();
    return pool;
  }
  async function simPhase(n, stkId, km) {
    const st = newStats(n), vals = baselineValues(km);
    status('sim n=' + n + ': boot');
    const pool = await makePool(n, stkId, st);
    status('sim n=' + n + ': setupSA');
    const t0 = performance.now();
    const sa = await Promise.all(Array.from({ length: n }, () => pool.runJob('setupSA', { values: vals })));
    const saS = (performance.now() - t0) / 1000;
    if (sa.some((r) => !r.ok)) P('  n=' + n + ' setupSA FAIL: ' + (sa.find((r) => !r.ok) || {}).reason);
    status('sim n=' + n + ': benchLoop');
    const t1 = performance.now();
    const rr = await Promise.all(Array.from({ length: n }, () => pool.runJob('benchLoop', { ticks: 2000, values: vals })));
    const blS = (performance.now() - t1) / 1000;
    const g = (k) => stat(rr.map((r) => r[k]));
    const R = { saS, blS, raw: g('raw'), gs: g('gs'), circ: g('circ'), cwRaw: g('cwRaw'), cwGs: g('cwGs'), cycle: g('cycle'), prep: g('prepMs'),
      toCoastMs: g('toCoastMs'), toCoastTicks: g('toCoastTicks'), cwOk: rr.filter((r) => r.coastReached).length,
      b: { gsUs: stat(st.map((s) => s.bench && s.bench.gsUs)), cap: stat(st.map((s) => s.bench && s.bench.capMs)), res: stat(st.map((s) => s.bench && s.bench.resMs)), kb: stat(st.map((s) => s.bench && s.bench.snapKB)) } };
    RES.sim[n] = R;
    P('n=' + n + '   setupSA ' + f(saS, 1) + 's · loops ' + f(blS, 1) + 's · coast reached ' + R.cwOk + '/' + n);
    P('  µs/tick med [min-max]');
    P('  burn raw   ' + fs(R.raw, 0));
    P('  burn +gs   ' + fs(R.gs, 0));
    P('  burn +circ ' + fs(R.circ, 0));
    if (R.cwOk) { P('  coast raw  ' + fs(R.cwRaw, 0)); P('  coast +gs  ' + fs(R.cwGs, 0)); P('  evalcycle  ' + fs(R.cycle, 0) + '  (restore+400t)'); }
    P('  to-coast   ' + f(R.toCoastTicks.med, 0) + ' ticks, ' + f(R.toCoastMs.med / 1000, 1) + 's');
    P('  getGS ' + f(R.b.gsUs.med, 1) + 'µs · capture ' + f(R.b.cap.med, 1) + 'ms · restore ' + f(R.b.res.med, 1) + 'ms · snap ' + f(R.b.kb.med, 0) + 'KB · prepareRun ' + f(R.prep.med, 0) + 'ms');
    await pool.terminate();
    await sleep(800);
  }

  // ---------- C. deep: real probes ----------
  async function deepPhase(n, stkId, km, njobs) {
    const st = newStats(n), vals = baselineValues(km);
    status('deep n=' + n + ': boot');
    const pool = await makePool(n, stkId, st);
    status('deep n=' + n + ': setupSA');
    await Promise.all(Array.from({ length: n }, () => pool.runJob('setupSA', { values: vals })));
    st.forEach((s) => { s.ticks = 0; s.p = {}; });
    const biases = []; for (let i = 0; i < njobs; i++) biases.push(Math.round((1.70 + i * 0.05) * 1000) / 1000);
    status('deep n=' + n + ': ' + njobs + ' probes…');
    const t0 = performance.now(); let done = 0;
    const res = await Promise.all(biases.map((b) => pool.runJob('probeBiasCheckpoint', { bias: b, altKm: km }).then((r) => { done++; status('deep n=' + n + ': ' + done + '/' + njobs); return r; }, (e) => ({ ok: false, reason: e.message }))));
    const wall = (performance.now() - t0) / 1000;
    const rate = st.map((s) => (s.p.job > 0 ? s.ticks / (s.p.job / 1000) : NaN));
    const sum = (k) => st.reduce((a, s) => a + (s.p[k] || 0), 0);
    const jobMs = sum('job'), tot = st.reduce((a, s) => a + s.ticks, 0);
    const us = (ms, t) => (t > 0 ? f(ms * 1000 / t, 0) : '-');
    const R = { rate: stat(rate), wall, tot, restore: sum('restore') / jobMs * 100, capture: sum('capture') / jobMs * 100, prep: sum('prep') / jobMs * 100 };
    RES.deep[n] = R;
    P('n=' + n + '  jobs ' + njobs + ' · wall ' + f(wall, 0) + 's · ticks ' + tot + ' · ok ' + res.filter((r) => r && r.ok).length);
    P('  ticks/s per worker ' + fs(R.rate, 0));
    P('  of job time: restore ' + f(R.restore, 0) + '% · capture ' + f(R.capture, 0) + '% · prepare ' + f(R.prep, 0) + '%');
    P('  µs/tick: coast ' + us(sum('ch'), sum('chT')) + ' · circ-eval ' + us(sum('circ'), sum('circT')) + ' · full ' + us(sum('full'), sum('fullT')));
    await pool.terminate();
    await sleep(800);
  }

  // ---------- D. experiment: coast tick breakdown + extra-bodies test ----------
  async function expPhase(stkId, km) {
    const st = newStats(1), vals = baselineValues(km);
    status('exp: boot');
    const pool = await makePool(1, stkId, st);
    status('exp: setupSA');
    const sa = await pool.runJob('setupSA', { values: vals });
    if (!sa.ok) throw new Error('setupSA failed: ' + sa.reason);
    status('exp: running');
    const r = await pool.runJob('benchExp', { ticks: 1500, values: vals });
    await pool.terminate();
    if (r.err) P('EXP ERROR: ' + r.err);
    if (!r.coastReached) { P('EXP: coast not reached'); return; }
    P('--- D. coast experiment (1 worker, from COAST_WAIT, us per tick/call) ---');
    P('bodies ' + r.nBodies + ' [' + r.roles + '] · to-coast ' + r.toCoastTicks + ' ticks');
    const g = (x, d) => f(x, d === undefined ? 0 : d);
    P('tick breakdown (all bodies):');
    P('  physics only    ' + g(r.physOnly) + '   (' + g(r.physOnly / r.tickAll * 100) + '% of tick)');
    P('  + buildSnapshot ' + g(r.physSnap) + '   (snapshot ' + g(r.physSnap - r.physOnly) + ')');
    P('  full tick       ' + g(r.tickAll) + '   (guidance+IMU ' + g(r.tickAll - r.physSnap) + ')');
    P('  tick + getGS    ' + g(r.tickAllGs));
    P('direct: buildSnapshot ' + g(r.buildSnap, 1) + ' · onSnapshot ' + g(r.onSnap, 1) + ' · getGS ' + g(r.gs, 1) + ' · collision ' + g(r.collision, 1));
    P('per-body per-call us:');
    const cols = ['currentGeometry', 'buildPodEntries', 'fillGeom', 'slosh', 'thrust', 'rcs', 'drag', 'deriv', 'ground', 'lowAlt'];
    P('  ' + 'body'.padEnd(9) + cols.map((c) => c.slice(0, 7).padStart(8)).join(''));
    let sum = 0;
    r.perBody.forEach((o) => {
      P('  ' + (o.role + '/' + o.members).padEnd(9) + cols.map((c) => g(o[c], 1).padStart(8)).join(''));
      cols.forEach((c) => { if (Number.isFinite(o[c])) sum += o[c]; });
    });
    P('  sum of listed calls over all bodies: ' + g(sum) + ' us (deriv x4 per RK4 not included)');
    if (r.oneBodyPhys !== undefined) {
      P('STAGE-ONLY (experiment, changes sim): physics ' + g(r.oneBodyPhys) + ' vs ' + g(r.physOnly) + ' -> x' + f(r.physOnly / r.oneBodyPhys, 2) +
        ' · tick+gs ' + g(r.oneBodyTickGs) + ' vs ' + g(r.tickAllGs) + ' -> x' + f(r.tickAllGs / r.oneBodyTickGs, 2) + ' faster');
    }
  }


  // ---------- E. verify: is the stage independent of booster/fairings after COAST_WAIT? ----------
  async function verPhase(stkId, km) {
    const st = newStats(1), vals = baselineValues(km);
    status('verify: boot');
    const pool = await makePool(1, stkId, st);
    status('verify: setupSA');
    const sa = await pool.runJob('setupSA', { values: vals });
    if (!sa.ok) throw new Error('setupSA failed: ' + sa.reason);
    status('verify: running (3 runs)');
    const r = await pool.runJob('benchVerify', { ticks: 150000 });
    await pool.terminate();
    if (r.err) P('VERIFY ERROR: ' + r.err);
    if (!r.coastReached) { P('VERIFY: coast not reached'); return; }
    const A = r.A, A2 = r.A2, B = r.B;
    const d = (x) => x === -1 ? 'IDENTICAL' : x === -2 ? 'LENGTH DIFFERS' : 'DIFFERS by tick ~' + x;
    P('--- E. verify (1 worker, from COAST_WAIT to DONE+300 ticks) ---');
    P('ticks A ' + A.n + ' · A2 ' + A2.n + ' · B ' + B.n + ' · bodies at end A ' + A.nb + ' / B ' + B.nb);
    P('CONTROL  A vs A2 (same run twice): ' + d(r.divAA2));
    P('TEST     A vs B  (stage-only)    : ' + d(r.divAB));
    P('  final stage state equal: ' + r.fsEqAB + ' · final guidance fields equal: ' + r.gsEqAB + ' · phase timeline equal: ' + r.phasesEqAB);
    P('phases A: ' + A.phases.join(' '));
    if (!r.phasesEqAB) P('phases B: ' + B.phases.join(' '));
    P('final A: ' + JSON.stringify(A.gs));
    if (!r.gsEqAB) P('final B: ' + JSON.stringify(B.gs));
    P('wall: A ' + f(A.ms / 1000, 1) + 's · A2 ' + f(A2.ms / 1000, 1) + 's · B ' + f(B.ms / 1000, 1) + 's -> B is x' + f(A2.ms / B.ms, 2) + ' faster');
    P('clearance stage vs others in A (m, bounding-circle gap; <=0 means broad-phase overlap):');
    A.gaps.forEach((g) => P('  ' + g.role.padEnd(8) + ' start ' + f(g.first, 0) + ' · min ' + f(g.min, 0) + ' @tick ' + g.minTick + ' · end ' + f(g.last, 0)));
    P('collision contacts in A: ticks ' + A.contacts.ticks + ' · pairs ' + JSON.stringify(A.contacts.pairs) + (A.contacts.err ? ' · ERR ' + A.contacts.err : ''));
  }


  // ---------- F. dormant verify: SA -> DONE, dormancy off vs on ----------
  async function dormPhase(stkId, km) {
    const st = newStats(1), vals = baselineValues(km);
    status('dormant: boot');
    const pool = await makePool(1, stkId, st);
    status('dormant: setupSA');
    const sa = await pool.runJob('setupSA', { values: vals });
    if (!sa.ok) throw new Error('setupSA failed: ' + sa.reason);
    status('dormant: running (7 runs)');
    const r = await pool.runJob('benchDormant', { ticks: 200000 });
    await pool.terminate();
    if (r.err) P('DORMANT ERROR: ' + r.err);
    P('--- F. dormant verify (SA -> DONE+300 ticks, flag off vs on, bit-exact stage+payload hash) ---');
    let all = true;
    r.sets.forEach((S) => {
      const tag = 'bias ' + S.ov[0] + ' lead ' + S.ov[1];
      all = all && S.eqOn && (S.eqOn37 !== false);
      P('[' + tag + ']  ticks ' + S.off.n + ' · off ' + f(S.off.ms / 1000, 1) + 's · on ' + f(S.on.ms / 1000, 1) + 's -> x' + f(S.off.ms / S.on.ms, 2));
      P('   off vs on(200): ' + (S.eqOn ? 'IDENTICAL' : 'DIFFERENT  off ' + JSON.stringify(S.off.gs) + '  on ' + JSON.stringify(S.on.gs)));
      if (S.on37) P('   off vs on(37) : ' + (S.eqOn37 ? 'IDENTICAL' : 'DIFFERENT') + '  (different check period)');
      P('   dormant at ticks (body idx:tick): ' + JSON.stringify(S.on.dorm));
    });
    P('VERDICT: ' + (all && !r.err ? 'ALL IDENTICAL -> safe to set DORMANT_ON=true' : 'NOT IDENTICAL -> keep DORMANT_ON=false, paste this report'));
  }

  // ---------- verdict ----------
  function verdict() {
    const a = NS[0], z = NS[NS.length - 1];
    P(''); P('=== VERDICT (heuristic) ===');
    if (a !== z && RES.cpu[a] && RES.cpu[z]) {
      const c = RES.cpu[z].med / RES.cpu[a].med;
      P('CPU-only: n=' + z + ' vs n=1 = x' + f(c, 2) + (c >= 1.4 ? '  -> DEVICE slows with threads (little cores/thermal)' : '  -> device scales ok'));
    }
    if (a !== z && RES.sim[a] && RES.sim[z]) {
      const s = RES.sim[z].raw.med / RES.sim[a].raw.med;
      P('Sim raw tick: n=' + z + ' vs n=1 = x' + f(s, 2) + (s >= 1.4 ? '  (slowdown with threads)' : '  (no thread slowdown)'));
      const sp = RES.sim[z].raw.max / RES.sim[z].raw.min;
      P('Worker spread at n=' + z + ': slowest/fastest = x' + f(sp, 2) + (sp >= 1.8 ? '  -> big/little split' : ''));
    }
    const R = RES.sim[a];
    if (R) {
      P('1-thread raw: ' + f(1e6 / R.raw.med, 0) + ' ticks/s');
      P('getGuideStatus every tick: +' + f((R.gs.med / R.raw.med - 1) * 100, 0) + '%   circ shape: +' + f((R.circ.med / R.raw.med - 1) * 100, 0) + '%');
      if (R.cwOk) P('coast tick vs burn tick: x' + f(R.cwRaw.med / R.raw.med, 2) + '   evalcycle vs coast+gs: x' + f(R.cycle.med / R.cwGs.med, 2));
      P('restore = ' + f(R.b.res.med * 1000 / R.raw.med, 0) + ' ticks · capture = ' + f(R.b.cap.med * 1000 / R.raw.med, 0) + ' ticks · prepareRun = ' + f(R.prep.med * 1000 / R.raw.med, 0) + ' ticks');
    }
    const d1 = RES.deep[NS[0]], dz = RES.deep[NS[NS.length - 1]];
    if (d1 && R && R.cwOk) P('Deep: real probe rate ' + f(d1.rate.med, 0) + ' ticks/s vs coast+gs bench ' + f(1e6 / R.cwGs.med, 0) + ' ticks/s -> outside-tick loss ' + f((1 - d1.rate.med / (1e6 / R.cwGs.med)) * 100, 0) + '%');
    if (d1 && dz && d1 !== dz) P('Deep: per-worker rate n=' + NS[NS.length - 1] + ' vs n=1 = x' + f(dz.rate.med / d1.rate.med, 2));
  }

  // ---------- runner ----------
  let running = false;
  async function run(deep) {
    if (running) return; running = true;
    $('bQuick').disabled = $('bDeep').disabled = true;
    lines.length = 0;
    let wl = null; try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    try {
      const stkId = $('stackSel').value, km = parseInt($('km').value, 10) || 320;
      if (!stkId) throw new Error('no eligible stack (open the main page once / check localStorage)');
      P('SERENO BENCH ' + new Date().toISOString().slice(0, 19));
      P('cores ' + hc + ' · workers max ' + maxW + ' · mem ' + (navigator.deviceMemory || '?') + 'GB · stack ' + stkId + ' · ' + km + 'km');
      P('UA ' + navigator.userAgent.replace(/\s+/g, ' ').slice(0, 90));
      P(''); P('--- A. pure JS CPU scaling (no sim) ---');
      for (const n of NS) { status('cpu n=' + n); await cpuPhase(n); }
      P(''); P('--- B. sim loops (fixed work, concurrent workers) ---');
      for (const n of NS) await simPhase(n, stkId, km);
      if (deep) {
        P(''); P('--- C. real probes ---');
        await deepPhase(1, stkId, km, 2);
        if (maxW > 1) await deepPhase(maxW, stkId, km, maxW);
      }
      verdict();
      status('done');
    } catch (e) {
      P('ERROR: ' + (e && e.message || e)); status('error');
    } finally {
      try { if (wl) wl.release(); } catch (e) {}
      running = false; $('bQuick').disabled = $('bDeep').disabled = false;
    }
  }
  $('bExp').onclick = async () => {
    if (running) return; running = true;
    $('bQuick').disabled = $('bDeep').disabled = $('bExp').disabled = true;
    lines.length = 0;
    let wl = null; try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    try {
      const stkId = $('stackSel').value, km = parseInt($('km').value, 10) || 320;
      if (!stkId) throw new Error('no eligible stack');
      P('SERENO BENCH EXP ' + new Date().toISOString().slice(0, 19));
      P('cores ' + hc + ' · stack ' + stkId + ' · ' + km + 'km');
      await expPhase(stkId, km);
      status('done');
    } catch (e) { P('ERROR: ' + (e && e.message || e)); status('error'); }
    finally { try { if (wl) wl.release(); } catch (e) {} running = false; $('bQuick').disabled = $('bDeep').disabled = $('bExp').disabled = false; $('bDorm').disabled = false; }
  };
  $('bVer').onclick = async () => {
    if (running) return; running = true;
    const bs = ['bQuick', 'bDeep', 'bExp', 'bVer'];
    bs.forEach((i) => { $(i).disabled = true; });
    lines.length = 0;
    let wl = null; try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    try {
      const stkId = $('stackSel').value, km = parseInt($('km').value, 10) || 320;
      if (!stkId) throw new Error('no eligible stack');
      P('SERENO BENCH VERIFY ' + new Date().toISOString().slice(0, 19));
      P('cores ' + hc + ' · stack ' + stkId + ' · ' + km + 'km');
      await verPhase(stkId, km);
      status('done');
    } catch (e) { P('ERROR: ' + (e && e.message || e)); status('error'); }
    finally { try { if (wl) wl.release(); } catch (e) {} running = false; bs.forEach((i) => { $(i).disabled = false; }); }
  };
  $('bDorm').onclick = async () => {
    if (running) return; running = true;
    const bs = ['bQuick', 'bDeep', 'bExp', 'bVer', 'bDorm'];
    bs.forEach((i) => { $(i).disabled = true; });
    lines.length = 0;
    let wl = null; try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    try {
      const stkId = $('stackSel').value, km = parseInt($('km').value, 10) || 320;
      if (!stkId) throw new Error('no eligible stack');
      P('SERENO BENCH DORMANT ' + new Date().toISOString().slice(0, 19));
      P('cores ' + hc + ' · stack ' + stkId + ' · ' + km + 'km');
      await dormPhase(stkId, km);
      status('done');
    } catch (e) { P('ERROR: ' + (e && e.message || e)); status('error'); }
    finally { try { if (wl) wl.release(); } catch (e) {} running = false; bs.forEach((i) => { $(i).disabled = false; }); }
  };
  $('bQuick').onclick = () => run(false);
  $('bDeep').onclick = () => run(true);
  $('bCopy').onclick = async () => {
    const t = lines.join('\n');
    try { await navigator.clipboard.writeText(t); status('copied'); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); status('copied'); } catch (x) { status('copy failed - screenshot lo'); } ta.remove(); }
  };
})();
</script>
