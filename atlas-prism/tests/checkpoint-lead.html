<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkpoint Lead Convergence</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
table { border-collapse:collapse; font-size:12px; width:100%; margin-top:8px; }
th, td { padding:5px 10px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.heading td { background:rgba(53,214,255,0.06); color:#35d6ff; font-weight:600; }
tr.hl td { background:rgba(74,222,128,0.06); }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:280px; }
</style>
</head>
<body>

<h1>Checkpoint Lead Convergence</h1>

<select id="presetSel" style="background:#101a30;color:#dbe6f5;border:1px solid #1c2b45;
        padding:8px 12px;border-radius:4px;font:inherit;cursor:pointer;margin-right:8px;"></select>
<button id="runBtn">Run + converge</button>
<button id="clearBtn">Clear</button>
<div id="status">idle</div>

<table id="t"><tbody></tbody></table>
<pre id="raw">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../../js/guidancePresets.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, DT = CONFIG.DT;
  const LEAD_QUANTUM = 0.0125;

  function fmt(x, d) { return Number.isFinite(x) ? x.toFixed(d) : '—'; }
  function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }

  function timeToApogee(rx, ry, vx, vy) {
    const r = Math.hypot(rx, ry);
    const vr = (vx * rx + vy * ry) / r;
    const vt = (vx * ry - vy * rx) / r;
    const E = 0.5 * (vr * vr + vt * vt) - GM / r;
    if (E >= 0) return Infinity;
    const a = -GM / (2 * E);
    const h = r * vt;
    const eSq = 1 + 2 * E * h * h / (GM * GM);
    const e = Math.sqrt(Math.max(0, eSq));
    if (e < 1e-9) return Math.PI * Math.sqrt((a * a * a) / GM);
    const cosE = (1 - r / a) / e;
    const sinE = (r * vr) / (e * Math.sqrt(GM * a));
    let Ean = Math.atan2(sinE, cosE);
    if (Ean < 0) Ean += 2 * Math.PI;
    const M = Ean - e * Math.sin(Ean);
    const n = Math.sqrt(GM / (a * a * a));
    return M < Math.PI ? (Math.PI - M) / n : (3 * Math.PI - M) / n;
  }

  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }

  function presetValues() {
    const sel = $('presetSel');
    const id = sel && sel.value;
    let preset = null;
    if (id) {
      if (typeof getPresetById === 'function') preset = getPresetById(id);
      if (!preset && typeof getGuideDefaultPreset === 'function' && id.startsWith('default:')) {
        preset = getGuideDefaultPreset(id.slice(8));
      }
    }
    if (preset && preset.constants) return { values: preset.constants, guideName: preset.guideName || 'leoInsertionV3' };
    const b = TunerConfig.baselineRaw;
    return {
      values: {
        ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
        insertion: { TARGET_ORBIT_ALT_KM: 320,
                     STAGE_BURN_AOA_BIAS_DEG: b.bias,
                     STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                     CIRC_TRIGGER_LEAD_S: b.lead },
        done: { DEORBIT_ENABLED: false },
      },
      guideName: 'leoInsertionV3',
    };
  }

  let g_snapshot = null;

  function captureSnapshot() {
    return {
      bodies: deepClone(state.bodies),
      simTime: state.simTime,
      activeBodyIndex: state.activeBodyIndex,
      halted: state.halted,
      landed: state.landed,
      crashed: state.crashed,
      guidanceState: Guidance.exportGuideState(),
    };
  }

  function restoreSnapshot(snap, newLead) {
    state.simTime = snap.simTime;
    state.activeBodyIndex = snap.activeBodyIndex;
    state.halted = snap.halted;
    state.landed = snap.landed;
    state.crashed = snap.crashed;

    const sb = snap.bodies;
    while (state.bodies.length > sb.length) state.bodies.pop();
    while (state.bodies.length < sb.length) state.bodies.push({});

    for (let i = 0; i < sb.length; i++) {
      const src = sb[i], dst = state.bodies[i];
      Object.keys(dst).forEach(k => { delete dst[k]; });
      Object.keys(src).forEach(k => { dst[k] = deepClone(src[k]); });
    }

    const g = deepClone(snap.guidanceState);
    if (newLead !== undefined && newLead !== null) {
      if (g.guideConfigs && g.guideConfigs.leoInsertionV3 && g.guideConfigs.leoInsertionV3.insertion) {
        g.guideConfigs.leoInsertionV3.insertion.CIRC_TRIGGER_LEAD_S = newLead;
      }
      if (g.v3InsertionBlock && g.v3InsertionBlock.constants) {
        g.v3InsertionBlock.constants.CIRC_TRIGGER_LEAD_S = newLead;
      }
      if (g.v3InsertionBlock && g.v3InsertionBlock.st) {
        delete g.v3InsertionBlock.st._circLeadCached;
      }
    }
    Guidance.importGuideState(g);
  }

  async function attempt(lead) {
    restoreSnapshot(g_snapshot, lead);
    let circStartT = NaN, circEndT = NaN, marginS = NaN, vrEnd = NaN, payloadT = NaN;
    let prevPhase = Guidance.getGuideStatus().phase;
    window._vrTrace = [];
    window._abortReason = null;
    // Scale cap by target altitude: baseline 320km needs ~60s post-CW,
    // high orbits (2000km) need ~500s (longer stage burn + coast).
    const tgtAlt = (g_snapshot && g_snapshot.__targetAltKm) ? g_snapshot.__targetAltKm : 320;
    const capS = 400;   // CH → burn → CH_2 → payload
    const maxTicks = Math.ceil(capS / DT);
    for (let i = 0; i < maxTicks; i++) {
      if (state.halted) break;
      TunerEngine.tick(DT);
      const gs = Guidance.getGuideStatus();
      const phase = gs.phase;
      if (phase === 'CIRCULARIZE' && prevPhase !== 'CIRCULARIZE') circStartT = state.simTime;
      if (phase === 'COAST_ROTATE_2' && prevPhase !== 'COAST_ROTATE_2') {
        circEndT = state.simTime;
        const stb = findStage();
        if (stb) {
          const r = Math.hypot(stb.rx, stb.ry);
          const vr = (stb.vx * stb.rx + stb.vy * stb.ry) / r;
          const vt = (stb.vx * stb.ry - stb.vy * stb.rx) / r;
          vrEnd = vr;
          const tApo = timeToApogee(stb.rx, stb.ry, stb.vx, stb.vy);
          const E = 0.5 * (vr * vr + vt * vt) - GM / r;
          let periodS = NaN;
          if (E < 0) { const a = -GM / (2 * E); periodS = 2 * Math.PI * Math.sqrt((a*a*a) / GM); }
          marginS = vr < 0 ? (tApo - periodS) : tApo;
        }
      }
      if (gs.payloadCleared) { payloadT = state.simTime; break; }
      // Early abort: if we're stuck in CH_2/CR_2 and vr has crossed negative,
      // payload peak is missed, next peak is ~period away. Abort.
      if ((phase === 'COAST_HOLD_2' || phase === 'COAST_ROTATE_2') && i > 20) {
        const stb = findStage();
        if (stb) {
          const rr = Math.hypot(stb.rx, stb.ry);
          const vvr = (stb.vx * stb.rx + stb.vy * stb.ry) / rr;
          if (vvr < -0.5) {   // clearly past apogee
            window._abortReason = 'CH_2 vr<0 (missed peak)';
            break;
          }
        }
      }
      // debug: CH_2 vr tracking
      if (phase === 'COAST_HOLD_2' || phase === 'COAST_ROTATE_2') {
        const stb = findStage();
        if (stb) {
          const r = Math.hypot(stb.rx, stb.ry);
          const vr = (stb.vx * stb.rx + stb.vy * stb.ry) / r;
          if (!window._vrTrace) window._vrTrace = [];
          if (window._vrTrace.length < 3) window._vrTrace.push({ t: state.simTime, vr, phase });
          else { window._vrTrace[window._vrTrace.length-1] = { t: state.simTime, vr, phase }; }
        }
      }
      prevPhase = phase;
      if ((i & 255) === 255) await new Promise(r => setTimeout(r, 0));
    }
    const gsEnd = Guidance.getGuideStatus();
    return { lead, circStartT, circEndT, marginS, vrEnd, payloadT,
             lastPhase: gsEnd.phase, lastSimTime: state.simTime,
             halted: state.halted, crashed: state.crashed,
             vrTrace: (window._vrTrace || []).slice(0, 3),
             abort: window._abortReason || null };
  }

  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    $('runBtn').disabled = true;
    try {
      $('status').textContent = 'forward to COAST_WAIT entry…';
      const pv = presetValues();
      const _alt = pv.values && pv.values.insertion && pv.values.insertion.TARGET_ORBIT_ALT_KM;
      const _meco = pv.values && pv.values.ascent && pv.values.ascent.MECO_TARGET_BOOSTER_FUEL_KG;
      const _G = pv.values && pv.values.ascent && pv.values.ascent.PUSH_MAX_GIMBAL_DEG;
      $('status').textContent = '[visible preset header] guide=' + pv.guideName + ' alt=' + _alt + ' meco=' + _meco + ' G=' + _G;
      console.log('[visible preset] guide=' + pv.guideName + ' alt=' + _alt + ' meco=' + _meco + ' G=' + _G + ' lead=' + (pv.values.insertion && pv.values.insertion.CIRC_TRIGGER_LEAD_S));
      await new Promise(r => setTimeout(r, 100));
      TunerEngine.prepareRun(pv.guideName, pv.values, TunerConfig.env);
      let prevPhase = null, snapshotCaptured = false;
      const maxTicks = Math.ceil(5000 / DT);   // forward scan: enough for 2000 km CH entry
      for (let i = 0; i < maxTicks; i++) {
        if (state.halted) break;
        TunerEngine.tick(DT);
        const gs = Guidance.getGuideStatus();
        const phase = gs.phase;
        if (phase !== prevPhase) {
          if (phase === 'COAST_HOLD' && !snapshotCaptured) {
            g_snapshot = captureSnapshot();
            const cfgs = g_snapshot.guidanceState && g_snapshot.guidanceState.guideConfigs;
            const ins = cfgs && cfgs.leoInsertionV3 && cfgs.leoInsertionV3.insertion;
            g_snapshot.__targetAltKm = (ins && Number.isFinite(ins.TARGET_ORBIT_ALT_KM)) ? ins.TARGET_ORBIT_ALT_KM : 320;
            snapshotCaptured = true;
          }
          prevPhase = phase;
        }
        if (gs.payloadCleared) break;
        if ((i & 255) === 255) {
          $('status').textContent = 'forward t=' + state.simTime.toFixed(1) + ' ph=' + phase;
          await new Promise(r => setTimeout(r, 0));
        }
      }

      if (!g_snapshot) { $('status').textContent = 'no snapshot captured'; $('runBtn').disabled = false; return; }

      $('status').textContent = 'bisecting lead…';
      const results = [];
      const targetMargin = 4.5;
      let loTicks = Math.round(3.5 / LEAD_QUANTUM);
      let hiTicks = Math.round(8.0 / LEAD_QUANTUM);

      // 1st attempt at baseline lead
      const baseTicks = Math.round(5.53 / LEAD_QUANTUM);
      const r0 = await attempt(baseTicks * LEAD_QUANTUM);
      results.push(r0);
      if (Number.isFinite(r0.marginS) && r0.marginS >= targetMargin) hiTicks = baseTicks;
      else loTicks = baseTicks;

      // bisect
      for (let iter = 0; iter < 10; iter++) {
        const midTicks = Math.round((loTicks + hiTicks) / 2);
        if (midTicks === loTicks || midTicks === hiTicks) break;
        const r = await attempt(midTicks * LEAD_QUANTUM);
        results.push(r);
        $('status').textContent = 'iter ' + (iter+1) + ' lead=' + (midTicks * LEAD_QUANTUM).toFixed(4) + 's margin=' + fmt(r.marginS, 3) + 's';
        if (Number.isFinite(r.marginS) && r.marginS >= targetMargin) hiTicks = midTicks;
        else loTicks = midTicks;
      }

      // pick best (closest to target margin, feasible)
      let best = null;
      for (const r of results) {
        if (!Number.isFinite(r.marginS) || r.vrEnd < 0) continue;
        if (!best || Math.abs(r.marginS - targetMargin) < Math.abs(best.marginS - targetMargin)) best = r;
      }

      // Expand range: if best sits at the upper boundary and its margin is
      // still below target, the true optimum is further out. Probe higher.
      const upperBoundary = hiTicks * LEAD_QUANTUM;
      for (let exp = 0; exp < 3; exp++) {
        if (!best) break;
        if (best.lead < upperBoundary - LEAD_QUANTUM * 2) break;
        if (best.marginS >= targetMargin) break;   // already reached target
        const nextTick = hiTicks + Math.round(1.0 / LEAD_QUANTUM);
        const rr = await attempt(nextTick * LEAD_QUANTUM);
        results.push(rr);
        $('status').textContent = 'expand hi lead=' + (nextTick * LEAD_QUANTUM).toFixed(4) + ' marg=' + fmt(rr.marginS, 3);
        if (rr.vrEnd >= 0 && Math.abs(rr.marginS - targetMargin) < Math.abs(best.marginS - targetMargin)) best = rr;
        hiTicks = nextTick;
        upperBoundary = hiTicks * LEAD_QUANTUM;
      }

      const rows = [
        { h: 'Snapshot at COAST_WAIT entry' },
        { k: 'snapshot phase', v: 'COAST_HOLD entry' },
        { k: 'simTime', v: fmt(g_snapshot.simTime, 4) + ' s' },
        { k: 'bodies', v: g_snapshot.bodies.length + '' },
        { h: 'Attempts' },
      ];
      results.forEach((r, i) => {
        rows.push({ k: '#' + (i+1) + ' lead=' + fmt(r.lead, 4),
          v: 'circStart=' + fmt(r.circStartT, 3) + ' circEnd=' + fmt(r.circEndT, 3) + ' marg=' + fmt(r.marginS, 3) + ' vrEnd=' + fmt(r.vrEnd, 5) + ' pay=' + fmt(r.payloadT, 3) + ' lastPh=' + (r.lastPhase || '?') + ' t=' + fmt(r.lastSimTime, 1) + (r.halted ? ' HALTED' : '') + (r.crashed ? ' CRASH' : '') + (r.abort ? ' ABORT' : '') });
      });
      if (best) {
        rows.push({ h: 'Best' });
        rows.push({ k: 'lead', v: fmt(best.lead, 4) + ' s' });
        rows.push({ k: 'margin', v: fmt(best.marginS, 4) + ' s' });
        rows.push({ k: 'vrEnd', v: fmt(best.vrEnd, 5) + ' m/s' });
      }

      const tb = $('t').querySelector('tbody');
      tb.innerHTML = rows.map(r => r.h
        ? '<tr class="heading"><td colspan="2">' + r.h + '</td></tr>'
        : '<tr' + (r.k === 'lead' || r.k === 'margin' || r.k === 'vrEnd' ? ' class="hl"' : '') +
          '><td>' + r.k + '</td><td style="font-size:11px">' + r.v + '</td></tr>'
      ).join('');

      $('raw').textContent = results.map(r =>
        'lead=' + r.lead.toFixed(4) + ' margin=' + fmt(r.marginS, 4) + ' vrEnd=' + fmt(r.vrEnd, 5) + ' circEnd=' + fmt(r.circEndT, 3) + ' payload=' + fmt(r.payloadT, 3)
      ).join('\n');

      $('status').textContent = 'done';
      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      $('status').textContent = 'ERROR: ' + e.message;
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
  $('clearBtn').addEventListener('click', () => {
    $('t').querySelector('tbody').innerHTML = '';
    $('raw').textContent = '—';
    $('status').textContent = 'idle';
  });
  // populate preset dropdown (default + user presets)
  (function populatePresets() {
    const sel = $('presetSel');
    if (!sel) return;
    const opts = [];
    if (typeof GUIDE_DEFAULT_PRESETS === 'object') {
      Object.keys(GUIDE_DEFAULT_PRESETS).forEach(g => {
        const p = GUIDE_DEFAULT_PRESETS[g];
        if (p && p.id) opts.push({ id: p.id, label: '[default] ' + g + ' — ' + p.name });
      });
    }
    if (typeof loadUserPresets === 'function') {
      try {
        loadUserPresets().forEach(p => {
          if (p && p.id) opts.push({ id: p.id, label: '[user] ' + p.guideName + ' — ' + p.name });
        });
      } catch (e) {}
    }
    if (!opts.length) { sel.innerHTML = '<option value="">(no presets)</option>'; return; }
    sel.innerHTML = opts.map(o => '<option value="' + o.id + '">' + o.label + '</option>').join('');
    const def = opts.find(o => o.id === 'default:leoInsertionV3');
    if (def) sel.value = def.id;
  })();

  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
