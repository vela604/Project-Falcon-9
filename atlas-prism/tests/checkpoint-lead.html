<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkpoint Lead Convergence</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:400px; }
</style>
</head>
<body>

<h1>Checkpoint Lead — Pro-Alpha tuneLead from COAST_HOLD</h1>

<select id="presetSel" style="background:#101a30;color:#dbe6f5;border:1px solid #1c2b45;
        padding:8px 12px;border-radius:4px;font:inherit;cursor:pointer;margin-right:8px;min-width:340px;"></select>
<button id="runBtn">Run</button>
<div id="status">idle</div>
<pre id="log">—</pre>
<pre id="result">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../../js/guidancePresets.js"></script>

<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>
<script src="../lib/lattice.js"></script>
<script src="../lib/hook.js"></script>
<script src="../lib/registry.js"></script>
<script src="../lib/primitives.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, DT = CONFIG.DT;
  const logEl = $('log'), resEl = $('result');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }

  function timeToApogee(b) {
    const r = Math.hypot(b.rx, b.ry);
    const vr = (b.vx * b.rx + b.vy * b.ry) / r;
    const vt = (b.vx * b.ry - b.vy * b.rx) / r;
    const E = 0.5 * (vr * vr + vt * vt) - GM / r;
    if (E >= 0) return Infinity;
    const a = -GM / (2 * E);
    const h = r * vt;
    const eSq = 1 + 2 * E * h * h / (GM * GM);
    const e = Math.sqrt(Math.max(0, eSq));
    if (e < 1e-9) return Math.PI * Math.sqrt((a * a * a) / GM);
    const cosE = (1 - r / a) / e;
    const sinE = (r * vr) / (e * Math.sqrt(GM * a));
    let Ean = Math.atan2(sinE, cosE);
    if (Ean < 0) Ean += 2 * Math.PI;
    const M = Ean - e * Math.sin(Ean);
    const n = Math.sqrt(GM / (a * a * a));
    return M < Math.PI ? (Math.PI - M) / n : (3 * Math.PI - M) / n;
  }

  function periodOf(b) {
    const r = Math.hypot(b.rx, b.ry);
    const vr = (b.vx * b.rx + b.vy * b.ry) / r;
    const vt = (b.vx * b.ry - b.vy * b.rx) / r;
    const E = 0.5 * (vr * vr + vt * vt) - GM / r;
    if (E >= 0) return Infinity;
    const a = -GM / (2 * E);
    return 2 * Math.PI * Math.sqrt((a * a * a) / GM);
  }

  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }

  function baselineValues() {
    const sel = $('presetSel');
    const id = sel && sel.value;
    if (id && typeof getPresetById === 'function') {
      const preset = getPresetById(id);
      if (preset && preset.constants) {
        const out = JSON.parse(JSON.stringify(preset.constants));
        if (!out.done) out.done = { DEORBIT_ENABLED: false };
        return out;
      }
    }
    const b = TunerConfig.baselineRaw;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: b.bias,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: b.lead },
      done: { DEORBIT_ENABLED: false },
    };
  }

  // --- Snapshot/restore helpers ---
  function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

  function captureSnapshot() {
    return {
      bodies: deepClone(state.bodies),
      simTime: state.simTime,
      activeBodyIndex: state.activeBodyIndex,
      halted: state.halted,
      landed: state.landed,
      crashed: state.crashed,
      guidanceState: Guidance.exportGuideState(),
    };
  }

  function restoreSnapshot(snap, newLead) {
    state.simTime = snap.simTime;
    state.activeBodyIndex = snap.activeBodyIndex;
    state.halted = snap.halted;
    state.landed = snap.landed;
    state.crashed = snap.crashed;

    const sb = snap.bodies;
    while (state.bodies.length > sb.length) state.bodies.pop();
    while (state.bodies.length < sb.length) state.bodies.push({});

    for (let i = 0; i < sb.length; i++) {
      const src = sb[i], dst = state.bodies[i];
      Object.keys(dst).forEach(k => { delete dst[k]; });
      Object.keys(src).forEach(k => { dst[k] = deepClone(src[k]); });
    }

    const g = deepClone(snap.guidanceState);
    if (newLead !== undefined && newLead !== null) {
      if (g.guideConfigs && g.guideConfigs.leoInsertionV3 && g.guideConfigs.leoInsertionV3.insertion) {
        g.guideConfigs.leoInsertionV3.insertion.CIRC_TRIGGER_LEAD_S = newLead;
      }
      if (g.v3InsertionBlock && g.v3InsertionBlock.constants) {
        g.v3InsertionBlock.constants.CIRC_TRIGGER_LEAD_S = newLead;
      }
      if (g.v3InsertionBlock && g.v3InsertionBlock.st) {
        delete g.v3InsertionBlock.st._circLeadCached;
      }
    }
    Guidance.importGuideState(g);
  }

  // --- Checkpoint-based hook that mimics TunerHook.runEval(..., stopAt: 'CIRC_END') ---
  function makeCheckpointHook(snap, appliedConfig) {
    return {
      runEval: async (point, opts) => {
        const stopAt = opts && opts.stopAt;
        if (stopAt !== 'CIRC_END') throw new Error('checkpoint hook only supports CIRC_END');
        const lead = point.li * TunerConfig.quanta.lead;
        restoreSnapshot(snap, lead);

        let vrEnd = NaN, marginS = NaN, vrMin = Infinity;
        let circAch = false, engOff = false;
        let crashed = false;
        let prevPhase = Guidance.getGuideStatus().phase;
        const maxTicks = Math.ceil(400 / DT);

        for (let i = 0; i < maxTicks; i++) {
          if (state.halted) break;
          TunerEngine.tick(DT);
          if (state.crashed) { crashed = true; break; }
          const gs = Guidance.getGuideStatus();
          const ph = gs.phase;

          // track vrMin during CIRCULARIZE
          if (ph === 'CIRCULARIZE') {
            const b = state.bodies[state.activeBodyIndex];
            const r = Math.hypot(b.rx, b.ry);
            const vr = (b.vx * b.rx + b.vy * b.ry) / r;
            if (vr < vrMin) vrMin = vr;
          }

          if (gs.circAchieved && !circAch) circAch = true;

          // detect engines-off after CIRCULARIZE
          if (circAch && !engOff) {
            const b = state.bodies[state.activeBodyIndex];
            let mdot = 0;
            (b.engines || []).forEach(e => { mdot += e.massFlowRate || 0; });
            if (mdot <= 1e-9) {
              engOff = true;
              const stb = findStage();
              if (stb) {
                const r = Math.hypot(stb.rx, stb.ry);
                const vr = (stb.vx * stb.rx + stb.vy * stb.ry) / r;
                const vt = (stb.vx * stb.ry - stb.vy * stb.rx) / r;
                const tApo = timeToApogee(stb);
                const per = periodOf(stb);
                vrEnd = vr;
                marginS = vr < 0 ? (tApo - per) : tApo;
              }
              break;
            }
          }
          prevPhase = ph;
          if ((i & 255) === 255) await new Promise(r => setTimeout(r, 0));
        }

        // shape per TunerHook contract (subset that tuneLead reads)
        return {
          endReason: (circAch && engOff) ? 'CIRC_END' : (crashed ? 'CRASHED' : 'CAP'),
          crashed,
          vrEnd, marginS, vrMin,
          ticks: 0, simTimeEnd: state.simTime, wallMs: 0,
        };
      }
    };
  }

  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    $('runBtn').disabled = true;
    logLines = [];
    log('forward to COAST_HOLD entry…');

    try {
      TunerEngine.prepareRun('leoInsertionV3', baselineValues(), TunerConfig.env);
      let prevPhase = null, snap = null;
      const maxTicks = Math.ceil(5000 / DT);

      for (let i = 0; i < maxTicks; i++) {
        if (state.halted) break;
        TunerEngine.tick(DT);
        const gs = Guidance.getGuideStatus();
        const ph = gs.phase;
        if (ph !== prevPhase && ph === 'COAST_HOLD' && !snap) {
          snap = captureSnapshot();
          log('snapshot at CH entry, simTime=' + state.simTime.toFixed(3));
        }
        prevPhase = ph;
        if (snap && gs.payloadCleared) break;
        if ((i & 255) === 255) {
          $('status').textContent = 'forward t=' + state.simTime.toFixed(1) + ' ph=' + ph;
          await new Promise(r => setTimeout(r, 0));
        }
      }
      if (!snap) { log('no CH snapshot captured'); $('runBtn').disabled = false; return; }

      // read current config lead from snapshot
      const cfg = snap.guidanceState.guideConfigs.leoInsertionV3;
      const leadConfig = cfg.insertion.CIRC_TRIGGER_LEAD_S;
      log('config lead = ' + leadConfig + ' s');

      // lattice point — only li matters (state is already at CH)
      const startLead = 15.0;   // arbitrary start, not from preset
      const point = {
        Gi: Math.round((cfg.ascent.PUSH_MAX_GIMBAL_DEG) / TunerConfig.quanta.G),
        Tn: Math.round((cfg.ascent.PUSH_T_S) / TunerConfig.quanta.T),
        bi: Math.round((cfg.insertion.STAGE_BURN_AOA_BIAS_DEG) / TunerConfig.quanta.bias),
        li: Math.round(startLead / TunerConfig.quanta.lead),
        meco: cfg.ascent.MECO_TARGET_BOOSTER_FUEL_KG,
      };
      log('arbitrary start lead=' + startLead + 's  (config had ' + leadConfig + 's)');
      log('point li=' + point.li + ' (lead=' + (point.li * TunerConfig.quanta.lead) + 's)');

      log('calling TunerCore.tuneLead with checkpoint hook…');
      const hook = makeCheckpointHook(snap, cfg);
      const result = await TunerCore.tuneLead(point, {
        hook,
        onLog: (s) => log('  ' + s),
      });

      log('--- done ---');
      resEl.textContent = JSON.stringify({
        ok: result.ok,
        inBand: result.inBand,
        reason: result.reason,
        lead: result.lead,
        leadTicks: result.leadTicks,
        marginS: result.marginS,
        vrEnd: result.vrEnd,
        vrMin: result.vrMin,
        phase: result.phase,
        evals: result.evals,
        wallMs: result.wallMs,
      }, null, 2);

      $('status').textContent = 'done';
      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message);
      $('status').textContent = 'ERROR';
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
  (function populatePresets() {
    const sel = $('presetSel');
    if (!sel) return;
    const GUIDE = 'leoInsertionV3';
    const opts = [];
    if (typeof GUIDE_DEFAULT_PRESETS === 'object' && GUIDE_DEFAULT_PRESETS[GUIDE]) {
      const p = GUIDE_DEFAULT_PRESETS[GUIDE];
      if (p && p.id) opts.push({ id: p.id, label: '[default] ' + p.name });
    }
    if (typeof loadUserPresets === 'function') {
      try {
        loadUserPresets().forEach(p => {
          if (p && p.id && p.guideName === GUIDE) opts.push({ id: p.id, label: '[user] ' + p.name });
        });
      } catch (e) {}
    }
    if (!opts.length) { sel.innerHTML = '<option value="">(no leoInsertionV3 presets)</option>'; return; }
    sel.innerHTML = opts.map(o => '<option value="' + o.id + '">' + o.label + '</option>').join('');
    const def = opts.find(o => o.id === 'default:leoInsertionV3');
    if (def) sel.value = def.id;
  })();

  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
