<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circ Burn Prediction Test</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
table { border-collapse:collapse; font-size:12.5px; width:100%; margin-top:8px; }
th, td { padding:6px 10px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.heading td { background:rgba(53,214,255,0.06); color:#35d6ff; font-weight:600; }
tr.hl td { background:rgba(74,222,128,0.08); }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:280px; }
</style>
</head>
<body>

<h1>Circ Burn Residual Prediction — from COAST_WAIT</h1>

<button id="runBtn">Run baseline</button>
<button id="clearBtn">Clear</button>
<div id="status">idle</div>

<table id="t"><tbody></tbody></table>
<pre id="raw">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, DT = CONFIG.DT;

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }
  function stageFuelNow() {
    const st = findStage();
    if (st && Number.isFinite(st.fuelMass)) return st.fuelMass;
    return NaN;
  }
  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }
  function baselineValues() {
    const b = TunerConfig.baselineRaw;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: b.bias,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: b.lead },
      done: { DEORBIT_ENABLED: false },
    };
  }
  function fmt(x, d) { return Number.isFinite(x) ? x.toFixed(d) : '—'; }

  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    $('runBtn').disabled = true;
    try {
      TunerEngine.prepareRun(TunerConfig.guideName, baselineValues(), TunerConfig.env);
      let cw = null, finalState = null, endReason = 'loop';
      const maxTicks = Math.ceil(800 / DT);
      let lastYield = performance.now();

      for (let i = 0; i < maxTicks; i++) {
        if (state.halted) { endReason = 'halted'; break; }
        TunerEngine.tick(DT);
        const b = state.bodies[state.activeBodyIndex];
        if (!b) continue;
        const gs = Guidance.getGuideStatus();
        const phase = gs ? gs.phase : '';

        // Capture at FIRST tick of COAST_WAIT (or COAST_HOLD if WAIT skipped)
        if (!cw && (phase === 'COAST_WAIT' || phase === 'COAST_HOLD')) {
          const rM = Math.hypot(b.rx, b.ry);
          cw = {
            t: state.simTime,
            phase,
            rx: b.rx, ry: b.ry, vx: b.vx, vy: b.vy,
            r: rM, v: Math.hypot(b.vx, b.vy),
            fuel: stageFuelNow(),
            coastDeltaV: gs.coastDeltaV,
            circTargetV: gs.circTargetV,
            circCurrentV: gs.circCurrentV,
          };
        }

        if (gs && gs.payloadCleared) {
          const rM = Math.hypot(b.rx, b.ry);
          finalState = {
            t: state.simTime,
            r: rM, v: Math.hypot(b.vx, b.vy),
            fuel: stageFuelNow(),
          };
          endReason = 'payload-cleared';
          break;
        }
        if ((i & 255) === 255) {
          const now = performance.now();
          if (now - lastYield > 40) {
            $('status').textContent = 't=' + state.simTime.toFixed(1) + 's phase=' + phase;
            await new Promise(r => setTimeout(r, 0));
            lastYield = now;
          }
        }
      }

      if (!cw || !finalState) {
        $('status').textContent = 'missing capture: cw=' + !!cw + ' final=' + !!finalState;
        $('runBtn').disabled = false; return;
      }

      // Engine params
      const stb = findStage();
      let Ve = NaN, mdot = NaN;
      if (stb && stb.engines && stb.engines.length) {
        Ve = stb.engines[0].Ve;
      }
      if (stb && stb.members && stb.members[0] && stb.members[0].engineThrusters) {
        const g = stb.members[0].engineThrusters.gimbal || stb.members[0].engineThrusters.fixed;
        if (g && Number.isFinite(g.massFlowRate)) mdot = g.massFlowRate;
      }

      // mc = stage dry (WITHOUT fairing, WITHOUT payload) + payload mass
      // stb.dryMass already includes fairing + payload contributions, so we
      // rebuild mc from the raw stage member's derived dry mass instead.
      let mc = 0;
      const stk = getActiveStack();
      if (stb && stb.members && typeof stageDerivedMasses === 'function') {
        for (const m of stb.members) {
          if (m && m.stageRole === 'stage') {
            const d = stageDerivedMasses(m);
            if (d && !d.infeasible) { mc += d.dryMassNoPayload; break; }
          }
        }
      }
      if (stk && stk.payloadId && typeof getPayload === 'function') {
        const pl = getPayload(stk.payloadId);
        if (pl && Number.isFinite(pl.mass)) mc += pl.mass;
      }
      if (!(mc > 0)) mc = stb ? (stb.dryMass || 0) : 0;   // fallback

      // Prediction: at coast_wait, fuel = F_cw. Ideal Δv = coastDeltaV.
      // Tsiolkovsky: F_burn = Mi·(1 − exp(−Δv/Ve)), Mi = mc + F_cw
      const Mi = mc + cw.fuel;
      const dv = cw.coastDeltaV;
      const Mf_pred = Mi / Math.exp(dv / Ve);
      const residual_pred = Mf_pred - mc;
      const fuel_burned_pred = cw.fuel - residual_pred;

      // Actual
      const residual_actual = finalState.fuel;
      const err = residual_pred - residual_actual;
      const rel = residual_actual > 1 ? err / residual_actual * 100 : 0;

      const rows = [
        { h: 'COAST_WAIT state' },
        { k: 't (s)',              v: fmt(cw.t, 3) },
        { k: 'phase captured',     v: cw.phase },
        { k: 'altitude (km)',      v: fmt((cw.r - Re) / 1000, 3) },
        { k: 'r (m)',              v: fmt(cw.r, 2) },
        { k: 'v (m/s)',            v: fmt(cw.v, 3) },
        { k: 'stage fuel (kg)',    v: fmt(cw.fuel, 2) },
        { k: 'coastDeltaV (m/s)',  v: fmt(dv, 3) },
        { k: 'circCurrentV (m/s)', v: fmt(cw.circCurrentV, 3) },
        { k: 'circTargetV (m/s)',  v: fmt(cw.circTargetV, 3) },
        { k: 'mc (stage dry + payload)', v: fmt(mc, 2) },
        { k: 'Mi = mc + fuel',     v: fmt(Mi, 2) },
        { k: 'Ve (m/s)',           v: fmt(Ve, 2) },
        { k: 'mdot (kg/s)',        v: fmt(mdot, 2) },

        { h: 'Tsiolkovsky prediction' },
        { k: 'Mf_pred = Mi·exp(−Δv/Ve)', v: fmt(Mf_pred, 2) },
        { k: 'fuel burned pred (kg)',    v: fmt(fuel_burned_pred, 2) },
        { k: 'residual predicted (kg)',  v: fmt(residual_pred, 2) },

        { h: 'Actual (payload cleared)' },
        { k: 't (s)',                v: fmt(finalState.t, 3) },
        { k: 'residual actual (kg)', v: fmt(residual_actual, 2) },

        { h: 'Error' },
        { k: 'predicted − actual (kg)', v: fmt(err, 2) },
        { k: 'relative (%)',             v: fmt(rel, 3) },
      ];

      const tb = $('t').querySelector('tbody');
      tb.innerHTML = rows.map(r => r.h
        ? '<tr class="heading"><td colspan="2">' + r.h + '</td></tr>'
        : '<tr' + (r.k === 'residual predicted (kg)' ? ' class="hl"' : '') +
          '><td>' + r.k + '</td><td>' + r.v + '</td></tr>'
      ).join('');

      $('raw').textContent = [
        'cw: t=' + cw.t.toFixed(3) + ' alt=' + ((cw.r-Re)/1000).toFixed(2) + 'km v=' + cw.v.toFixed(2) + ' fuel=' + cw.fuel.toFixed(2) + ' dV=' + dv.toFixed(3),
        'final: t=' + finalState.t.toFixed(3) + ' fuel=' + residual_actual.toFixed(2) + ' (' + endReason + ')',
        'pred: ' + residual_pred.toFixed(2) + ' kg  err=' + err.toFixed(2) + ' kg (' + rel.toFixed(2) + '%)',
        'mc=' + mc.toFixed(2) + ' Ve=' + Ve.toFixed(2) + ' mdot=' + mdot.toFixed(2),
      ].join('\n');

      $('status').textContent = 'done — ' + endReason;
      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      $('status').textContent = 'ERROR: ' + e.message;
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
  $('clearBtn').addEventListener('click', () => {
    $('t').querySelector('tbody').innerHTML = '';
    $('raw').textContent = '—';
    $('status').textContent = 'idle';
  });
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
