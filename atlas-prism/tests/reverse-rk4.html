<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reverse RK4 — replay validation</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
table { border-collapse:collapse; font-size:12px; width:100%; margin-top:8px; }
th, td { padding:5px 10px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.heading td { background:rgba(53,214,255,0.06); color:#35d6ff; font-weight:600; }
tr.hl td { background:rgba(74,222,128,0.06); }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:320px; }
</style>
</head>
<body>

<h1>Reverse RK4 — replay validation</h1>

<button id="runBtn">Run baseline + reverse</button>
<button id="clearBtn">Clear</button>
<div id="status">idle</div>

<table id="t"><tbody></tbody></table>
<pre id="raw">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, DT = CONFIG.DT;

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }
  function stageFuelNow() {
    const st = findStage();
    return (st && Number.isFinite(st.fuelMass)) ? st.fuelMass : NaN;
  }
  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }
  function baselineValues() {
    const b = TunerConfig.baselineRaw;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: b.bias,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: b.lead },
      done: { DEORBIT_ENABLED: false },
    };
  }
  function fmt(x, d) { return Number.isFinite(x) ? x.toFixed(d) : '—'; }
  function dist(a, b) { return Math.hypot(a.r.x - b.r.x, a.r.y - b.r.y); }
  function vdist(a, b) { return Math.hypot(a.v.x - b.v.x, a.v.y - b.v.y); }

  // -------- reverse physics --------
  function gravity(r) {
    const rM = Math.hypot(r.x, r.y), k = -GM / (rM * rM * rM);
    return { x: k * r.x, y: k * r.y };
  }

  // Reverse burn using recorded mdot profile. Thrust = prograde (velocity dir).
  function reverseBurnProfile(trueOffState, profile, Ve) {
    profile = profile.slice().sort((a, b) => a.t - b.t);
    if (!profile.length) return { S: { r: trueOffState.r, v: trueOffState.v, m: trueOffState.mass }, t: trueOffState.t };

    let S = {
      r: { x: trueOffState.r.x, y: trueOffState.r.y },
      v: { x: trueOffState.v.x, y: trueOffState.v.y },
      m: Number.isFinite(trueOffState.mass) ? trueOffState.mass : 0,
    };
    let t = trueOffState.t;

    // find last profile sample with t <= trueOffState.t
    let idx = profile.length - 1;
    while (idx >= 0 && profile[idx].t > t) idx--;

    // walk backwards through samples
    while (idx >= 0) {
      const sample = profile[idx];
      const dtSeg = sample.t - t;   // should be <= 0
      if (dtSeg >= 0) { idx--; continue; }

      const SUB = 4;
      const steps = Math.max(1, Math.round(-dtSeg * 80 * SUB)); // ~80Hz * substeps
      const h = dtSeg / steps;
      const mdot = sample.mdot;

      // local deriv — thrust along body axis (theta), plus gravity.
      const theta = sample.theta || 0;
      const ux = -Math.sin(theta);
      const uy = Math.cos(theta);
      function deriv(st) {
        const g = gravity(st.r);
        const aT = mdot * Ve / Math.max(1, st.m);
        return {
          drx: st.v.x, dry: st.v.y,
          dvx: g.x + aT * ux, dvy: g.y + aT * uy,
          dm: -mdot,
        };
      }

      for (let k = 0; k < steps; k++) {
        const c1 = deriv(S);
        const S2 = { r: { x: S.r.x + h/2*c1.drx, y: S.r.y + h/2*c1.dry },
                     v: { x: S.v.x + h/2*c1.dvx, y: S.v.y + h/2*c1.dvy },
                     m: S.m + h/2*c1.dm };
        const c2 = deriv(S2);
        const S3 = { r: { x: S.r.x + h/2*c2.drx, y: S.r.y + h/2*c2.dry },
                     v: { x: S.v.x + h/2*c2.dvx, y: S.v.y + h/2*c2.dvy },
                     m: S.m + h/2*c2.dm };
        const c3 = deriv(S3);
        const S4 = { r: { x: S.r.x + h*c3.drx, y: S.r.y + h*c3.dry },
                     v: { x: S.v.x + h*c3.dvx, y: S.v.y + h*c3.dvy },
                     m: S.m + h*c3.dm };
        const c4 = deriv(S4);
        S = {
          r: { x: S.r.x + h/6*(c1.drx + 2*c2.drx + 2*c3.drx + c4.drx),
               y: S.r.y + h/6*(c1.dry + 2*c2.dry + 2*c3.dry + c4.dry) },
          v: { x: S.v.x + h/6*(c1.dvx + 2*c2.dvx + 2*c3.dvx + c4.dvx),
               y: S.v.y + h/6*(c1.dvy + 2*c2.dvy + 2*c3.dvy + c4.dvy) },
          m: S.m + h/6*(c1.dm + 2*c2.dm + 2*c3.dm + c4.dm),
        };
        t += h;
      }
      idx--;
    }
    return { S, t };
  }

  function reverseBallistic(fromState, tStart, tEnd) {
    let S = {
      r: { x: fromState.r.x, y: fromState.r.y },
      v: { x: fromState.v.x, y: fromState.v.y },
      m: fromState.m,
    };
    let t = tStart;
    const h = -DT / 4;
    const steps = Math.round((tStart - tEnd) / DT) * 4;
    for (let i = 0; i < steps; i++) {
      const deriv = (st) => {
        const g = gravity(st.r);
        return { drx: st.v.x, dry: st.v.y, dvx: g.x, dvy: g.y, dm: 0 };
      };
      const c1 = deriv(S);
      const S2 = { r: { x: S.r.x + h/2*c1.drx, y: S.r.y + h/2*c1.dry },
                   v: { x: S.v.x + h/2*c1.dvx, y: S.v.y + h/2*c1.dvy }, m: S.m };
      const c2 = deriv(S2);
      const S3 = { r: { x: S.r.x + h/2*c2.drx, y: S.r.y + h/2*c2.dry },
                   v: { x: S.v.x + h/2*c2.dvx, y: S.v.y + h/2*c2.dvy }, m: S.m };
      const c3 = deriv(S3);
      const S4 = { r: { x: S.r.x + h*c3.drx, y: S.r.y + h*c3.dry },
                   v: { x: S.v.x + h*c3.dvx, y: S.v.y + h*c3.dvy }, m: S.m };
      const c4 = deriv(S4);
      S = { r: { x: S.r.x + h/6*(c1.drx + 2*c2.drx + 2*c3.drx + c4.drx),
                 y: S.r.y + h/6*(c1.dry + 2*c2.dry + 2*c3.dry + c4.dry) },
            v: { x: S.v.x + h/6*(c1.dvx + 2*c2.dvx + 2*c3.dvx + c4.dvx),
                 y: S.v.y + h/6*(c1.dvy + 2*c2.dvy + 2*c3.dvy + c4.dvy) },
            m: S.m };
      t += h;
    }
    return { S, t };
  }

  // -------- forward --------
  async function forward() {
    TunerEngine.prepareRun(TunerConfig.guideName, baselineValues(), TunerConfig.env);
    const mcBase = 0; // placeholder; recomputed post-run
    const snaps = {};
    const burnProfile = [];
    let trueOff = null;
    let prevPhase = null;
    let endReason = 'loop';
    const maxTicks = Math.ceil(800 / DT);
    let lastYield = performance.now();

    for (let i = 0; i < maxTicks; i++) {
      if (state.halted) { endReason = 'halted'; break; }
      TunerEngine.tick(DT);
      const b = state.bodies[state.activeBodyIndex];
      if (!b) continue;
      const gs = Guidance.getGuideStatus();
      const phase = gs ? gs.phase : '?';

      if (phase !== prevPhase) {
        if (!snaps[phase]) snaps[phase] = snapNow(b, mcBase);
        prevPhase = phase;
      }

      // Burn profile capture: CIRCULARIZE + spool-down in COAST_ROTATE_2
      if (b.engines && b.engines.length &&
          (phase === 'CIRCULARIZE' || (phase === 'COAST_ROTATE_2' && !trueOff))) {
        let md = 0;
        b.engines.forEach(e => { md += e.massFlowRate || 0; });
        if (md > 0.001) {
          burnProfile.push({
            t: state.simTime,
            mdot: md,
            theta: b.theta,
            ax: b._lastAccelX || 0,
            ay: b._lastAccelY || 0,
            r: { x: b.rx, y: b.ry },
            v: { x: b.vx, y: b.vy },
          });
        } else if (phase === 'COAST_ROTATE_2' && burnProfile.length > 0 && !trueOff) {
          trueOff = snapNow(b, mcBase);
        }
      }

      if (gs && gs.payloadCleared) { endReason = 'payload-cleared'; break; }

      if ((i & 255) === 255) {
        const now = performance.now();
        if (now - lastYield > 40) {
          $('status').textContent = 't=' + state.simTime.toFixed(1) + 's ph=' + phase;
          await new Promise(r => setTimeout(r, 0));
          lastYield = now;
        }
      }
    }

    // post-run: real mcBase, Ve, mdot
    const stbFinal = findStage();
    let Ve = NaN, mdotDesign = NaN, mcBaseReal = 0;
    if (stbFinal && stbFinal.members && stbFinal.members[0]) {
      const mRec = stbFinal.members[0];
      if (mRec.stageRole === 'stage' && typeof stageDerivedMasses === 'function') {
        const d = stageDerivedMasses(mRec);
        if (d && !d.infeasible) mcBaseReal = d.dryMassNoPayload;
      }
      if (mRec.engineThrusters) {
        const g = mRec.engineThrusters.gimbal || mRec.engineThrusters.fixed;
        if (g && Number.isFinite(g.massFlowRate)) mdotDesign = g.massFlowRate;
      }
    }
    const stk = getActiveStack();
    if (stk && stk.payloadId && typeof getPayload === 'function') {
      const pl = getPayload(stk.payloadId);
      if (pl && Number.isFinite(pl.mass)) mcBaseReal += pl.mass;
    }
    if (stbFinal && stbFinal.engines && stbFinal.engines.length) {
      if (Number.isFinite(stbFinal.engines[0].Ve)) Ve = stbFinal.engines[0].Ve;
    }

    // fix all masses
    for (const k of Object.keys(snaps)) {
      const sn = snaps[k];
      if (sn && Number.isFinite(sn.fuel)) sn.mass = mcBaseReal + sn.fuel;
    }
    if (trueOff && Number.isFinite(trueOff.fuel)) trueOff.mass = mcBaseReal + trueOff.fuel;

    return { snaps, burnProfile, trueOff, mcBase: mcBaseReal, Ve, mdotDesign, endReason };
  }

  function snapNow(b, mcBase) {
    const sf = stageFuelNow();
    return {
      t: state.simTime,
      r: { x: b.rx, y: b.ry },
      v: { x: b.vx, y: b.vy },
      rMag: Math.hypot(b.rx, b.ry),
      vMag: Math.hypot(b.vx, b.vy),
      fuel: sf,
      mass: mcBase + (Number.isFinite(sf) ? sf : 0),
    };
  }

  // -------- main --------
  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    $('runBtn').disabled = true;
    try {
      $('status').textContent = 'forward…';
      const { snaps, burnProfile, trueOff, mcBase, Ve, mdotDesign, endReason } = await forward();

      if (!snaps['COAST_WAIT'] || !snaps['CIRCULARIZE'] || !trueOff || !burnProfile.length) {
        $('status').textContent = 'missing data';
        $('raw').textContent = 'cw=' + !!snaps['COAST_WAIT'] + ' ig=' + !!snaps['CIRCULARIZE'] +
                               ' trueOff=' + !!trueOff + ' profile=' + burnProfile.length +
                               '\nphases=' + Object.keys(snaps).join(',');
        $('runBtn').disabled = false; return;
      }

      const cw = snaps['COAST_WAIT'];
      const ig = snaps['CIRCULARIZE'];

      // debug sanity
      console.log('[reverse] mcBase=', mcBase, ' Ve=', Ve, ' trueOff.mass=', trueOff.mass,
                  ' trueOff.fuel=', trueOff.fuel, ' profile.length=', burnProfile.length,
                  ' first.t=', burnProfile[0].t, ' last.t=', burnProfile[burnProfile.length-1].t,
                  ' first.mdot=', burnProfile[0].mdot, ' last.mdot=', burnProfile[burnProfile.length-1].mdot);

      $('status').textContent = 'reverse R1 (profile)…';
      const R1 = reverseBurnProfile(trueOff, burnProfile, Ve);
      const errR1_pos = dist(R1.S, ig);
      const errR1_vel = vdist(R1.S, ig);
      const errR1_mass = Math.abs(R1.S.m - ig.mass);

      $('status').textContent = 'reverse R2 (ballistic)…';
      const R2 = reverseBallistic(
        { r: ig.r, v: ig.v, m: ig.mass },
        ig.t, cw.t
      );
      const errR2_pos = dist(R2.S, cw);
      const errR2_vel = vdist(R2.S, cw);
      const errR2_mass = Math.abs(R2.S.m - cw.mass);

      const rows = [
        { h: 'Forward' },
        { k: 'COAST_WAIT t',   v: fmt(cw.t, 3) + ' s  fuel=' + fmt(cw.fuel, 1) },
        { k: 'CIRCULARIZE t',  v: fmt(ig.t, 3) + ' s  fuel=' + fmt(ig.fuel, 1) },
        { k: 'trueOff t',      v: fmt(trueOff.t, 3) + ' s  fuel=' + fmt(trueOff.fuel, 1) },
        { k: 'burn dur',       v: fmt(trueOff.t - ig.t, 3) + ' s' },
        { k: 'fuel burned',    v: fmt(ig.fuel - trueOff.fuel, 2) + ' kg' },
        { k: 'avg mdot',       v: fmt((ig.fuel - trueOff.fuel)/(trueOff.t - ig.t), 2) + ' kg/s' },
        { k: 'profile samples',v: burnProfile.length },

        { h: 'Engine' },
        { k: 'Ve',             v: fmt(Ve, 2) },
        { k: 'mdot design',    v: fmt(mdotDesign, 2) },
        { k: 'mcBase',         v: fmt(mcBase, 2) + ' kg' },

        { h: 'R1 — reverse replay burn (trueOff → ig)' },
        { k: 'pred r',         v: fmt(R1.S.r.x, 1) + ', ' + fmt(R1.S.r.y, 1) },
        { k: 'actual r',       v: fmt(ig.r.x, 1) + ', ' + fmt(ig.r.y, 1) },
        { k: 'pos err',        v: fmt(errR1_pos, 3) + ' m' },
        { k: 'vel err',        v: fmt(errR1_vel, 6) + ' m/s' },
        { k: 'mass err',       v: fmt(errR1_mass, 4) + ' kg' },

        { h: 'R2 — reverse ballistic (ig → cw)' },
        { k: 'pos err',        v: fmt(errR2_pos, 3) + ' m' },
        { k: 'vel err',        v: fmt(errR2_vel, 8) + ' m/s' },
        { k: 'mass err',       v: fmt(errR2_mass, 5) + ' kg' },
      ];

      const tb = $('t').querySelector('tbody');
      tb.innerHTML = rows.map(r => r.h
        ? '<tr class="heading"><td colspan="2">' + r.h + '</td></tr>'
        : '<tr' + (/err/.test(r.k) ? ' class="hl"' : '') + '><td>' + r.k + '</td><td>' + r.v + '</td></tr>'
      ).join('');

      $('raw').textContent = [
        'endReason=' + endReason,
        'profile[0]: t=' + burnProfile[0].t.toFixed(4) + ' mdot=' + burnProfile[0].mdot.toFixed(3),
        'profile[last]: t=' + burnProfile[burnProfile.length-1].t.toFixed(4) + ' mdot=' + burnProfile[burnProfile.length-1].mdot.toFixed(3),
        'trueOff: t=' + trueOff.t.toFixed(4) + ' fuel=' + trueOff.fuel.toFixed(2) + ' mass=' + trueOff.mass.toFixed(2),
        'ig: t=' + ig.t.toFixed(4) + ' fuel=' + ig.fuel.toFixed(2) + ' mass=' + ig.mass.toFixed(2),
        'R1 pos_err=' + errR1_pos.toFixed(3) + ' m  vel_err=' + errR1_vel.toFixed(6) + ' m/s  mass_err=' + errR1_mass.toFixed(4) + ' kg',
        'R2 pos_err=' + errR2_pos.toFixed(3) + ' m  vel_err=' + errR2_vel.toFixed(8) + ' m/s  mass_err=' + errR2_mass.toFixed(5) + ' kg',
      ].join('\n');

      $('status').textContent = 'done';
      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      $('status').textContent = 'ERROR: ' + e.message;
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
  $('clearBtn').addEventListener('click', () => {
    $('t').querySelector('tbody').innerHTML = '';
    $('raw').textContent = '—';
    $('status').textContent = 'idle';
  });
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
