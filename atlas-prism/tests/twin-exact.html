<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twin Exact — 1 J/kg match test</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
input[type=number] { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:6px 10px; border-radius:4px; font:inherit; width:100px; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:600px; }
</style>
</head>
<body>

<h1>Twin Exact — raw bias 1e-9 precision, aim |ΔE| &lt; 1 J/kg</h1>

<label>base G <input type="number" id="baseG" value="0.60" step="0.01"></label>
<label>base bias <input type="number" id="baseB" value="0.59" step="0.01"></label>
<label>target G <input type="number" id="targetG" value="0.61" step="0.01"></label>
<label>initial bias guess <input type="number" id="bGuess" value="1.0616" step="0.0001"></label>
<button id="runBtn">Run bisection</button>
<div id="status">idle</div>
<pre id="log">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/worker-pool.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };
  const RE = CONFIG.EARTH_RADIUS, GM = CONFIG.GM_EARTH;

  function specE(m) {
    const r = RE + m.altCoastKm * 1000;
    return 0.5 * (m.vrCoast * m.vrCoast + m.vtCoast * m.vtCoast) - GM / r;
  }

  // Build raw values with arbitrary-precision bias (bypass lattice snap)
  function makeValues(G, biasDeg, leadSec, meco) {
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: G, PUSH_T_S: 4.82, MECO_TARGET_BOOSTER_FUEL_KG: meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: biasDeg,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: leadSec },
      done: { DEORBIT_ENABLED: false },
    };
  }

  async function evalAt(pool, G, bias, lead, meco, tol) {
    const values = makeValues(G, bias, lead, meco);
    const m = await pool.runEvalValues(values, { stopAt: 'COAST_WAIT_ENTRY', quiet: true });
    if (m.endReason !== 'COAST_WAIT_ENTRY') return { ok: false, end: m.endReason };
    return { ok: true, E: specE(m), ecc: m.eCoast, m };
  }

  async function run() {
    $('runBtn').disabled = true;
    logLines = [];
    try {
      const baseG = parseFloat($('baseG').value);
      const baseB = parseFloat($('baseB').value);
      const targetG = parseFloat($('targetG').value);
      const bGuess = parseFloat($('bGuess').value);

      log('creating pool with 6 workers…');
      const pool = new TunerCore.WorkerPool(6, { workerPath: '../lib/worker-sim.js' });
      await pool.waitReady();
      log('pool ready');

      log('');
      log('=== baseline (G=' + baseG + ', bias=' + baseB + ') ===');
      const mb = await evalAt(pool, baseG, baseB, 5.53, 52612);
      if (!mb.ok) { log('baseline failed: ' + mb.end); return; }
      const E_ref = mb.E;
      log('  E_ref = ' + E_ref.toFixed(6) + ' J/kg');

      // Bisection on bias at target G to reach E_ref
      log('');
      log('=== bisection on bias at G=' + targetG + ', aim |ΔE| < 1 J/kg ===');
      log('  precision: bias step resolution 1e-9 deg');
      log('');

      // Find bracket around bGuess
      const probes = [bGuess - 0.001, bGuess, bGuess + 0.001];
      const results = await Promise.all(probes.map(b =>
        evalAt(pool, targetG, b, 5.53, 52612).then(r => ({ b, ...r }))
      ));
      results.sort((a, b) => a.b - b.b);
      results.forEach(r => {
        if (!r.ok) { log('  b=' + r.b.toFixed(8) + '  ' + r.end); return; }
        log('  b=' + r.b.toFixed(8) + '  E=' + r.E.toFixed(3) + '  ΔE=' + (r.E - E_ref).toFixed(3));
      });

      let lo = null, hi = null;
      for (const r of results) {
        if (!r.ok) continue;
        if (r.E <= E_ref) lo = r;
        if (r.E >= E_ref) hi = r;
      }
      if (!lo || !hi) { log('could not bracket — try different guess'); return; }

      log('');
      log('  bracket: lo.b=' + lo.b.toFixed(8) + ' (E=' + lo.E.toFixed(3) + ')  hi.b=' + hi.b.toFixed(8) + ' (E=' + hi.E.toFixed(3) + ')');

      let best = Math.abs(lo.E - E_ref) < Math.abs(hi.E - E_ref) ? lo : hi;
      let iters = 0;
      const MAX_ITERS = 40;
      const B_TOL = 1e-10;

      while (iters < MAX_ITERS && Math.abs(hi.b - lo.b) > B_TOL) {
        iters++;
        const mid = (lo.b + hi.b) / 2;
        const r = await evalAt(pool, targetG, mid, 5.53, 52612);
        if (!r.ok) { log('  iter ' + iters + ' mid=' + mid.toFixed(10) + ' FAIL ' + r.end); break; }
        const dE = r.E - E_ref;
        log('  iter ' + iters + ' b=' + mid.toFixed(10) + '  E=' + r.E.toFixed(4) + '  ΔE=' + (dE >= 0 ? '+' : '') + dE.toFixed(4) + ' J/kg');
        if (Math.abs(dE) < Math.abs(best.E - E_ref)) best = { b: mid, E: r.E, ecc: r.ecc };
        // Slope is negative: lo (lower E) is at higher bias, hi (higher E) is at lower bias.
        // So if new mid has E < E_ref, it's the new lo (higher b); else new hi (lower b).
        if (dE < 0) lo = { b: mid, E: r.E }; else hi = { b: mid, E: r.E };
        if (Math.abs(dE) < 1.0) { log('  -> hit |ΔE| < 1 J/kg at iter ' + iters); break; }
      }

      log('');
      log('=== RESULT ===');
      log('baseline: G=' + baseG + '  bias=' + baseB + '  E=' + E_ref.toFixed(6) + ' J/kg');
      log('twin:     G=' + targetG + '  bias=' + best.b.toFixed(10) + '  E=' + best.E.toFixed(6) + ' J/kg');
      log('ΔE = ' + (best.E - E_ref).toFixed(6) + ' J/kg');
      log('|ΔE| = ' + Math.abs(best.E - E_ref).toFixed(6) + ' J/kg');
      log('iterations = ' + iters);
      log('');
      if (Math.abs(best.E - E_ref) < 1.0) {
        log('>>> SUCCESS: |ΔE| < 1 J/kg achieved <<<');
        log('    Twin (G=' + targetG + ', bias=' + best.b.toFixed(10) + ') matches baseline energy to 1 part in ~3.5e7.');
      } else {
        log('>>> REACHED |ΔE| = ' + Math.abs(best.E - E_ref).toFixed(4) + ' J/kg <<<');
        log('    Precision limited by double-precision epsilon in theta (~1e-16 rad).');
      }

    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message + '\n' + (e.stack || ''));
    } finally {
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
})();
</script>
</body>
</html>
