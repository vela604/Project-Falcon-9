<script>
// ============================================================================
// Pure search logic (no DOM, no pool) — evalFn(Gi, bias) -> Promise<{ok, cls, ...}>
// Gi = G in 0.01 deg units (integer). Pass = cls 'OK'.
// ============================================================================
const Search = (function () {
  const range = { lo: 30, hi: 75 };             // G search range in 0.01 units (0.30 .. 0.75)
  const GRID = [];                              // coarse sweep (step 0.05), filled by setRange
  const FINE = [];                              // every 0.01, filled by setRange
  function setRange(lo, hi) {
    range.lo = lo; range.hi = hi;
    GRID.length = 0; FINE.length = 0;
    for (let g = lo; g <= hi; g += 5) GRID.push(g);
    if (GRID[GRID.length - 1] !== hi) GRID.push(hi);
    for (let g = lo; g <= hi; g++) FINE.push(g);
  }
  setRange(30, 75);

  // Find one edge of the passing interval at fixed bias.
  //   side 'low'  -> smallest passing Gi   (G_min when bias = +bmax)
  //   side 'high' -> largest  passing Gi   (G_max when bias = -bmax)
  // Needs the sweep already evaluated (cached inside evalFn).
  async function edge(evalFn, bias, side, log, gridArg) {
    const GR = gridArg || GRID;
    let evals = 0;
    const ev = async (gi) => { evals++; return evalFn(gi, bias); };
    const sweep = {};
    for (const gi of GR) sweep[gi] = await ev(gi);            // cached -> cheap when shared
    const pass = GR.filter((g) => sweep[g].ok);
    if (!pass.length) return { status: 'NO_PASS_IN_SWEEP', bias, side, evals };

    if (side === 'low') {
      const p = Math.min.apply(null, pass);
      const below = GR.filter((g) => g < p);
      if (!below.length) return { status: 'AT_RANGE_EDGE', bias, side, Gi: p, evals,
        note: 'passes at G=' + (p / 100).toFixed(2) + ' (range floor): true edge is below the range' };
      let fail = Math.max.apply(null, below), good = p;       // fail < good
      while (good - fail > 1) {
        const mid = (fail + good) >> 1;
        const r = await ev(mid);
        if (r.ok) good = mid; else fail = mid;
      }
      return { status: 'FOUND', bias, side, Gi: good, failGi: fail, evals };
    } else {
      const p = Math.max.apply(null, pass);
      const above = GR.filter((g) => g > p);
      if (!above.length) return { status: 'AT_RANGE_EDGE', bias, side, Gi: p, evals,
        note: 'passes at G=' + (p / 100).toFixed(2) + ' (range ceiling): true edge is above the range' };
      let fail = Math.min.apply(null, above), good = p;       // good < fail
      while (fail - good > 1) {
        const mid = (fail + good) >> 1;
        const r = await ev(mid);
        if (r.ok) good = mid; else fail = mid;
      }
      return { status: 'FOUND', bias, side, Gi: good, failGi: fail, evals };
    }
  }

  // Sweep passes sanity: pass set at a fixed bias should be one contiguous run.
  function contiguous(cache, bias) {
    const recs = Object.keys(cache).map((k) => cache[k]).filter((r) => r.bias === bias).sort((a, b) => a.Gi - b.Gi);
    const flags = recs.map((r) => r.ok);
    let runs = 0;
    for (let i = 0; i < flags.length; i++) if (flags[i] && (i === 0 || !flags[i - 1])) runs++;
    return { runs, gis: recs.map((r) => r.Gi), flags };
  }


  // Pick K candidates spread evenly over the coastDeltaV range of the OK points (min and max included).
  function pickCandidates(recs, K) {
    const ok = recs.filter((r) => r.ok && Number.isFinite(r.dv)).sort((a, b) => a.dv - b.dv);
    if (ok.length <= K) return ok;
    const out = [], used = new Set();
    for (let i = 0; i < K; i++) {
      const idx = Math.round(i * (ok.length - 1) / (K - 1));
      if (!used.has(idx)) { used.add(idx); out.push(ok[idx]); }
    }
    return out;
  }
  function pearson(xs, ys) {
    const n = xs.length; if (n < 3) return NaN;
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
    return (sxx > 0 && syy > 0) ? sxy / Math.sqrt(sxx * syy) : NaN;
  }
  return { GRID, FINE, range, setRange, edge, contiguous, pickCandidates, pearson };
})();
</script>

<script>
// ============================================================================
// Page glue
// ============================================================================
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let logText = '';
function log(s, cls) {
  logText += s + '\n';
  const d = document.createElement('span');
  if (cls) d.className = cls;
  d.textContent = s + '\n';
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

let pool = null, NW = 4, QUIET = false;
async function getPool() {
  if (pool) return pool;
  let n = parseInt($('nw').value, 10);
  if (!(n > 0)) n = TunerCore.defaultWorkers();
  pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' }); NW = n;
  log('pool: ' + n + ' workers, booting...', 'dim');
  await pool.waitReady();
  const errs = pool.readyErrors.filter(Boolean);
  if (errs.length) log('worker boot errors: ' + errs.join(' | '), 'bad');
  log('pool ready', 'dim');
  return pool;
}

const PRESETS = {
  '2000': { alt: 2000, T: 4.82, lead: 7.82, meco: 0 },
  '320':  { alt: 320,  T: 4.82, lead: 5.53, meco: 52612 },
};
$('preset').onchange = () => {
  const p = PRESETS[$('preset').value];
  $('alt').value = p.alt; $('T').value = p.T; $('lead').value = p.lead; $('meco').value = p.meco;
};

function params() {
  const P = params0();
  Search.setRange(P.glo, P.ghi);
  return P;
}
function params0() {
  const alt = parseFloat($('alt').value);
  const T = parseFloat($('T').value), lead = parseFloat($('lead').value);
  return {
    alt, tol: parseFloat($('tol').value), tfrac: parseFloat($('tfrac').value), bmax: parseFloat($('bmax').value),
    Tn: Math.round(T / 0.000125), li: Math.round(lead / 0.0125),
    meco: Math.round(parseFloat($('meco').value)), K: parseInt($('K').value, 10) || 7,
    glo: Math.round(parseFloat($('glo').value) * 100), ghi: Math.round(parseFloat($('ghi').value) * 100),
    mstep: Math.max(1, Math.round(parseFloat($('mstep').value) * 100)),
  };
}

// Classification of one COAST_WAIT_ENTRY eval.
function classify(m, P) {
  if (m.endReason === 'STAGE_VR_NEG') return 'F1_BURN';
  if (m.crashed || m.endReason === 'CRASHED') return 'CRASH';
  if (m.endReason === 'COAST_WAIT_ENTRY') {
    if (!Number.isFinite(m.apoCoastKm)) return 'OTHER:noApo';
    if (m.apoCoastKm < P.alt - P.tol) return 'APO_SHORT';
    // Circularization physics: can the stage actually deliver coastDeltaV, and in time?
    if (!Number.isFinite(m.circDvMaxMps) || !Number.isFinite(m.circTBurnS) || !Number.isFinite(m.tToApoCoastS)) return 'OTHER:noPhys'; // never pass silently on missing data
    if (Number.isFinite(m.circDvMaxMps) && Number.isFinite(m.coastDeltaV) && m.coastDeltaV > m.circDvMaxMps) return 'FAIL_PHYS';   // fuel_short
    if (Number.isFinite(m.circTBurnS) && Number.isFinite(m.tToApoCoastS) && m.circTBurnS > P.tfrac * m.tToApoCoastS) return 'FAIL_PHYS'; // time_short
    return 'OK';
  }
  return 'OTHER:' + m.endReason;
}
const f1 = (x, d) => Number.isFinite(x) ? x.toFixed(d) : '--';

// Evaluator is kept across buttons (cache reused) until the parameters change.
let EV = null, EVKEY = '';
function getEv(P) {
  const key = JSON.stringify([P.alt, P.Tn, P.li, P.meco, P.tol, P.tfrac]);
  if (EV && key === EVKEY) return EV;
  EVKEY = key; EV = makeEvalFn(P);
  return EV;
}

function makeEvalFn(P) {
  const cache = {};            // key "Gi|bi" -> record
  const inflight = {};
  const fn = (Gi, bias) => {
    const bi = Math.round(bias / 0.0001);
    const key = Gi + '|' + bi;
    if (cache[key]) return Promise.resolve(cache[key]);
    if (inflight[key]) return inflight[key];
    const point = { Gi, Tn: P.Tn, bi, li: P.li, meco: P.meco };
    inflight[key] = pool.runEval(point, {
      stopAt: 'COAST_WAIT_ENTRY', abortOnStageVrNeg: true, targetAltKm: P.alt, quiet: true,
    }).then((m) => {
      const cls = classify(m, P);
      const rec = {
        Gi, bi, bias, cls, ok: cls === 'OK', end: m.endReason,
        maxOmega: m.maxOmega, vrMin: m.vrMinStageBurn, apoC: m.apoCoastKm,
        dv: m.coastDeltaV, fuelStop: m.stageFuelAtStopKg,
        dvMax: m.circDvMaxMps, tBurn: m.circTBurnS, tApo: m.tToApoCoastS,
        why: cls !== 'FAIL_PHYS' ? '' : (m.coastDeltaV > m.circDvMaxMps ? 'fuel_short' : 'time_short'), vrNegAlt: m.stageVrNegAltKm, wall: m.wallMs,
      };
      cache[key] = rec;
      if (!QUIET) log('G=' + (Gi / 100).toFixed(2) + ' b=' + (bias >= 0 ? '+' : '') + bias.toFixed(3) +
        '  ' + cls.padEnd(9) + ' maxΩ=' + f1(rec.maxOmega, 2) + '°/s  vrMin=' + f1(rec.vrMin, 1) +
        '  apoC=' + f1(rec.apoC, 1) + '  Δv=' + f1(rec.dv, 1) + '/' + f1(rec.dvMax, 0) +
        '  tBurn=' + f1(rec.tBurn, 0) + '/' + f1(rec.tApo, 0) + 's' + (rec.why ? ' ' + rec.why : '') +
        '  ' + (rec.wall / 1000).toFixed(1) + 's', rec.ok ? 'ok' : 'bad');
      if (!fn.shown && Number.isFinite(m.circVe)) {
        fn.shown = true;
        log('sim constants: Ve=' + f1(m.circVe, 0) + ' mdotMax=' + f1(m.circMdotMax, 1) + ' M0=' + f1(m.circM0Kg, 0) +
          ' dry(+payload)=' + f1(m.circDryKg, 0) + '   [Δv shown as need/max, tBurn as need/tToApo]', 'dim');
      }
      return rec;
    });
    return inflight[key];
  };
  fn.cache = cache;
  return fn;
}

function fmtEdge(r) {
  const g = (x) => (x / 100).toFixed(2);
  if (r.status === 'FOUND') return r.side === 'low'
    ? 'smallest pass G=' + g(r.Gi) + '  (G=' + g(r.failGi) + ' fails)'
    : 'largest  pass G=' + g(r.Gi) + '  (G=' + g(r.failGi) + ' fails)';
  if (r.status === 'AT_RANGE_EDGE') return 'NO BOUNDARY IN RANGE: ' + r.note;
  return 'NO PASS in fine sweep (whole G range): window empty at this bias';
}

// Edge search; if the coarse sweep sees no pass, retry once on the 1-step grid (narrow windows, e.g. 320 km).
async function edgeAuto(ev, bias, side) {
  let r = await Search.edge(ev, bias, side, log);
  if (r.status === 'NO_PASS_IN_SWEEP') {
    log('(bias ' + bias + ' ' + side + ': coarse sweep empty -> fine 1-step sweep)', 'dim');
    r = await Search.edge(ev, bias, side, log, Search.FINE);
  }
  return r;
}

function busy(on) { ['run', 'map', 'best', 'scan', 'range', 'trace'].forEach((id) => { $(id).disabled = on; }); }
async function guarded(fn) {
  busy(true);
  try { await fn(); } catch (e) { log('ERROR: ' + (e && e.message || e), 'bad'); }
  busy(false);
}
function header(P, what) {
  log('--- ' + what + '  alt=' + P.alt + ' T=' + (P.Tn * 0.000125) + ' lead=' + (P.li * 0.0125) +
    ' meco=' + P.meco + '  parent bias ±' + P.bmax + ' ---', 'dim');
}

$('run').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P), B = P.bmax;
  header(P, 'boundary search');
  await Promise.all(Search.GRID.flatMap((g) => [ev(g, +B), ev(g, -B)]));
  log('--- bisection ---', 'dim');
  // WIDEST bracket: low-G edge uses the most aggressive turn (-B), high-G edge the most resisting (+B).
  const [A, Bd, A2, B2] = await Promise.all([
    edgeAuto(ev, -B, 'low'),     // Search A : G_min (bias = -B)
    edgeAuto(ev, +B, 'high'),    // Search B : G_max (bias = +B)
    edgeAuto(ev, -B, 'high'),    // extra    : top edge of the -B window
    edgeAuto(ev, +B, 'low'),     // extra    : bottom edge of the +B window
  ]);
  log(''); log('=== RESULT ===');
  log('G_min  (bias=-' + B + '): ' + fmtEdge(A));
  log('G_max  (bias=+' + B + '): ' + fmtEdge(Bd));
  log('extra  top    edge at bias=-' + B + ': ' + fmtEdge(A2), 'dim');
  log('extra  bottom edge at bias=+' + B + ': ' + fmtEdge(B2), 'dim');
  if (A.status === 'FOUND' && Bd.status === 'FOUND')
    log('widest G bracket ≈ [' + (A.Gi / 100).toFixed(2) + ', ' + (Bd.Gi / 100).toFixed(2) + ']  width ' + ((Bd.Gi - A.Gi) / 100).toFixed(2) + '° (corners at different biases)');
  for (const b of [+B, -B]) {
    const c = Search.contiguous(ev.cache, b);
    if (c.runs > 1) log('WARNING bias ' + b + ': pass set not contiguous in tried G (' + c.runs + ' runs) -> bisection assumption broken, use Full scan', 'bad');
  }
  log('total evals run: ' + Object.keys(ev.cache).length);
});

// ---- Stage 2: window map, G (0.02 step) x bias (1 deg step). Cell = coastDeltaV if OK else class tag ----
function biasList(B) { const out = []; for (let b = -Math.floor(B); b <= Math.floor(B); b++) out.push(b); return out; }
$('map').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P);
  const bl = biasList(P.bmax), gl = [];
  for (let g = Search.range.lo; g <= Search.range.hi; g += P.mstep) gl.push(g);
  header(P, 'window map (' + (bl.length * gl.length) + ' COAST evals)');
  const jobs = []; for (const g of gl) for (const b of bl) jobs.push(ev(g, b));
  await Promise.all(jobs);
  log(''); log('cell = coastDeltaV (m/s) if OK, F1 = stage vr<0, APO = apo short, PH = circ physically impossible (fuel/time), X = other');
  log('G     ' + bl.map((b) => ((b >= 0 ? '+' : '') + b).padStart(6)).join(''));
  for (const g of gl) {
    log((g / 100).toFixed(2) + '  ' + bl.map((b) => {
      const r = ev.cache[g + '|' + Math.round(b / 0.0001)];
      const s = r.ok ? f1(r.dv, 0) : (r.cls === 'F1_BURN' ? 'F1' : r.cls === 'APO_SHORT' ? 'APO' : r.cls === 'FAIL_PHYS' ? 'PH' : 'X');
      return s.padStart(6);
    }).join(''), 'dim');
  }
});

// ---- Stage 3: CIRC_END + tuneLead on K candidates spread over the Δv range of OK points ----
$('best').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P);
  let recs = Object.keys(ev.cache).map((k) => ev.cache[k]);
  if (!recs.some((r) => r.ok)) { log('no OK points cached: run "2 Map window" first', 'bad'); return; }
  const cand = Search.pickCandidates(recs, P.K);
  header(P, 'CIRC_END + tuneLead on ' + cand.length + ' points');
  const runs = await Promise.all(cand.map((c) => {
    const point = { Gi: c.Gi, Tn: P.Tn, bi: c.bi, li: P.li, meco: P.meco };
    return pool.runJob('tuneLead', { point, opts: { targetAltKm: P.alt, maxEvals: 30 } })
      .then((r) => { log('tuned G=' + (c.Gi / 100).toFixed(2) + ' b=' + c.bias + ' -> ' + (r.ok ? 'lead=' + f1(r.lead, 3) : 'FAIL') +
        ' evals=' + r.evals + ' (' + (r.wallMs / 1000).toFixed(0) + 's)', r.ok ? 'ok' : 'bad'); return { c, r }; })
      .catch((e) => { log('tuneLead ERROR G=' + (c.Gi / 100) + ' b=' + c.bias + ': ' + e.message, 'bad'); return { c, r: null }; });
  }));
  log(''); log('=== CIRC_END table (sorted by coastDeltaV) ===');
  log('G     bias    Δv   fuelStop  lead  margin vrEnd   vrMin  residual  band evals  maxΩ');
  const rows = runs.filter((x) => x.r).sort((a, b) => a.c.dv - b.c.dv);
  for (const { c, r } of rows) {
    log((c.Gi / 100).toFixed(2) + '  ' + ((c.bias >= 0 ? '+' : '') + c.bias).padStart(4) + ' ' + f1(c.dv, 0).padStart(5) +
      f1(c.fuelStop, 0).padStart(10) + f1(r.lead, 2).padStart(7) + f1(r.marginS, 2).padStart(7) + f1(r.vrEnd, 3).padStart(7) +
      f1(r.vrMin, 2).padStart(8) + f1(r.stageFuelEngOffKg, 0).padStart(9) + (r.inBand ? '   yes' : '    NO') +
      String(r.evals).padStart(6) + f1(r.maxOmega, 1).padStart(7), r.ok ? 'ok' : 'bad');
  }
  const good = rows.filter((x) => x.r.ok && Number.isFinite(x.r.stageFuelEngOffKg));
  const cor = (fx, fy) => Search.pearson(good.map(fx), good.map(fy));
  log('');
  log('corr(Δv, lead)=' + f1(cor((x) => x.c.dv, (x) => x.r.lead), 2) +
    '  corr(Δv, residual)=' + f1(cor((x) => x.c.dv, (x) => x.r.stageFuelEngOffKg), 2) +
    '  corr(fuelStop, residual)=' + f1(cor((x) => x.c.fuelStop, (x) => x.r.stageFuelEngOffKg), 2) + '   (n=' + good.length + ')');
});


// ============================================================================
// Bias-range tools (Step 4/5). Everything works in integer bias units bi = 0.0001 deg.
// Pass set at fixed G is assumed to be ONE contiguous bias interval (cliffs at both ends).
// ============================================================================
const pc = (r) => r.ok ? 'P' : r.cls === 'F1_BURN' ? 'F' : r.cls === 'APO_SHORT' ? 'A' : r.cls === 'FAIL_PHYS' ? 'H' : 'X';
const bfmt = (bi) => ((bi >= 0 ? '+' : '') + (bi * 0.0001).toFixed(4));
const gfmt = (gi) => (gi / 100).toFixed(2);

// First passing record among ordered candidates [{Gi, bi}], evaluated in parallel batches of NW.
async function anyPass(ev, cands) {
  for (let i = 0; i < cands.length; i += NW) {
    const rs = await Promise.all(cands.slice(i, i + NW).map((c) => ev(c.Gi, c.bi * 0.0001)));
    const hit = rs.find((r) => r.ok);
    if (hit) return hit;
  }
  return null;
}

// Largest passing t in (t0, bound] where t = sign*bi. k-ary search: k probes per round, bracket shrinks (k+1)x.
async function edgeBias(ev, Gi, b0, sign, bound, res, k, tag) {
  const at = (t) => ev(Gi, sign * t * 0.0001);
  let lo = sign * b0, hi = bound, rounds = 0, nonContig = false;      // lo passes
  if (lo >= hi) return { t: lo, clipped: true, rounds: 0, nonContig };
  const rb = await at(hi);
  if (rb.ok) return { t: hi, clipped: true, rounds: 0, nonContig };   // passes all the way to the parent bound
  while (hi - lo > res) {
    rounds++;
    const pts = [];
    for (let j = 1; j <= k; j++) { const t = lo + Math.round((hi - lo) * j / (k + 1)); if (t > lo && t < hi && !pts.includes(t)) pts.push(t); }
    if (!pts.length) break;
    const rs = await Promise.all(pts.map(at));
    let j = 0, nlo = lo, nhi = hi;
    while (j < pts.length && rs[j].ok) { nlo = pts[j]; j++; }
    if (j < pts.length) { nhi = pts[j]; for (let q = j + 1; q < pts.length; q++) if (rs[q].ok) nonContig = true; }
    log('   G=' + gfmt(Gi) + ' ' + tag + ' r' + rounds + ': ' + pts.map((t, i) => bfmt(sign * t) + pc(rs[i])).join(' ') +
      '  -> [' + bfmt(sign * nlo) + ', ' + bfmt(sign * nhi) + ']', 'dim');
    lo = nlo; hi = nhi;
  }
  return { t: lo, clipped: false, rounds, nonContig };
}

// Full bias interval at G, starting from one known-passing bias b0. Both branches run concurrently.
async function rangeAtG(ev, Gi, b0, B, res) {
  const bound = Math.round(B / 0.0001), k = Math.max(2, Math.ceil(NW / 2));
  const [up, dn] = await Promise.all([
    edgeBias(ev, Gi, b0, +1, bound, res, k, '+side'),
    edgeBias(ev, Gi, b0, -1, bound, res, k, '-side'),
  ]);
  const lo = -dn.t, hi = up.t;
  return { Gi, lo, hi, width: hi - lo, mid: (lo + hi) / 2, clipLo: dn.clipped, clipHi: up.clipped, nonContig: up.nonContig || dn.nonContig };
}

// Step 1: anchor = a G where bias=0 passes. Fallback (clearly logged): +/-B, then bias grid at a fixed G.
async function findSeed(ev, P, gseed) {
  const Bi = Math.round(P.bmax / 0.0001);
  if (gseed != null) {
    log('anchor try: G=' + gfmt(gseed) + ' bias=0', 'dim');
    const r0 = await ev(gseed, 0);
    if (r0.ok) return r0;
    log('G=' + gfmt(gseed) + ': bias=0 does NOT pass (' + r0.cls + (r0.why ? ':' + r0.why : '') + ') -> fallback: bias grid 0.25° at this G', 'bad');
    const st = Math.round(0.25 / 0.0001), c = [];
    for (let b = st; b <= Bi; b += st) c.push({ Gi: gseed, bi: b }, { Gi: gseed, bi: -b });
    return anyPass(ev, c);
  }
  const zero = Search.FINE.map((g) => ({ Gi: g, bi: 0 }));
  log('anchor search: bias=0 at every G ' + gfmt(Search.range.lo) + '..' + gfmt(Search.range.hi) + ' (' + zero.length + ' probes, batches of ' + NW + ')', 'dim');
  const hit = await anyPass(ev, zero);
  if (hit) return hit;
  log('NO G passes at bias=0 in ' + gfmt(Search.range.lo) + '..' + gfmt(Search.range.hi) + ' -> fallback: bias=+/-' + P.bmax + ' (coarse G, then every G)', 'bad');
  const bs = [Bi, -Bi], seen = new Set(), c = [];
  for (const g of Search.GRID.concat(Search.FINE)) { if (seen.has(g)) continue; seen.add(g); for (const b of bs) c.push({ Gi: g, bi: b }); }
  return anyPass(ev, c);
}

function rangeLine(r, prev) {
  const sh = prev ? ((r.mid - prev.mid) * 0.0001) : NaN;
  return gfmt(r.Gi) + '  ' + bfmt(r.lo) + ' ' + bfmt(r.hi) + '  w=' + (r.width * 0.0001).toFixed(4) +
    '  mid=' + bfmt(Math.round(r.mid)) + '  shift=' + (Number.isFinite(sh) ? (sh >= 0 ? '+' : '') + sh.toFixed(4) : '--') +
    (r.lo <= 0 && r.hi >= 0 ? ' has0' : ' no0') + (r.clipLo ? ' CLIP-' : '') + (r.clipHi ? ' CLIP+' : '') + (r.nonContig ? ' NONCONTIG' : '');
}

$('range').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P);
  const res = Math.max(1, Math.round(parseFloat($('bres').value) / 0.0001));
  const gs = $('gseed').value.trim(); const gseed = gs ? Math.round(parseFloat(gs) * 100) : null;
  header(P, 'bias range at G' + (gseed != null ? '=' + gfmt(gseed) : ' (auto seed)'));
  QUIET = true;
  try {
    const seed = await findSeed(ev, P, gseed);
    if (!seed) { log('no passing point found (bias=0, then fallbacks)', 'bad'); return; }
    log('ANCHOR: G=' + gfmt(seed.Gi) + ' bias=' + bfmt(seed.bi) + (seed.bi === 0 ? ' (bias=0 pass)' : ' (FALLBACK, not a bias=0 anchor)') + '  Δv=' + f1(seed.dv, 0) + '/' + f1(seed.dvMax, 0), 'ok');
    const r = await rangeAtG(ev, seed.Gi, seed.bi, P.bmax, res);
    log(''); log('=== BIAS RANGE ==='); log('G     lo      hi       width    mid      shift');
    log(rangeLine(r, null), 'ok');
    log('evals so far: ' + Object.keys(ev.cache).length);
  } finally { QUIET = false; }
});

$('trace').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P);
  const res = Math.max(1, Math.round(parseFloat($('bres').value) / 0.0001));
  const gs = $('gseed').value.trim(); const gseed = gs ? Math.round(parseFloat(gs) * 100) : null;
  header(P, 'trace band over G');
  QUIET = true;
  const Bi = Math.round(P.bmax / 0.0001);
  try {
    const seed = await findSeed(ev, P, gseed);
    if (!seed) { log('no passing point found, nothing to trace', 'bad'); return; }
    log('ANCHOR: G=' + gfmt(seed.Gi) + ' bias=' + bfmt(seed.bi) + (seed.bi === 0 ? ' (bias=0 pass)' : ' (FALLBACK, not a bias=0 anchor)'), 'ok');
    const strict0 = $('strict0').checked;
    const r0 = await rangeAtG(ev, seed.Gi, seed.bi, P.bmax, res);
    const rows = { [seed.Gi]: r0 };
    for (const dir of [+1, -1]) {
      let prev = r0, shift = 0, Gi = seed.Gi;
      for (;;) {
        Gi += dir;
        if (Gi < Search.range.lo || Gi > Search.range.hi) { log('G range end at ' + gfmt(Gi - dir), 'dim'); break; }
        // 1) SEHRAN anchor: try bias=0 at this G first
        const z = await ev(Gi, 0);
        if (z.ok) {
          const rz = await rangeAtG(ev, Gi, 0, P.bmax, res);
          rows[Gi] = rz; log(rangeLine(rz, prev), 'ok');
          shift = rz.mid - prev.mid; prev = rz; continue;
        }
        log('G=' + gfmt(Gi) + ': bias=0 fails (' + z.cls + (z.why ? ':' + z.why : '') + ')' + (strict0 ? ' -> strict0: stop this side' : ' -> following band'), 'dim');
        if (strict0) break;
        // 2) fallback: candidates ordered by distance from predicted centre; spacing <= half the previous width
        const c = Math.round(prev.mid + shift), st = Math.max(Math.round(0.05 / 0.0001), Math.round(prev.width / 2));
        const cands = [{ Gi, bi: Math.max(-Bi, Math.min(Bi, c)) }];
        for (let d = st; d <= 2 * Bi; d += st) for (const s of [+1, -1]) { const b = c + s * d; if (b >= -Bi && b <= Bi) cands.push({ Gi, bi: b }); }
        const hit = await anyPass(ev, cands);
        if (!hit) { log('G=' + gfmt(Gi) + ': no pass in [-' + P.bmax + ',+' + P.bmax + '] (spacing ' + (st * 0.0001).toFixed(3) + '°) -> band ends this side', 'dim'); break; }
        const r = await rangeAtG(ev, Gi, hit.bi, P.bmax, res);
        rows[Gi] = r; log(rangeLine(r, prev), 'ok');
        shift = r.mid - prev.mid; prev = r;
      }
    }
    log(''); log('=== BAND (ascending G) ===');
    log('G     lo      hi       width    mid      shift    overlap-with-prev');
    const gis = Object.keys(rows).map(Number).sort((a, b) => a - b);
    gis.forEach((g, i) => {
      const r = rows[g], pr = i ? rows[gis[i - 1]] : null;
      const ov = pr ? ((Math.min(r.hi, pr.hi) - Math.max(r.lo, pr.lo)) * 0.0001) : NaN;
      log(rangeLine(r, pr) + '   ov=' + (Number.isFinite(ov) ? ov.toFixed(4) : '--'));
    });
    log('G rows: ' + gis.length + '   total evals: ' + Object.keys(ev.cache).length);
    log('ov > 0 -> adjacent G windows overlap; ov < 0 -> gap (touch hypothesis needs ov ≈ 0)', 'dim');
  } finally { QUIET = false; }
});

$('scan').onclick = () => guarded(async () => {
  const P = params(); await getPool(); const ev = getEv(P), B = P.bmax;
  header(P, 'full scan (' + (Search.FINE.length * 2) + ' evals)');
  const jobs = [];
  for (const g of Search.FINE) jobs.push(ev(g, +B), ev(g, -B));
  await Promise.all(jobs);
  log(''); log('G     | b=+' + B + '                 | b=-' + B);
  for (const g of Search.FINE) {
    const p = ev.cache[g + '|' + Math.round(B / 0.0001)], n = ev.cache[g + '|' + Math.round(-B / 0.0001)];
    const s = (r) => (r.cls.padEnd(9) + ' Ω' + f1(r.maxOmega, 1)).padEnd(22);
    log((g / 100).toFixed(2) + '  | ' + s(p) + '| ' + s(n));
  }
});

$('copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(logText); };
