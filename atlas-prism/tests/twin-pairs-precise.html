<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twin Pairs Precise — 10 A values, auto bracket, 1 J/kg</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
input[type=number] { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:6px 10px; border-radius:4px; font:inherit; width:90px; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
#live { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
        font-size:11px; margin:8px 0; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11px; overflow:auto; max-height:350px; }
canvas { background:#060912; border:1px solid #1c2b45; border-radius:4px; display:block; margin-top:10px; }
table { border-collapse:collapse; font-size:12px; margin:10px 0; width:100%; }
th, td { padding:6px 8px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
td.match { color:#4ade80; font-weight:600; }
td.close { color:#ffd23f; }
td.fail { color:#ff5f7e; }
</style>
</head>
<body>

<h1>Twin Pairs Precise — 10 A values, auto-bracket, live progress</h1>

<label>workers <input type="number" id="nW" value="6" min="1" max="8"></label>
<label style="margin-left:12px">base G <input type="number" id="baseG" value="0.60" step="0.01"></label>
<label>base bias <input type="number" id="baseB" value="0.59" step="0.01"></label>
<button id="runBtn">Run</button>
<div id="status">idle</div>
<div id="live"></div>
<pre id="log">—</pre>
<canvas id="chart" width="900" height="480"></canvas>
<div id="tableHost"></div>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/worker-pool.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status'), liveEl = $('live');
  let logLines = [];
  const log = (s) => { logLines.push(s); if (logLines.length > 400) logLines.shift(); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };
  const fmt = (x, d) => Number.isFinite(x) ? x.toFixed(d) : '—';
  const RE = CONFIG.EARTH_RADIUS, GM = CONFIG.GM_EARTH;
  const T = 4.82;
  const E_TOL = 1.0;         // J/kg target
  const BIAS_TOL = 1e-9;     // deg minimum step

  // per-G live state
  const live = {};

  function renderLive() {
    const keys = Object.keys(live).sort((a, b) => parseFloat(a) - parseFloat(b));
    if (!keys.length) { liveEl.textContent = '(no active tasks)'; return; }
    let html = '';
    keys.forEach(k => {
      const s = live[k];
      const bar = '█'.repeat(Math.min(30, s.evals));
      const statusTxt = s.done ? (s.ok ? '✓ DONE' : '~ CLOSE') : 'RUNNING';
      const eTxt = Number.isFinite(s.E) ? s.E.toFixed(3) : '—';
      const dTxt = Number.isFinite(s.dE) ? (s.dE >= 0 ? '+' : '') + s.dE.toFixed(3) : '—';
      html += 'G=' + k + '  ' + statusTxt + '  ' + bar + '  evals=' + s.evals +
              '  last b=' + fmt(s.b, 8) + '  E=' + eTxt + '  ΔE=' + dTxt + '  (' + s.phase + ')\n';
    });
    liveEl.textContent = html;
  }

  function specE(m) {
    const r = RE + m.altCoastKm * 1000;
    return 0.5 * (m.vrCoast * m.vrCoast + m.vtCoast * m.vtCoast) - GM / r;
  }

  function rawValues(G, bias, leadSec, meco) {
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: G, PUSH_T_S: T, MECO_TARGET_BOOSTER_FUEL_KG: meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: bias,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: leadSec },
      done: { DEORBIT_ENABLED: false },
    };
  }

  async function evalAt(pool, G, b) {
    const m = await pool.runEvalValues(rawValues(G, b, 5.53, 52612), { stopAt: 'COAST_WAIT_ENTRY', quiet: true });
    const ok = m.endReason === 'COAST_WAIT_ENTRY' && Number.isFinite(m.eCoast);
    const E = ok ? specE(m) : NaN;
    return { b, E, ok, ecc: m.eCoast, end: m.endReason };
  }

  async function bisectG(pool, Gkey, G, E_ref, baseBias) {
    const state = live[Gkey];
    const evals = [];

    async function ev(b) {
      state.b = b; state.phase = 'evaluating'; renderLive();
      const r = await evalAt(pool, G, b);
      state.evals++;
      evals.push(r);
      state.E = r.E;
      state.dE = Number.isFinite(r.E) ? (r.E - E_ref) : NaN;
      if (!r.ok) state.phase = r.end;
      renderLive();
      return r;
    }

    // 1. base probe
    state.phase = 'base';
    const r0 = await ev(baseBias);
    if (r0.ok && Math.abs(r0.E - E_ref) < E_TOL) {
      state.done = true; state.ok = true; state.phase = 'converged';
      renderLive();
      return { G, ok: true, bias: r0.b, E: r0.E, deltaE: r0.E - E_ref, ecc: r0.ecc, evals: evals.length };
    }

    // 2. probe both directions to pick walk direction (whichever reduces |dE|)
    state.phase = 'direction';
    const h0 = 0.05;
    const rP = await ev(baseBias + h0);
    const rM = await ev(baseBias - h0);
    const dBase = Math.abs(r0.E - E_ref);
    const dPos = rP.ok ? Math.abs(rP.E - E_ref) : Infinity;
    const dNeg = rM.ok ? Math.abs(rM.E - E_ref) : Infinity;
    let dir;
    if (dPos < dNeg) dir = +1; else dir = -1;
    if (!rP.ok && rM.ok) dir = -1;
    if (!rM.ok && rP.ok) dir = +1;

    // bracket tracking: above (E >= ref) and below (E <= ref)
    let above = null, below = null;
    const track = (r) => {
      if (!r || !r.ok) return;
      if (r.E >= E_ref) { if (!above || r.E < above.E) above = r; }
      if (r.E <= E_ref) { if (!below || r.E > below.E) below = r; }
    };
    track(r0); track(rP); track(rM);

    // 3. walk in chosen direction, growing step, until sign flip
    state.phase = 'walk ' + (dir > 0 ? '+' : '-');
    let step = 0.1;
    let curB = baseBias;
    const MAX_WALK = 30;
    let walked = 0;

    for (let i = 0; i < MAX_WALK; i++) {
      if (above && below) break;
      step = Math.min(3.0, step * 1.6);
      curB += dir * step;
      if (Math.abs(curB) > 25) break;
      const r = await ev(curB);
      if (!r.ok) {
        walked++;
        if (walked > 8) break;   // too many fails in a row
        continue;
      }
      walked = 0;
      track(r);
      if (Math.abs(r.E - E_ref) < E_TOL) { above = r; below = r; break; }
    }

    // 4. bracket found -> bisect
    if (above && below) {
      state.phase = 'bisect';
      let bA = above.b, bB = below.b;
      let best = Math.abs(above.E - E_ref) < Math.abs(below.E - E_ref) ? above : below;

      for (let it = 0; it < 60; it++) {
        if (Math.abs(bA - bB) < BIAS_TOL) break;
        const mid = (bA + bB) / 2;
        const r = await ev(mid);
        if (!r.ok) break;
        const dE = r.E - E_ref;
        if (Math.abs(dE) < Math.abs(best.E - E_ref)) best = r;
        if (Math.abs(dE) < E_TOL) { best = r; break; }
        if (r.E >= E_ref) bA = mid; else bB = mid;
      }
      state.done = true;
      state.ok = Math.abs(best.E - E_ref) < E_TOL;
      state.phase = state.ok ? 'converged' : 'close';
      renderLive();
      return { G, ok: state.ok, bias: best.b, E: best.E, deltaE: best.E - E_ref, ecc: best.ecc, evals: evals.length };
    }

    // 5. no bracket — return closest valid
    const valid = evals.filter(e => e.ok);
    const best = valid.sort((a, b) => Math.abs(a.E - E_ref) - Math.abs(b.E - E_ref))[0];
    state.done = true; state.ok = false; state.phase = 'no bracket';
    renderLive();
    if (!best) return { G, ok: false, reason: 'all fail', evals: evals.length };
    return { G, ok: false, reason: 'no bracket', bias: best.b, E: best.E, deltaE: best.E - E_ref, ecc: best.ecc, evals: evals.length };
  }

  async function run() {
    $('runBtn').disabled = true;
    logLines = []; logEl.textContent = '—'; $('tableHost').innerHTML = ''; liveEl.textContent = '';
    Object.keys(live).forEach(k => delete live[k]);

    const ctx = $('chart').getContext('2d');
    ctx.fillStyle = '#060912'; ctx.fillRect(0, 0, 900, 480);
    const liveTimer = setInterval(renderLive, 250);

    try {
      const n = Math.max(1, Math.min(8, parseInt($('nW').value, 10) || 6));
      const baseG = parseFloat($('baseG').value);
      const baseB = parseFloat($('baseB').value);

      statusEl.textContent = 'creating pool…';
      log('creating pool with ' + n + ' workers…');
      const pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' });
      await pool.waitReady();
      log('pool ready');
      const t0 = performance.now();

      // baseline
      log('');
      log('=== baseline G=' + baseG + ' bias=' + baseB + ' ===');
      const mBase = await pool.runEvalValues(rawValues(baseG, baseB, 5.53, 52612), { stopAt: 'COAST_WAIT_ENTRY', quiet: true });
      const E_ref = specE(mBase);
      log('  E_ref = ' + E_ref.toFixed(6) + ' J/kg  ecc=' + fmt(mBase.eCoast, 7));

      // 11 G values — contour exists only for G >= ~0.575 (A >= ~13.35).
      // A = G * T^2, T = 4.82.
      const Gs = [0.575, 0.58, 0.585, 0.59, 0.595, 0.60, 0.605, 0.61, 0.62, 0.63, 0.65];
      log('');
      log('G values: ' + Gs.map(g => g.toFixed(3) + '(A=' + (g*T*T).toFixed(3) + ')').join(', '));

      // init live state
      Gs.forEach(g => {
        live[g.toFixed(2)] = { evals: 0, b: NaN, E: NaN, dE: NaN, phase: 'queued', done: false, ok: false };
      });
      renderLive();

      log('');
      log('=== parallel bisection, target |ΔE| < ' + E_TOL + ' J/kg, bias tol 1e-9 deg ===');
      statusEl.textContent = 'bisecting ' + Gs.length + ' G values…';

      const tasks = Gs.map(g => bisectG(pool, g.toFixed(2), g, E_ref, baseB));
      const results = await Promise.all(tasks);

      clearInterval(liveTimer);
      renderLive();

      const wall = (performance.now() - t0) / 1000;
      log('');
      log('=== results (wall ' + fmt(wall, 1) + 's) ===');

      // Table
      let html = '<table><thead><tr><th>G</th><th>A</th><th>bias (10dp)</th><th>E (J/kg)</th><th>ΔE</th><th>|ΔE|</th><th>ecc</th><th>evals</th><th>status</th></tr></thead><tbody>';
      html += '<tr><td>' + baseG.toFixed(2) + '</td><td>' + (baseG*T*T).toFixed(4) + '</td><td>' + baseB.toFixed(10) + '</td><td>' + E_ref.toFixed(4) + '</td><td>0.0000</td><td class="match">0</td><td>' + fmt(mBase.eCoast, 7) + '</td><td>1</td><td>baseline</td></tr>';
      results.sort((a, b) => a.G - b.G);
      let allOk = true, totalEvals = 0;
      results.forEach(r => {
        totalEvals += r.evals || 0;
        const abs = Number.isFinite(r.deltaE) ? Math.abs(r.deltaE) : NaN;
        let cls = 'fail', status;
        if (r.ok && abs < 1) { cls = 'match'; status = 'MATCH'; }
        else if (Number.isFinite(abs) && abs < 50) { cls = 'close'; status = 'CLOSE'; allOk = false; }
        else { cls = 'fail'; status = 'FAIL'; allOk = false; }
        html += '<tr><td>' + r.G.toFixed(2) + '</td><td>' + (r.G*T*T).toFixed(4) + '</td><td>' + fmt(r.bias, 10) + '</td><td>' + (Number.isFinite(r.E) ? r.E.toFixed(4) : '—') + '</td><td>' + (Number.isFinite(r.deltaE) ? (r.deltaE >= 0 ? '+' : '') + r.deltaE.toFixed(4) : '—') + '</td><td class="' + cls + '">' + (Number.isFinite(abs) ? abs.toFixed(4) : '—') + '</td><td>' + (r.ecc ? fmt(r.ecc, 7) : '—') + '</td><td>' + (r.evals || 0) + '</td><td class="' + cls + '">' + status + (r.reason ? ' (' + r.reason + ')' : '') + '</td></tr>';
        log('  G=' + r.G.toFixed(2) + '  bias=' + fmt(r.bias, 10) + '  E=' + (Number.isFinite(r.E) ? r.E.toFixed(4) : '—') + '  |ΔE|=' + (Number.isFinite(abs) ? abs.toFixed(4) : '—') + '  evals=' + r.evals + (r.ok ? '' : '  [' + (r.reason || 'close') + ']'));
      });
      html += '</tbody></table>';
      $('tableHost').innerHTML = html;

      // Chart
      const pts = [{ A: baseG*T*T, bias: baseB, tag: 'baseline', ok: true }];
      results.forEach(r => pts.push({ A: r.G*T*T, bias: r.bias, tag: 'G=' + r.G.toFixed(2), ok: r.ok }));
      drawChart(ctx, pts);

      statusEl.textContent = 'done — ' + fmt(wall, 1) + 's, ' + totalEvals + ' evals, ' + (allOk ? 'ALL MATCH' : 'some close/fail');
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message + '\n' + (e.stack || ''));
    } finally {
      clearInterval(liveTimer);
      $('runBtn').disabled = false;
    }
  }

  function drawChart(ctx, pts) {
    const W = 900, H = 480;
    const padL = 90, padR = 40, padT = 30, padB = 60;
    const pw = W - padL - padR, ph = H - padT - padB;

    const aMin = Math.min(...pts.map(p => p.A)) - 0.1;
    const aMax = Math.max(...pts.map(p => p.A)) + 0.1;
    const bVals = pts.map(p => p.bias).filter(Number.isFinite);
    const bMin = Math.min(...bVals) - 0.3;
    const bMax = Math.max(...bVals) + 0.3;

    const X = (a) => padL + (a - aMin) / (aMax - aMin) * pw;
    const Y = (b) => padT + ph - (b - bMin) / (bMax - bMin) * ph;

    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + i * ph / 5;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
      const x = padL + i * pw / 5;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    ctx.fillStyle = 'rgba(150,170,200,0.9)'; ctx.font = '11px monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const b = bMin + i * (bMax - bMin) / 5;
      ctx.fillText(b.toFixed(2), padL - 8, padT + ph - i * ph / 5);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let i = 0; i <= 5; i++) {
      const a = aMin + i * (aMax - aMin) / 5;
      ctx.fillText(a.toFixed(2), padL + i * pw / 5, padT + ph + 8);
    }
    ctx.fillStyle = '#35d6ff'; ctx.font = 'bold 12px monospace';
    ctx.fillText('A = G · T²  (T=4.82)', padL + pw / 2, H - 24);
    ctx.save();
    ctx.translate(24, padT + ph / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('bias (deg)', 0, 0);
    ctx.restore();

    const sorted = pts.slice().sort((a, b) => a.A - b.A);
    ctx.strokeStyle = '#35d6ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    sorted.forEach((p, i) => {
      const x = X(p.A), y = Y(p.bias);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    sorted.forEach(p => {
      const x = X(p.A), y = Y(p.bias);
      ctx.fillStyle = p.tag === 'baseline' ? '#4ade80' : (p.ok ? '#ffd23f' : '#ff5f7e');
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dbe6f5'; ctx.font = '10px monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(p.tag, x + 8, y - 6);
    });
  }

  $('runBtn').addEventListener('click', run);
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
