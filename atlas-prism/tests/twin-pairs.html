<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twin Pairs — same CW energy at different (G, bias)</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
input[type=number] { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:6px 10px; border-radius:4px; font:inherit; width:80px; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:500px; }
table { border-collapse:collapse; font-size:12px; margin:10px 0; width:100%; }
th, td { padding:6px 10px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.match td { background:rgba(74,222,128,0.10); color:#4ade80; }
</style>
</head>
<body>

<h1>Twin Pairs — same orbital energy at COAST_WAIT, different (G, bias)</h1>

<button id="runBtn">Run</button>
<pre id="log">—</pre>
<div id="tableHost"></div>
<pre id="pairs">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>

<script src="../lib/config.js"></script>
<script src="../lib/worker-pool.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), pairEl = $('pairs');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };
  const fmt = (x, d) => Number.isFinite(x) ? x.toFixed(d) : '—';

  const RE = CONFIG.EARTH_RADIUS, GM = CONFIG.GM_EARTH;

  // specific orbital energy from CW metrics
  function specEnergy(m) {
    if (!Number.isFinite(m.vrCoast) || !Number.isFinite(m.vtCoast) || !Number.isFinite(m.altCoastKm)) return NaN;
    const r = RE + m.altCoastKm * 1000;
    const v2 = m.vrCoast * m.vrCoast + m.vtCoast * m.vtCoast;
    return 0.5 * v2 - GM / r;
  }

  async function run() {
    $('runBtn').disabled = true;
    logLines = [];
    logEl.textContent = '—'; pairEl.textContent = '—';
    $('tableHost').innerHTML = '';

    try {
      const n = 4;
      log('creating pool with ' + n + ' workers…');
      const pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' });
      await pool.waitReady();
      log('pool ready');

      const Q = TunerConfig.quanta;
      const basePoint = {
        Gi: 60, Tn: Math.round(4.82 / Q.T),
        bi: Math.round(0.59 / Q.bias),
        li: Math.round(5.53 / Q.lead),
        meco: 52612,
      };

      const biases = [0.50, 0.70];
      const Gs = [0.57, 0.58, 0.59, 0.60, 0.61];
      const probes = [];
      biases.forEach(b => Gs.forEach(g => probes.push({ g, b })));
      log('grid: ' + biases.length + ' biases x ' + Gs.length + ' G values = ' + probes.length + ' probes');

      const t0 = performance.now();
      const results = await Promise.all(probes.map(({ g, b }) => {
        const p = Object.assign({}, basePoint, {
          Gi: Math.round(g / Q.G),
          bi: Math.round(b / Q.bias),
        });
        return pool.runEval(p, { stopAt: 'COAST_WAIT_ENTRY', quiet: true })
          .then(m => ({ g, b, m, E: specEnergy(m), ecc: m.eCoast, end: m.endReason,
                        apoKm: m.apoCoastKm, periKm: m.periCoastKm }))
          .catch(e => ({ g, b, error: e.message }));
      }));
      const wall = (performance.now() - t0) / 1000;
      log('all probes done in ' + fmt(wall, 2) + 's');
      log('');

      // table
      const byBias = {};
      results.forEach(r => { (byBias[r.b] = byBias[r.b] || []).push(r); });
      Object.keys(byBias).forEach(b => byBias[b].sort((x, y) => x.g - y.g));

      let html = '<table><thead><tr><th>bias \\ G</th>';
      Gs.forEach(g => html += '<th>' + g.toFixed(2) + '</th>');
      html += '</tr></thead><tbody>';
      biases.forEach(b => {
        html += '<tr><td>' + b.toFixed(2) + '</td>';
        Gs.forEach(g => {
          const r = byBias[b].find(x => x.g === g);
          if (!r || r.error || !Number.isFinite(r.E)) html += '<td>FAIL</td>';
          else html += '<td>E=' + (r.E / 1e7).toFixed(4) + 'e7<br><span style="color:#6b7d9c">ecc=' + r.ecc.toFixed(4) + '</span></td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      $('tableHost').innerHTML = html;

      log('energy in J/kg, displayed as ×1e7.');
      log('');
      log('=== table ===');
      log('        ' + Gs.map(g => 'G=' + g.toFixed(2).padEnd(14)).join(''));
      biases.forEach(b => {
        const row = byBias[b].map(r => Number.isFinite(r.E) ? (r.E / 1e7).toFixed(4) + '        ' : 'FAIL          ');
        log('b=' + b.toFixed(2) + '  ' + row.join(''));
      });

      // find matching pairs (any 2 probes with |E1 - E2| < tol)
      const valid = results.filter(r => Number.isFinite(r.E));
      const tol = 0.005e7;  // 0.005e7 J/kg
      const pairs = [];
      for (let i = 0; i < valid.length; i++) {
        for (let j = i + 1; j < valid.length; j++) {
          const a = valid[i], b = valid[j];
          if (a.g === b.g && a.b === b.b) continue;
          const dE = Math.abs(a.E - b.E);
          if (dE < tol) pairs.push({ a, b, dE });
        }
      }
      pairs.sort((x, y) => x.dE - y.dE);

      log('');
      log('=== matching pairs (|ΔE| < ' + (tol/1e7).toFixed(3) + 'e7) ===');
      if (!pairs.length) {
        log('no pairs matched within tol. closest pairs:');
        const all = [];
        for (let i = 0; i < valid.length; i++) for (let j = i + 1; j < valid.length; j++) {
          const a = valid[i], b = valid[j];
          if (a.g === b.g && a.b === b.b) continue;
          all.push({ a, b, dE: Math.abs(a.E - b.E) });
        }
        all.sort((x, y) => x.dE - y.dE);
        all.slice(0, 5).forEach(p => {
          log('  (' + p.a.g.toFixed(2) + ', b=' + p.a.b.toFixed(2) + ') E=' + (p.a.E / 1e7).toFixed(4) +
              '  <->  (' + p.b.g.toFixed(2) + ', b=' + p.b.b.toFixed(2) + ') E=' + (p.b.E / 1e7).toFixed(4) +
              '  ΔE=' + (p.dE / 1e7).toFixed(4));
        });
      } else {
        pairs.slice(0, 8).forEach((p, i) => {
          log('#' + (i + 1) + '  (G=' + p.a.g.toFixed(2) + ', b=' + p.a.b.toFixed(2) + ') E=' + (p.a.E / 1e7).toFixed(4) + ' ecc=' + p.a.ecc.toFixed(4) +
              '  <->  (G=' + p.b.g.toFixed(2) + ', b=' + p.b.b.toFixed(2) + ') E=' + (p.b.E / 1e7).toFixed(4) + ' ecc=' + p.b.ecc.toFixed(4) +
              '  ΔE=' + (p.dE / 1e7).toFixed(4));
        });
      }

      pairEl.textContent = 'closest matching pairs:\n' + pairs.slice(0, 5).map(p =>
        'A1=' + (p.a.g * 4.82 * 4.82).toFixed(4) + ' b1=' + p.a.b.toFixed(2) + ' E1=' + (p.a.E/1e7).toFixed(5) + 'e7\n' +
        'A2=' + (p.b.g * 4.82 * 4.82).toFixed(4) + ' b2=' + p.b.b.toFixed(2) + ' E2=' + (p.b.E/1e7).toFixed(5) + 'e7\n' +
        'ΔE=' + (p.dE / 1e7).toFixed(5) + 'e7  J/kg'
      ).join('\n\n');

      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message);
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
})();
</script>
</body>
</html>
