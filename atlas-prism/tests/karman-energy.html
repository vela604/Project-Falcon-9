<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karman Direct Prediction</title>
<style>
  :root { --bg:#060912; --panel:#0d1424; --border:#1c2b45; --text:#dbe6f5;
          --cyan:#35d6ff; --green:#4ade80; --yellow:#ffd23f; --red:#ff5f7e; --dim:#6b7d9c; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 monospace; padding:20px; }
  h1 { font-size:15px; color:var(--cyan); margin:0 0 12px; letter-spacing:1px; text-transform:uppercase; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:12px; }
  button { background:#101a30; color:var(--text); border:1px solid var(--border);
           padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
  button:hover { border-color:var(--cyan); color:var(--cyan); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  select { background:#101a30; color:var(--text); border:1px solid var(--border);
           padding:8px 12px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
  #status { color:var(--yellow); margin:8px 0; min-height:1.2em; }
  table { border-collapse:collapse; font-size:12.5px; width:100%; margin-top:6px; }
  th, td { padding:6px 10px; text-align:right; border-bottom:1px solid var(--border); }
  th { color:var(--cyan); font-weight:600; }
  td:first-child, th:first-child { text-align:left; color:var(--dim); }
  tr.highlight td { background:rgba(74,222,128,0.06); }
  tr.bad td { background:rgba(255,95,126,0.08); color:var(--red); }
  pre { background:#0a1020; border:1px solid var(--border); padding:8px; border-radius:4px;
        font-size:11.5px; overflow:auto; max-height:400px; line-height:1.5; }
</style>
</head>
<body>

<h1>Karman Direct Prediction — predicted fuel residual vs actual</h1>

<div class="panel">
  <label style="color:var(--dim);margin-right:8px;">Target:</label>
  <select id="altSel">
    <option value="320">320 km (baseline)</option>
    <option value="2000">2000 km (ORB-2000)</option>
  </select>
  <button id="runBtn">Run</button>
  <button id="clearBtn">Clear</button>
  <div id="status">idle</div>
</div>

<div class="panel">
  <div style="font-size:11.5px;color:var(--dim);margin-bottom:6px;">Predicted at Karman vs actual at end</div>
  <table id="resTable">
    <thead><tr><th>quantity</th><th>value</th><th>units</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="panel">
  <div style="font-size:11.5px;color:var(--dim);margin-bottom:6px;">Raw signals</div>
  <pre id="raw">—</pre>
</div>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, dt = CONFIG.DT;
  const KARMAN = 100000;
  const D2R = Math.PI/180;

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }

  function bodyState(b) {
    const r = Math.hypot(b.rx, b.ry);
    const v = Math.hypot(b.vx, b.vy);
    const vr = (b.vx*b.rx + b.vy*b.ry) / r;
    const vt = (b.vx*b.ry - b.vy*b.rx) / r;
    const gamma = Math.atan2(vr, vt);
    return { r, v, vr, vt, gamma, altM: r - Re, t: state.simTime };
  }

  function computeMc() {
    const stk = getActiveStack();
    const members = getActiveStackMembers();
    let stageDry = 0;
    members.forEach(m => {
      if (m.stageRole === 'stage' && typeof stageDerivedMasses === 'function') {
        const d = stageDerivedMasses(m);
        if (d && !d.infeasible) stageDry += d.dryMassNoPayload;
      }
    });
    let payloadMass = 0;
    if (stk && stk.payloadId && typeof getPayload === 'function') {
      const pl = getPayload(stk.payloadId);
      if (pl && Number.isFinite(pl.mass)) payloadMass = pl.mass;
    }
    return { mc: stageDry + payloadMass, stageDry, payloadMass };
  }

  function Eof(mc, r, v) { return 0.5 * mc * v * v - GM * mc / r; }
  function Etarget(mc, altKm) {
    const r = Re + altKm * 1000, v = Math.sqrt(GM / r);
    return Eof(mc, r, v);
  }

  function stageFuelNow() {
    const st = findStage();
    if (st && Number.isFinite(st.fuelMass)) return st.fuelMass;
    const ab = state.bodies[state.activeBodyIndex];
    if (ab && ab.members) {
      for (let i = 0; i < ab.members.length; i++) {
        if (ab.members[i] && ab.members[i].stageRole === 'stage') {
          if (Array.isArray(ab.memberFuel) && Number.isFinite(ab.memberFuel[i])) return ab.memberFuel[i];
        }
      }
    }
    return NaN;
  }

  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }

  function pickRunConfig(altKm) {
    const T = TunerConfig;
    const ref = (T.references || []).find(r => r.alt === altKm);
    if (ref) {
      return {
        values: {
          ascent: { PUSH_MAX_GIMBAL_DEG: ref.G, PUSH_T_S: ref.T != null ? ref.T : T.T0,
                    MECO_TARGET_BOOSTER_FUEL_KG: ref.meco },
          insertion: { TARGET_ORBIT_ALT_KM: altKm,
                       STAGE_BURN_AOA_BIAS_DEG: ref.bias,
                       STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                       CIRC_TRIGGER_LEAD_S: ref.lead },
          done: { DEORBIT_ENABLED: false },
        },
        durationCap: altKm <= 400 ? 800 : (altKm <= 800 ? 1200 : 2500),
      };
    }
    const b = T.baselineRaw;
    return {
      values: {
        ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
        insertion: { TARGET_ORBIT_ALT_KM: altKm,
                     STAGE_BURN_AOA_BIAS_DEG: b.bias,
                     STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                     CIRC_TRIGGER_LEAD_S: b.lead },
        done: { DEORBIT_ENABLED: false },
      },
      durationCap: 2500,
    };
  }

  function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    const altKm = parseFloat($('altSel').value);
    const mcInfo = computeMc();
    const mc = mcInfo.mc;
    const cfg = pickRunConfig(altKm);
    $('status').textContent = 'running ' + altKm + ' km…';
    $('runBtn').disabled = true;

    setTimeout(async () => {
      try {
        TunerEngine.prepareRun(TunerConfig.guideName, cfg.values, TunerConfig.env);
        let karman = null, lastState = null, lastFuel = NaN, lastR = NaN, lastV = NaN;
        const maxTicks = Math.ceil(cfg.durationCap / dt);
        let lastYield = performance.now();

        for (let i = 0; i < maxTicks; i++) {
          if (state.halted) break;
          TunerEngine.tick(dt);

          const b = state.bodies[state.activeBodyIndex];
          if (!b) continue;
          const st = bodyState(b);
          const sf = stageFuelNow();
          const gs = Guidance.getGuideStatus();

          if (!karman && st.altM >= KARMAN) {
            karman = Object.assign({}, st, { E: Eof(mc, st.r, st.v), stageFuel: sf });
          }

          lastState = st;
          lastFuel = sf;
          lastR = st.r; lastV = st.v;

          if (gs && gs.payloadCleared) break;

          if ((i & 255) === 255) {
            const now = performance.now();
            if (now - lastYield > 40) {
              $('status').textContent = 't=' + st.t.toFixed(1) + 's alt=' + (st.altM/1000).toFixed(1) + 'km';
              await new Promise(res => setTimeout(res, 0));
              lastYield = now;
            }
          }
        }

        if (!karman) { $('status').textContent = 'Karman never crossed'; $('runBtn').disabled = false; return; }

        let Ve = NaN;
        const stb = findStage();
        if (stb && stb.engines && stb.engines.length && Number.isFinite(stb.engines[0].Ve)) {
          Ve = stb.engines[0].Ve;
        }

        $('status').textContent = 'done';
        render(karman, lastState, lastFuel, lastR, lastV, mc, mcInfo, Ve, altKm);
        $('runBtn').disabled = false;
      } catch (err) {
        console.error(err);
        $('status').textContent = 'ERROR: ' + err.message;
        $('runBtn').disabled = false;
      }
    }, 20);
  }

  function render(karman, lastState, lastFuel, lastR, lastV, mc, mcInfo, Ve, altKm) {
    const rTarget = Re + altKm * 1000;
    const vTarget = Math.sqrt(GM / rTarget);
    const Etgt = Eof(mc, rTarget, vTarget);

    const rK = karman.r, vK = karman.v, gK = karman.gamma;
    const F_K = karman.stageFuel;
    const E_now = karman.E;
    const E_actual_final = Eof(mc, lastR, lastV);
    const residual_actual = lastFuel;

    // --- Direct prediction at Karman ---
    // Target: M_c should end with E_target.
    // We need ΔE_mech = E_target − E_now, delivered as work by stage fuel.
    // Empirical correction: thrust is roughly tangential while velocity has a
    // climb angle γ, so the useful work fraction is ~cos(γ_K). Reduces the
    // naive Oberth + KE prediction error from ~18% to ~3% (see karman v3 run).
    const dE_needed = Etgt - E_now;
    const dPE = GM * mc * (1 / rK - 1 / rTarget);
    const C = Math.cos(gK);
    // Solve quadratic in Δv: C·(mc·vK·Δv + ½·mc·Δv²) + dPE − dE_needed = 0
    const a = C * 0.5 * mc;
    const b = C * mc * vK;
    const c = dPE - dE_needed;
    const disc = b*b - 4*a*c;
    const dv_required = disc >= 0 ? (-b + Math.sqrt(disc)) / (2*a) : NaN;
    // Tsiolkovsky: Δv = Ve · ln(Mi_stage / (mc + residual))  →  solve for residual
    // Mi_stage = mc + F_K
    const Mi_stage = mc + F_K;
    const Mf_required = Mi_stage / Math.exp(dv_required / Ve);
    const residual_predicted = Mf_required - mc;

    // ratio check for actual, formula-based
    const actual_dE = E_actual_final - E_now;
    const dv_actual = Ve * Math.log(Mi_stage / (mc + residual_actual));
    const pred_dE = C * (mc * vK * dv_actual + 0.5 * mc * dv_actual * dv_actual) + dPE;

    // Fill table
    const rows = [
      { k: 'Target altitude',           v: altKm.toFixed(1), u: 'km' },
      { k: '',                          v: '', u: '' },
      { k: '--- AT KARMAN ---',         v: '', u: '' },
      { k: 'altitude',                  v: (karman.altM/1000).toFixed(3), u: 'km' },
      { k: 'r, v',                      v: rK.toFixed(0) + ', ' + vK.toFixed(2), u: 'm, m/s' },
      { k: 'γ (flight path)',           v: (gK/D2R).toFixed(4), u: '°' },
      { k: 'M_c',                       v: mc.toFixed(1), u: 'kg' },
      { k: 'stage fuel @ Karman',       v: F_K.toFixed(1), u: 'kg' },
      { k: 'Mi_stage (= mc + fuel)',    v: Mi_stage.toFixed(1), u: 'kg' },
      { k: 'Ve (stage)',                v: Ve.toFixed(2), u: 'm/s' },
      { k: 'E_now (M_c)',               v: E_now.toExponential(4), u: 'J' },
      { k: 'E_target (M_c)',            v: Etgt.toExponential(4), u: 'J' },
      { k: 'ΔE needed',                 v: dE_needed.toExponential(4), u: 'J' },
      { k: 'ΔPE term (K→target)',       v: dPE.toExponential(4), u: 'J' },
      { k: 'C = cos(γ_K)',              v: C.toFixed(6), u: '' },
      { k: 'Δv required (corrected)',   v: (Number.isFinite(dv_required)?dv_required.toFixed(2):'n/a'), u: 'm/s' },
      { k: '',                          v: '', u: '' },
      { k: '--- PREDICTION (Karman) ---', v: '', u: '' },
      { k: 'predicted residual fuel',   v: (Number.isFinite(residual_predicted)?residual_predicted.toFixed(1):'n/a'), u: 'kg' },
      { k: '',                          v: '', u: '' },
      { k: '--- ACTUAL (end) ---',      v: '', u: '' },
      { k: 'altitude',                  v: (lastState.altM/1000).toFixed(3), u: 'km' },
      { k: 'r, v',                      v: lastR.toFixed(0) + ', ' + lastV.toFixed(2), u: 'm, m/s' },
      { k: 'residual fuel',             v: residual_actual.toFixed(1), u: 'kg' },
      { k: 'E_final actual',            v: E_actual_final.toExponential(4), u: 'J' },
      { k: '',                          v: '', u: '' },
      { k: '--- ERROR ---',             v: '', u: '' },
      { k: 'predicted − actual',        v: (Number.isFinite(residual_predicted)?(residual_predicted - residual_actual).toFixed(1):'n/a'), u: 'kg' },
      { k: 'relative',                  v: (Number.isFinite(residual_predicted)?((residual_predicted - residual_actual)/Math.max(1,residual_actual)*100).toFixed(2):'n/a'), u: '%' },
      { k: '',                          v: '', u: '' },
      { k: 'actual ΔE (K→end)',         v: actual_dE.toExponential(4), u: 'J' },
      { k: 'formula ΔE (same fuel)',    v: pred_dE.toExponential(4), u: 'J' },
      { k: 'ratio actual/formula',      v: (actual_dE/pred_dE).toFixed(4), u: '' },
    ];
    const tbody = document.querySelector('#resTable tbody');
    tbody.innerHTML = rows.map(r => {
      const cls = r.k.includes('ERROR') || r.k.includes('predicted') ? '' : '';
      return '<tr' + (r.k === 'predicted residual fuel' || r.k === 'residual fuel' ? ' class="highlight"' : '') +
             '><td>' + r.k + '</td><td>' + r.v + '</td><td style="color:var(--dim)">' + r.u + '</td></tr>';
    }).join('');

    // raw dump
    const raw = [
      'karman:   r=' + rK.toFixed(2) + ' v=' + vK.toFixed(3) + ' γ=' + (gK/D2R).toFixed(4) + '° fuel=' + F_K.toFixed(2) + ' E=' + E_now.toExponential(6),
      'target:   r=' + rTarget.toFixed(2) + ' v=' + vTarget.toFixed(3) + ' E=' + Etgt.toExponential(6),
      'end:      r=' + lastR.toFixed(2) + ' v=' + lastV.toFixed(3) + ' fuel=' + residual_actual.toFixed(2) + ' E=' + E_actual_final.toExponential(6),
      'M_c=' + mc.toFixed(4) + '  Ve=' + Ve.toFixed(4) + '  C=' + C.toFixed(6) + '  γ=' + (gK/D2R).toFixed(4) + '°',
      'dv_required=' + (Number.isFinite(dv_required)?dv_required.toFixed(4):'n/a') + '  Mi_stage=' + Mi_stage.toFixed(4) + '  Mf_required=' + (Number.isFinite(Mf_required)?Mf_required.toFixed(4):'n/a'),
      'predicted_residual=' + (Number.isFinite(residual_predicted)?residual_predicted.toFixed(4):'n/a') + '  actual=' + residual_actual.toFixed(4),
      'ratio_actual_formula=' + (actual_dE/pred_dE).toFixed(6),
    ].join('\n');
    $('raw').textContent = raw;
  }

  function clear() {
    document.querySelector('#resTable tbody').innerHTML = '';
    $('raw').textContent = '—';
    $('status').textContent = 'idle';
  }
  $('runBtn').addEventListener('click', run);
  $('clearBtn').addEventListener('click', clear);
  clear();
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
