<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Divergence — strict compare</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:12px/1.5 monospace; padding:16px; }
h1 { color:#35d6ff; font-size:14px; margin:0 0 10px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
#status { color:#ffd23f; margin:8px 0; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11px; overflow:auto; max-height:600px; }
</style>
</head>
<body>

<h1>Divergence — strict compare, all engine/cmd fields</h1>

<button id="runBtn">Run</button>
<div id="status">idle</div>
<pre id="log">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const DT = CONFIG.DT;
  const logEl = $('log');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };

  function deepClone(x, memo) {
    memo = memo || new WeakMap();
    if (x === null || typeof x !== 'object') return x;
    if (memo.has(x)) return memo.get(x);
    if (Array.isArray(x)) { const arr = []; memo.set(x, arr); for (let i = 0; i < x.length; i++) arr[i] = deepClone(x[i], memo); return arr; }
    const out = {}; memo.set(x, out);
    for (const k of Object.keys(x)) out[k] = deepClone(x[k], memo);
    return out;
  }

  function captureFull() {
    const st = {};
    Object.keys(state).forEach(k => { if (k === 'bodies') return; try { st[k] = deepClone(state[k]); } catch (e) { st[k] = null; } });
    return { bodies: deepClone(state.bodies), stateKeysSnapshot: st, simTime: state.simTime, activeBodyIndex: state.activeBodyIndex, guidanceState: Guidance.exportGuideState() };
  }

  function restoreFull(snap) {
    Object.keys(snap.stateKeysSnapshot).forEach(k => { try { state[k] = deepClone(snap.stateKeysSnapshot[k]); } catch (e) {} });
    state.simTime = snap.simTime;
    state.activeBodyIndex = snap.activeBodyIndex;
    const sb = snap.bodies;
    while (state.bodies.length > sb.length) state.bodies.pop();
    while (state.bodies.length < sb.length) state.bodies.push({});
    for (let i = 0; i < sb.length; i++) {
      const src = sb[i], dst = state.bodies[i];
      Object.keys(dst).forEach(k => { delete dst[k]; });
      Object.keys(src).forEach(k => { dst[k] = deepClone(src[k]); });
    }
    const ab = state.bodies[state.activeBodyIndex];
    if (ab) ['rx','ry','vx','vy','theta','omega','dryMass','fuelMass'].forEach(k => { try { state[k] = ab[k]; } catch (e) {} });
    Guidance.importGuideState(deepClone(snap.guidanceState));
  }

  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }

  function baselineValues() {
    const b = TunerConfig.baselineRaw;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320, STAGE_BURN_AOA_BIAS_DEG: b.bias, STAGE_BURN_AOA_MARGIN_DEG: 0.001, CIRC_TRIGGER_LEAD_S: b.lead },
      done: { DEORBIT_ENABLED: false },
    };
  }

  function snapTick() {
    const out = { bodies: [] };
    for (let i = 0; i < state.bodies.length; i++) {
      const b = state.bodies[i];
      const eng = (b.engines || []).map(e => ({
        gd: e.gimbalDeg, tgd: e.targetGimbalDeg, tgrd: e.targetGimbalRateDegS,
        mf: e.massFlowRate, tmf: e.targetMassFlowRate, cf: e.currentF,
        vs: e.Ve, mmf: e.maxMassFlowRate,
      }));
      out.bodies.push({
        rx: b.rx, ry: b.ry, vx: b.vx, vy: b.vy,
        theta: b.theta, omega: b.omega,
        fuelMass: b.fuelMass, dryMass: b.dryMass,
        memberFuel: b.memberFuel ? b.memberFuel.slice() : null,
        memberRoles: b.members ? b.members.map(m => m && m.stageRole) : null,
        engines: eng,
        rcsCmd: b.rcsCmd ? JSON.stringify(b.rcsCmd) : null,
        rcsDuty: b.rcsDuty ? JSON.stringify(b.rcsDuty) : null,
        sloshOffset: b.slosh ? b.slosh.offset : null,
        sloshVel: b.slosh ? b.slosh.velocity : null,
      });
    }
    out.t = state.simTime;
    out.activeIdx = state.activeBodyIndex;
    out.phase = Guidance.getGuideStatus().phase;
    out.nBodies = state.bodies.length;
    return out;
  }

  function cmpVal(a, b, path) {
    // Object.is treats NaN === NaN (unlike ===). Also handles +/-0.
    if (Object.is(a, b)) return null;
    if (typeof a === 'number' && typeof b === 'number') return path + ' d=' + (b - a).toExponential(6);
    return path + ' ref=' + JSON.stringify(a) + ' test=' + JSON.stringify(b);
  }

  function diffTicks(a, b) {
    if (a.nBodies !== b.nBodies) return 'nBodies ' + a.nBodies + ' vs ' + b.nBodies;
    if (a.activeIdx !== b.activeIdx) return 'activeIdx';
    for (let i = 0; i < a.bodies.length; i++) {
      const x = a.bodies[i], y = b.bodies[i];
      let r;
      for (const f of ['rx','ry','vx','vy','theta','omega','fuelMass','dryMass']) {
        if ((r = cmpVal(x[f], y[f], 'body' + i + '.' + f))) return r;
      }
      if (x.memberFuel && y.memberFuel) {
        for (let k = 0; k < x.memberFuel.length; k++) {
          if ((r = cmpVal(x.memberFuel[k], y.memberFuel[k], 'body' + i + '.mf[' + k + ']'))) return r;
        }
      }
      if (x.memberRoles && y.memberRoles) {
        for (let k = 0; k < x.memberRoles.length; k++) {
          if ((r = cmpVal(x.memberRoles[k], y.memberRoles[k], 'body' + i + '.role[' + k + ']'))) return r;
        }
      }
      if (x.engines && y.engines) {
        for (let k = 0; k < Math.min(x.engines.length, y.engines.length); k++) {
          const ex = x.engines[k], ey = y.engines[k];
          for (const f of ['gd','tgd','tgrd','mf','tmf','cf','vs','mmf']) {
            if ((r = cmpVal(ex[f], ey[f], 'body' + i + '.eng[' + k + '].' + f))) return r;
          }
        }
      }
      if ((r = cmpVal(x.rcsCmd, y.rcsCmd, 'body' + i + '.rcsCmd'))) return r;
      if ((r = cmpVal(x.rcsDuty, y.rcsDuty, 'body' + i + '.rcsDuty'))) return r;
      if ((r = cmpVal(x.sloshOffset, y.sloshOffset, 'body' + i + '.sloshOff'))) return r;
      if ((r = cmpVal(x.sloshVel, y.sloshVel, 'body' + i + '.sloshVel'))) return r;
    }
    return null;
  }

  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    logLines = [];
    log('start');

    try {
      TunerEngine.prepareRun('leoInsertionV3', baselineValues(), TunerConfig.env);
      let prevPhase = null, snap = null;
      const maxTicks = Math.ceil(500 / DT);
      for (let i = 0; i < maxTicks; i++) {
        if (state.halted) break;
        TunerEngine.tick(DT);
        const gs = Guidance.getGuideStatus();
        const ph = gs.phase;
        if (ph !== prevPhase && ph === 'SEPARATED_AXIAL' && !snap) {
          snap = captureFull();
          log('snapshot at SA entry t=' + state.simTime.toFixed(4));
          break;
        }
        prevPhase = ph;
      }
      if (!snap) { log('no snapshot'); return; }

      const N = 25000;
      $('status').textContent = 'ref trail (' + N + ' ticks)…';
      const refTrail = [];
      for (let i = 0; i < N; i++) {
        TunerEngine.tick(DT);
        refTrail.push(snapTick());
        if ((i & 255) === 255) await new Promise(r => setTimeout(r, 0));
      }

      $('status').textContent = 'test trail…';
      restoreFull(snap);
      const testTrail = [];
      for (let i = 0; i < N; i++) {
        TunerEngine.tick(DT);
        testTrail.push(snapTick());
        if ((i & 255) === 255) await new Promise(r => setTimeout(r, 0));
      }

      log('');
      log('=== STRICT COMPARE ' + N + ' ticks ===');
      let firstDiff = -1, reason = null;
      for (let i = 0; i < N; i++) {
        const d = diffTicks(refTrail[i], testTrail[i]);
        if (d) { firstDiff = i; reason = d; break; }
      }
      if (firstDiff < 0) { log('NO divergence in ' + N + ' ticks'); }
      else {
        log('first divergence at tick ' + (firstDiff + 1) + ' t=' + refTrail[firstDiff].t.toFixed(4) + ' ph=' + refTrail[firstDiff].phase);
        log('reason: ' + reason);
        // dump body0 engine details
        const a = refTrail[firstDiff], b = testTrail[firstDiff];
        for (let i = 0; i < a.bodies.length; i++) {
          const x = a.bodies[i], y = b.bodies[i];
          if (!x.engines || !x.engines.length) continue;
          log('--- body' + i + ' roles=' + JSON.stringify(x.memberRoles) + ' ---');
          for (let k = 0; k < x.engines.length; k++) {
            const ex = x.engines[k], ey = y.engines[k];
            const de = [];
            for (const f of ['gd','tgd','tgrd','mf','tmf','cf']) {
              if (ex[f] !== ey[f]) de.push(f + ' ref=' + ex[f] + ' test=' + ey[f]);
            }
            if (de.length) log('  eng[' + k + ']: ' + de.join(' | '));
          }
          if (x.rcsCmd !== y.rcsCmd) log('  rcsCmd ref=' + x.rcsCmd + ' test=' + y.rcsCmd);
          if (x.rcsDuty !== y.rcsDuty) log('  rcsDuty ref=' + x.rcsDuty + ' test=' + y.rcsDuty);
        }
      }

      // transitions
      log('');
      log('REF transitions:');
      let prevPh = null;
      for (let i = 0; i < N; i++) if (refTrail[i].phase !== prevPh) { log('  tick ' + (i+1) + ' t=' + refTrail[i].t.toFixed(4) + ' ph=' + refTrail[i].phase); prevPh = refTrail[i].phase; }
      log('TEST transitions:');
      prevPh = null;
      for (let i = 0; i < N; i++) if (testTrail[i].phase !== prevPh) { log('  tick ' + (i+1) + ' t=' + testTrail[i].t.toFixed(4) + ' ph=' + testTrail[i].phase); prevPh = testTrail[i].phase; }

      $('status').textContent = 'done';
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message + '\n' + e.stack);
    }
  }

  $('runBtn').addEventListener('click', run);
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
