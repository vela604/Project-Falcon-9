<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bias Score Scan</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
input[type=number] { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:6px 10px; border-radius:4px; font:inherit; width:90px; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:400px; }
canvas { background:#060912; border:1px solid #1c2b45; border-radius:4px; display:block; margin-top:10px; }
table { border-collapse:collapse; font-size:12px; margin:10px 0; width:100%; }
th, td { padding:6px 8px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.best td { background:rgba(74,222,128,0.10); color:#4ade80; }
tr.fail td { color:#ff5f7e; }
</style>
</head>
<body>

<h1>Bias Score Scan — fixed MECO, fixed G, sweep bias</h1>

<label>workers <input type="number" id="nW" value="6" min="1" max="8"></label>
<label style="margin-left:12px">G <input type="number" id="gIn" value="0.61" step="0.01"></label>
<label>MECO <input type="number" id="mecoIn" value="60494" step="1"></label>
<label>alt km <input type="number" id="altIn" value="320" step="1"></label>
<label>bias lo <input type="number" id="bLo" value="2" step="0.1"></label>
<label>hi <input type="number" id="bHi" value="3" step="0.1"></label>
<label>step <input type="number" id="bStep" value="0.25" step="0.05"></label>
<button id="runBtn">Run scan</button>
<div id="status">idle</div>
<div id="feed" style="background:#050b16;border:1px solid #1c2b45;padding:8px;border-radius:4px;font-size:11px;margin:8px 0;white-space:pre;color:#9ef;max-height:200px;overflow:auto;"></div>
<div id="live" style="background:#0a1020;border:1px solid #1c2b45;padding:10px;border-radius:4px;font-size:12px;margin:8px 0;white-space:pre;"></div>
<pre id="log">—</pre>
<canvas id="chart" width="900" height="480"></canvas>
<div id="tableHost"></div>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>
<script src="../lib/config.js"></script>
<script src="../lib/worker-pool.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), statusEl = $('status');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };
  const fmt = (x, d) => Number.isFinite(x) ? x.toFixed(d) : '—';
  const T = 4.82;

  const perWorker = {};   // tag -> { phase, detail, ts }

  function renderProgressFeed() {
    const el = document.getElementById('feed');
    if (!el) return;
    const keys = Object.keys(perWorker).sort();
    if (!keys.length) { el.textContent = '(waiting for progress…)'; return; }
    let lines = [];
    keys.forEach(k => {
      const w = perWorker[k];
      const ago = ((Date.now() - w.ts) / 1000).toFixed(1);
      lines.push('[' + k + '] ' + w.phase.padEnd(10) + '  ' + w.detail + '  (' + ago + 's ago)');
    });
    el.textContent = lines.join('\n');
  }

  const liveState = {
    total: 0, done: 0, running: 0, failed: 0,
    startMs: 0,
    inflight: {},   // bias -> { t0, phase }
    results: [],
    update() {
      const el = document.getElementById('live');
      if (!el) return;
      const elapsed = (performance.now() - this.startMs) / 1000;
      const pct = this.total ? (100 * this.done / this.total) : 0;
      const barW = 40;
      const filled = Math.round(barW * pct / 100);
      const bar = '█'.repeat(filled) + '░'.repeat(barW - filled);
      const rate = this.done > 0 ? (this.done / Math.max(0.1, elapsed)).toFixed(2) : '—';
      const eta = (this.done > 0 && this.done < this.total) ? ((this.total - this.done) / (this.done / Math.max(0.1, elapsed))).toFixed(0) : '—';
      const runB = Object.keys(this.inflight).slice(0, 6).join(', ') + (Object.keys(this.inflight).length > 6 ? ', …' : '');
      let lines = [];
      lines.push('[' + bar + '] ' + this.done + '/' + this.total + '  (' + pct.toFixed(1) + '%)   failed=' + this.failed);
      lines.push('elapsed=' + elapsed.toFixed(0) + 's   rate=' + rate + ' probe/s   ETA=' + eta + 's   inflight=' + Object.keys(this.inflight).length);
      lines.push('running: ' + (runB || '(none)'));
      el.textContent = lines.join('\n');
    }
  };

  async function run() {
    $('runBtn').disabled = true;
    logLines = []; logEl.textContent = '—'; $('tableHost').innerHTML = '';
    const ctx = $('chart').getContext('2d');
    ctx.fillStyle = '#060912'; ctx.fillRect(0, 0, 900, 480);

    try {
      const n = Math.max(1, Math.min(8, parseInt($('nW').value, 10) || 6));
      const G = parseFloat($('gIn').value);
      const meco = parseInt($('mecoIn').value, 10);
      const altKm = parseInt($('altIn').value, 10);
      const bLo = parseFloat($('bLo').value);
      const bHi = parseFloat($('bHi').value);
      const bStep = parseFloat($('bStep').value) || 0.25;
      const Q = TunerConfig.quanta;

      const biases = [];
      for (let b = bLo; b <= bHi + 1e-9; b += bStep) biases.push(Math.round(b * 1e4) / 1e4);

      liveState.total = biases.length;
      liveState.done = 0;
      liveState.failed = 0;
      liveState.running = 0;
      liveState.startMs = performance.now();
      liveState.inflight = {};
      liveState.results = [];
      liveState.update();

      log('creating pool ' + n + ' workers…');
      const pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' });
      pool.onProgress = (msg) => {
        perWorker[msg.tag] = { phase: msg.phase, detail: msg.detail, ts: msg.ts };
        renderProgressFeed();
      };
      pool.onProgress = (msg) => {
        perWorker[msg.tag] = { phase: msg.phase, detail: msg.detail, ts: msg.ts };
        renderProgressFeed();
      };
      await pool.waitReady();
      log('pool ready');
      log('');
      log('G=' + G + '  MECO=' + meco + '  alt=' + altKm + '  bias range [' + bLo + ',' + bHi + '] step ' + bStep + '  → ' + biases.length + ' probes');
      log('');

      const t0 = performance.now();
      let done = 0;
      const liveTimer = setInterval(() => { liveState.update(); renderProgressFeed(); }, 300);

      // dispatch all bias probes to pool
      // 1) setupSA on all workers (dispatch as many parallel jobs)
      const baseValues = {
        ascent: { PUSH_MAX_GIMBAL_DEG: G, PUSH_T_S: T, MECO_TARGET_BOOSTER_FUEL_KG: meco },
        insertion: { TARGET_ORBIT_ALT_KM: altKm, STAGE_BURN_AOA_BIAS_DEG: 1.8, STAGE_BURN_AOA_MARGIN_DEG: 0.001, CIRC_TRIGGER_LEAD_S: 5.64 },
        done: { DEORBIT_ENABLED: false },
      };
      log('dispatching setupSA to ' + n + ' workers…');
      statusEl.textContent = 'setup SA snapshots…';
      const setupJobs = [];
      for (let i = 0; i < n; i++) setupJobs.push(pool.runJob('setupSA', { values: baseValues }));
      const setupResults = await Promise.all(setupJobs);
      const setupOk = setupResults.filter(r => r.ok).length;
      log('setupSA: ' + setupOk + '/' + n + ' workers ready');
      if (!setupOk) { log('all setupSA failed'); statusEl.textContent = 'setup failed'; return; }

      // 2) bias probes via probeBiasCheckpoint
      const tasks = biases.map(bias => {
        const key = bias.toFixed(4);
        liveState.inflight[key] = { t0: performance.now() };
        liveState.update();
        return pool.runJob('probeBiasCheckpoint', { bias, altKm })
          .then(r => {
            delete liveState.inflight[key];
            liveState.done++;
            if (!r.ok) liveState.failed++;
            liveState.results.push({ bias, ...r });
            liveState.update();
            return { bias, ...r };
          })
          .catch(e => {
            delete liveState.inflight[key];
            liveState.done++;
            liveState.failed++;
            liveState.update();
            return { bias, ok: false, reason: 'error: ' + e.message };
          });
      });

      const results = await Promise.all(tasks);
      const wall = (performance.now() - t0) / 1000;
      log('all probes done in ' + fmt(wall, 1) + 's');
      log('');

      results.sort((a, b) => a.bias - b.bias);

      // Table
      let best = null;
      let html = '<table><thead><tr><th>bias</th><th>lead</th><th>margin</th><th>ok</th><th>score</th><th>deploy</th><th>apo</th><th>peri</th><th>ecc</th><th>fuel</th><th>resid</th><th>reason</th></tr></thead><tbody>';
      results.forEach(r => {
        if (r.ok && r.score != null) {
          if (!best || r.score < best.score) best = r;
        }
      });
      results.forEach(r => {
        const m = r.metrics || {};
        const cls = (best && r === best) ? 'best' : (!r.ok ? 'fail' : '');
        html += '<tr class="' + cls + '">' +
          '<td>' + r.bias.toFixed(4) + '</td>' +
          '<td>' + fmt(r.lead, 4) + '</td>' +
          '<td>' + fmt(r.margin, 3) + '</td>' +
          '<td>' + (r.ok ? '✓' : '✗') + '</td>' +
          '<td>' + fmt(r.score, 3) + '</td>' +
          '<td>' + fmt(m.deployTimeS, 2) + '</td>' +
          '<td>' + fmt(m.apogeeKm, 3) + '</td>' +
          '<td>' + fmt(m.perigeeKm, 3) + '</td>' +
          '<td>' + (Number.isFinite(m.ecc) ? m.ecc.toExponential(2) : '—') + '</td>' +
          '<td>' + fmt(m.boosterFuelLeftKg, 0) + '</td>' +
          '<td>' + fmt(m.stageResidualKg, 1) + '</td>' +
          '<td>' + (r.reason || (r.reasons && r.reasons.join(',')) || '') + '</td>' +
          '</tr>';
        log('  b=' + r.bias.toFixed(4).padEnd(8) + ' ' + (r.ok ? '✓' : '✗') + ' score=' + fmt(r.score, 3).padEnd(10) + ' deploy=' + fmt(m.deployTimeS, 2).padEnd(8) + ' apo=' + fmt(m.apogeeKm, 3).padEnd(8) + ' ecc=' + (Number.isFinite(m.ecc) ? m.ecc.toExponential(2) : '—').padEnd(10) + ' lead=' + fmt(r.lead, 4) + (r.reason ? '  [' + r.reason + ']' : ''));
      });
      html += '</tbody></table>';
      $('tableHost').innerHTML = html;

      if (best) {
        log('');
        log('best: bias=' + best.bias.toFixed(4) + '  score=' + fmt(best.score, 3) + '  deploy=' + fmt(best.metrics.deployTimeS, 2) + '  apo=' + fmt(best.metrics.apogeeKm, 3) + '  lead=' + fmt(best.lead, 4));
      } else {
        log('');
        log('no successful probe in this range');
      }

      // Chart: bias (X) vs score (Y). Score is lower=better, so plot -score to make
      // "peak = better" visual.
      drawChart(ctx, results);

      clearInterval(liveTimer);
      liveState.update();
      statusEl.textContent = 'done in ' + fmt(wall, 1) + 's';
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message + '\n' + (e.stack || ''));
    } finally {
      $('runBtn').disabled = false;
    }
  }

  function drawChart(ctx, results) {
    const W = 900, H = 480;
    const padL = 90, padR = 40, padT = 30, padB = 60;
    const pw = W - padL - padR, ph = H - padT - padB;

    const bs = results.map(r => r.bias);
    const bMin = Math.min(...bs), bMax = Math.max(...bs);
    const validScores = results.filter(r => r.ok && Number.isFinite(r.score)).map(r => r.score);
    if (!validScores.length) {
      ctx.fillStyle = '#ff5f7e'; ctx.font = '14px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('no successful probes', W/2, H/2);
      return;
    }
    const sMin = Math.min(...validScores), sMax = Math.max(...validScores);
    const sPad = Math.max(1, (sMax - sMin) * 0.1);
    const sLo = sMin - sPad, sHi = sMax + sPad;

    const X = (b) => padL + (b - bMin) / Math.max(1e-6, bMax - bMin) * pw;
    const Y = (s) => padT + ph - (s - sLo) / Math.max(1e-6, sHi - sLo) * ph;   // higher score = higher on chart

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + i * ph / 5;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
      const x = padL + i * pw / 5;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph); ctx.stroke();

    // labels
    ctx.fillStyle = 'rgba(150,170,200,0.9)'; ctx.font = '11px monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const s = sLo + i * (sHi - sLo) / 5;
      ctx.fillText(s.toFixed(2), padL - 8, padT + ph - i * ph / 5);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let i = 0; i <= 5; i++) {
      const b = bMin + i * (bMax - bMin) / 5;
      ctx.fillText(b.toFixed(2), padL + i * pw / 5, padT + ph + 8);
    }
    ctx.fillStyle = '#35d6ff'; ctx.font = 'bold 12px monospace';
    ctx.fillText('bias (deg)', padL + pw / 2, H - 24);
    ctx.save();
    ctx.translate(24, padT + ph / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('score (higher = better)', 0, 0);
    ctx.restore();

    // line + points
    const valid = results.filter(r => r.ok && Number.isFinite(r.score));
    ctx.strokeStyle = '#35d6ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    valid.forEach((r, i) => {
      const x = X(r.bias), y = Y(r.score);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    valid.forEach(r => {
      const x = X(r.bias), y = Y(r.score);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    });
    // failed points at bottom
    results.filter(r => !r.ok).forEach(r => {
      const x = X(r.bias);
      ctx.fillStyle = '#ff5f7e';
      ctx.beginPath(); ctx.arc(x, padT + ph - 8, 4, 0, Math.PI * 2); ctx.fill();
    });
  }

  $('runBtn').addEventListener('click', run);
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
