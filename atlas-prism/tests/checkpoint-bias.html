<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkpoint SA — bias scan</title>
<style>
body { margin:0; background:#060912; color:#dbe6f5; font:13px/1.5 monospace; padding:20px; }
h1 { color:#35d6ff; font-size:15px; margin:0 0 12px; letter-spacing:1px; }
button { background:#101a30; color:#dbe6f5; border:1px solid #1c2b45;
         padding:8px 16px; border-radius:4px; font:inherit; cursor:pointer; margin-right:8px; }
button:hover { border-color:#35d6ff; color:#35d6ff; }
button:disabled { opacity:.4; }
#status { color:#ffd23f; margin:8px 0; min-height:1.2em; }
pre { background:#0a1020; border:1px solid #1c2b45; padding:8px; border-radius:4px;
      font-size:11.5px; overflow:auto; max-height:400px; }
table { border-collapse:collapse; font-size:12px; width:100%; margin-top:8px; }
th, td { padding:5px 10px; text-align:right; border-bottom:1px solid #1c2b45; }
th { color:#35d6ff; }
td:first-child, th:first-child { text-align:left; color:#6b7d9c; }
tr.heading td { background:rgba(53,214,255,0.06); color:#35d6ff; font-weight:600; }
tr.match td { background:rgba(74,222,128,0.06); }
</style>
</head>
<body>

<h1>Checkpoint at SEPARATED_AXIAL entry — bias scan</h1>

<button id="runBtn">Run</button>
<div id="status">idle</div>

<table id="t"><tbody></tbody></table>
<pre id="log">—</pre>

<script src="../../js/componentLibrary.js"></script>
<script src="../../js/customDesign.js"></script>
<script src="../../js/fleet.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/simJs/core/massProps.js"></script>
<script src="../../js/simJs/core/environment.js"></script>
<script src="../../js/simJs/core/vehicle.js"></script>
<script src="../../js/simJs/core/rcs.js"></script>
<script src="../../js/simJs/core/physics.js"></script>
<script src="../../js/simJs/core/collision.js"></script>
<script src="../../js/simJs/guidance/imu.js"></script>
<script src="../../js/simJs/guidance/derivation.js"></script>
<script src="../../js/simJs/guidance/guidercs.js"></script>
<script src="../../js/simJs/guidance/guidance-blocks.js"></script>
<script src="../../js/simJs/guidance/guidance.js"></script>
<script src="../../js/guideConfigDefaults.js"></script>

<script src="../lib/config.js"></script>
<script src="../lib/sim.js"></script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const GM = CONFIG.GM_EARTH, Re = CONFIG.EARTH_RADIUS, DT = CONFIG.DT;
  const logEl = $('log');
  let logLines = [];
  const log = (s) => { logLines.push(s); logEl.textContent = logLines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };

  function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

  function findStage() {
    for (const b of state.bodies) {
      if (b && !b.payloadBody && !b.fairingHalf && b.members && b.members[0] &&
          b.members[0].stageRole === 'stage') return b;
    }
    return null;
  }

  function orbitState(b) {
    if (!b) return null;
    const r = Math.hypot(b.rx, b.ry);
    const v = Math.hypot(b.vx, b.vy);
    const vr = (b.vx * b.rx + b.vy * b.ry) / r;
    const vt = (b.vx * b.ry - b.vy * b.rx) / r;
    const E = 0.5 * (vr * vr + vt * vt) - GM / r;
    const h = r * vt;
    const e = Math.sqrt(Math.max(0, 1 + 2 * E * h * h / (GM * GM)));
    let apoKm = Infinity, periKm = Infinity;
    if (E < 0) {
      const a = -GM / (2 * E);
      apoKm = (a * (1 + e) - Re) / 1000;
      periKm = (a * (1 - e) - Re) / 1000;
    }
    return { r, v, vr, vt, e, apoKm, periKm, altKm: (r - Re) / 1000 };
  }

  function boot() {
    if (typeof TunerEngine === 'undefined' || typeof Guidance === 'undefined') return false;
    TunerEngine.init(); return true;
  }

  function baselineValues() {
    const b = TunerConfig.baselineRaw;
    return {
      ascent: { PUSH_MAX_GIMBAL_DEG: b.G, PUSH_T_S: b.T, MECO_TARGET_BOOSTER_FUEL_KG: b.meco },
      insertion: { TARGET_ORBIT_ALT_KM: 320,
                   STAGE_BURN_AOA_BIAS_DEG: b.bias,
                   STAGE_BURN_AOA_MARGIN_DEG: 0.001,
                   CIRC_TRIGGER_LEAD_S: b.lead },
      done: { DEORBIT_ENABLED: false },
    };
  }

  function captureSnapshot() {
    // Debug: capture ALL enumerable state keys, not just the known ones
    const stateKeys = Object.keys(state);
    const stateSnapshot = {};
    stateKeys.forEach(k => {
      if (k === 'bodies') return;
      try { stateSnapshot[k] = JSON.parse(JSON.stringify(state[k])); } catch (e) { stateSnapshot[k] = null; }
    });
    return {
      bodies: deepClone(state.bodies),
      simTime: state.simTime,
      activeBodyIndex: state.activeBodyIndex,
      halted: state.halted,
      landed: state.landed,
      crashed: state.crashed,
      stateKeysSnapshot: stateSnapshot,
      guidanceState: Guidance.exportGuideState(),
    };
  }

  function restoreSnapshot(snap, newBias) {
    // Restore every captured state key, then overwrite bodies separately.
    if (snap.stateKeysSnapshot) {
      Object.keys(snap.stateKeysSnapshot).forEach(k => {
        try { state[k] = JSON.parse(JSON.stringify(snap.stateKeysSnapshot[k])); } catch (e) {}
      });
    }
    state.simTime = snap.simTime;
    state.activeBodyIndex = snap.activeBodyIndex;
    state.halted = snap.halted;
    state.landed = snap.landed;
    state.crashed = snap.crashed;

    const sb = snap.bodies;
    while (state.bodies.length > sb.length) state.bodies.pop();
    while (state.bodies.length < sb.length) state.bodies.push({});

    for (let i = 0; i < sb.length; i++) {
      const src = sb[i], dst = state.bodies[i];
      Object.keys(dst).forEach(k => { delete dst[k]; });
      Object.keys(src).forEach(k => { dst[k] = deepClone(src[k]); });
    }

    const g = deepClone(snap.guidanceState);
    if (newBias !== undefined && newBias !== null) {
      if (g.guideConfigs && g.guideConfigs.leoInsertionV3 && g.guideConfigs.leoInsertionV3.insertion) {
        g.guideConfigs.leoInsertionV3.insertion.STAGE_BURN_AOA_BIAS_DEG = newBias;
      }
      if (g.v3InsertionBlock && g.v3InsertionBlock.constants) {
        g.v3InsertionBlock.constants.STAGE_BURN_AOA_BIAS_DEG = newBias;
      }
    }
    Guidance.importGuideState(g);
  }

  async function forwardToPhase(targetPhase, startIdx, captureAt) {
    let prevPhase = null, snap = null, refState = null;
    const maxTicks = Math.ceil(3000 / DT);
    let i = startIdx || 0;
    for (; i < maxTicks; i++) {
      if (state.halted) break;
      TunerEngine.tick(DT);
      const gs = Guidance.getGuideStatus();
      const ph = gs.phase;
      if (ph !== prevPhase && ph === targetPhase && !snap && captureAt === 'enter') {
        snap = captureSnapshot();
        log('snapshot ' + targetPhase + ' entry: t=' + state.simTime.toFixed(3));
        log('  state keys: ' + Object.keys(state).join(','));
        const gks = Object.keys(snap.guidanceState);
        log('  guidanceState keys: ' + gks.join(','));
        const v3ks = snap.guidanceState.v3State ? Object.keys(snap.guidanceState.v3State) : [];
        log('  v3State keys: ' + v3ks.join(','));
      }
      if (ph === 'COAST_WAIT' && !refState) {
        refState = {
          t: state.simTime,
          stage: orbitState(findStage()),
          stageFuel: findStage() ? findStage().fuelMass : NaN,
        };
        log('reference COAST_WAIT entry: t=' + state.simTime.toFixed(3));
        break;
      }
      prevPhase = ph;
      if ((i & 255) === 255) {
        $('status').textContent = 'forward t=' + state.simTime.toFixed(1) + ' ph=' + ph;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    return { snap, refState, nextIdx: i };
  }

  async function trialWithBias(snap, bias) {
    restoreSnapshot(snap, bias);
    let cwState = null;
    let vrMinStageBurn = Infinity;
    let prevPhase = Guidance.getGuideStatus().phase;
    const maxTicks = Math.ceil(500 / DT);
    for (let i = 0; i < maxTicks; i++) {
      if (state.halted) break;
      TunerEngine.tick(DT);
      const gs = Guidance.getGuideStatus();
      const ph = gs.phase;
      if (prevPhase === 'STAGE_BURN') {
        const b = state.bodies[state.activeBodyIndex];
        const r = Math.hypot(b.rx, b.ry);
        const vr = (b.vx * b.rx + b.vy * b.ry) / r;
        if (vr < vrMinStageBurn) vrMinStageBurn = vr;
      }
      if (ph === 'COAST_WAIT') {
        cwState = {
          t: state.simTime,
          stage: orbitState(findStage()),
          stageFuel: findStage() ? findStage().fuelMass : NaN,
        };
        break;
      }
      prevPhase = ph;
      if ((i & 255) === 255) await new Promise(r => setTimeout(r, 0));
    }
    return { bias, cwState, vrMinStageBurn };
  }

  async function run() {
    if (!boot()) { $('status').textContent = 'boot failed'; return; }
    $('runBtn').disabled = true;
    logLines = [];
    log('start');

    try {
      TunerEngine.prepareRun('leoInsertionV3', baselineValues(), TunerConfig.env);

      $('status').textContent = 'forward to SEPARATED_AXIAL…';
      const fwd = await forwardToPhase('SEPARATED_AXIAL', 0, 'enter');
      if (!fwd.snap || !fwd.refState) {
        log('missing snap or ref'); $('runBtn').disabled = false; return;
      }

      // read reference bias from snapshot
      const cfg = fwd.snap.guidanceState.guideConfigs.leoInsertionV3;
      const refBias = cfg.insertion.STAGE_BURN_AOA_BIAS_DEG;
      log('reference bias from config = ' + refBias);

      // trials
      const biases = [refBias, refBias + 0.1, refBias + 0.2, refBias - 0.1];
      const trials = [];
      for (const b of biases) {
        $('status').textContent = 'trial bias=' + b.toFixed(4);
        const r = await trialWithBias(fwd.snap, b);
        trials.push(r);
        log('trial bias=' + b.toFixed(4) +
            ' cwT=' + (r.cwState ? r.cwState.t.toFixed(3) : 'none') +
            ' apo=' + (r.cwState ? r.cwState.stage.apoKm.toFixed(2) : '—') +
            ' ecc=' + (r.cwState ? r.cwState.stage.e.toFixed(6) : '—') +
            ' stageVrMin=' + (Number.isFinite(r.vrMinStageBurn) ? r.vrMinStageBurn.toFixed(2) : '—'));
      }

      // build table
      const rows = [
        { h: 'Reference (from full forward run)' },
        { k: 'CW entry t', v: fwd.refState.t.toFixed(3) + ' s' },
        { k: 'CW apo', v: fwd.refState.stage.apoKm.toFixed(3) + ' km' },
        { k: 'CW peri', v: fwd.refState.stage.periKm.toFixed(3) + ' km' },
        { k: 'CW ecc', v: fwd.refState.stage.e.toExponential(4) },
        { k: 'CW stage fuel', v: fwd.refState.stageFuel.toFixed(2) + ' kg' },
      ];
      const refT = fwd.refState.t;
      const refApo = fwd.refState.stage.apoKm;
      const refEcc = fwd.refState.stage.e;

      for (const tr of trials) {
        rows.push({ h: 'bias = ' + tr.bias.toFixed(4) });
        if (!tr.cwState) {
          rows.push({ k: 'result', v: 'no CW entry reached' });
          continue;
        }
        const dtCW = tr.cwState.t - refT;
        const dApo = tr.cwState.stage.apoKm - refApo;
        const dEcc = tr.cwState.stage.e - refEcc;
        rows.push({ k: 'CW entry t', v: tr.cwState.t.toFixed(3) + ' s  Δ=' + dtCW.toFixed(3) + ' s' });
        rows.push({ k: 'CW apo', v: tr.cwState.stage.apoKm.toFixed(3) + ' km  Δ=' + dApo.toFixed(4) });
        rows.push({ k: 'CW ecc', v: tr.cwState.stage.e.toExponential(4) + '  Δ=' + dEcc.toExponential(3) });
        rows.push({ k: 'stageVrMin', v: tr.vrMinStageBurn.toFixed(3) });
      }

      const tb = $('t').querySelector('tbody');
      tb.innerHTML = rows.map(r => r.h
        ? '<tr class="heading"><td colspan="2">' + r.h + '</td></tr>'
        : '<tr><td>' + r.k + '</td><td>' + r.v + '</td></tr>'
      ).join('');

      $('status').textContent = 'done';
      $('runBtn').disabled = false;
    } catch (e) {
      console.error(e);
      log('ERROR: ' + e.message);
      $('status').textContent = 'ERROR';
      $('runBtn').disabled = false;
    }
  }

  $('runBtn').addEventListener('click', run);
  $('status').textContent = 'ready';
})();
</script>
</body>
</html>
