<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atlas-prism · universal bootstrap</title>
<style>
  body { background:#0e1116; color:#d6dde6; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; margin:0; padding:10px; }
  h1 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  label { display:flex; gap:4px; align-items:center; }
  input { background:#1b212b; color:#d6dde6; border:1px solid #333c4a; border-radius:4px; padding:4px; width:62px; }
  button { background:#2b6cb0; color:#fff; border:0; border-radius:4px; padding:8px 12px; font:inherit; }
  button.alt { background:#4a5568; } button:disabled { opacity:.5; }
  pre { background:#080a0e; border:1px solid #232a35; border-radius:4px; padding:8px; overflow-x:auto; white-space:pre; min-height:120px; max-height:62vh; overflow-y:auto; }
  .ok { color:#68d391; } .bad { color:#fc8181; } .dim { color:#8896a8; } .hi { color:#f6e05e; }
  #status { color:#f6e05e; min-height:1.3em; }
</style>
</head>
<body>
<h1>Universal bootstrap · alt → MECO + G list + bias ranges</h1>
<div class="row">
  <label>alt km <input id="alt" value="320"></label>
  <label>K (G count) <input id="K" value="3" style="width:38px"></label>
  <label>|bias|° <input id="bmax" value="3" style="width:38px"></label>
  <label>workers <input id="nw" value="0" style="width:38px"></label>
</div>
<div class="row">
  <label>MECO lo <input id="mlo" value="0"></label>
  <label>hi <input id="mhi" value="90000"></label>
  <label>coarse n <input id="mn" value="7" style="width:38px"></label>
  <label>MECO quantum <input id="mq" value="50" style="width:48px"></label>
</div>
<div class="row">
  <label>G lo <input id="glo" value="0.30" style="width:48px"></label>
  <label>hi <input id="ghi" value="0.75" style="width:48px"></label>
  <label>coarse G step <input id="gstep" value="0.02" style="width:48px"></label>
  <label>T s <input id="T" value="4.82" style="width:48px"></label>
</div>
<div class="row">
  <label>pred target kg <input id="pt" value="150" style="width:48px"></label>
  <label>pred min kg <input id="pmin" value="110" style="width:48px"></label>
  <label>pred max kg <input id="pmax" value="200" style="width:48px"></label>
  <label>ideal 0=fast..1=ideal <input id="ideal" value="0.5" style="width:40px"></label>
  <label>bias rows <input id="nbr" value="5" style="width:34px"></label>
  <label>D pts <input id="dpts" value="5" style="width:34px"></label>
  <label>apo tol -/+ km <input id="tol" value="2" style="width:38px"><input id="tolhi" value="20" style="width:38px"></label>
  <label>t frac <input id="tfrac" value="0.9" style="width:40px"></label>
  <label>k corr <input id="kc" value="0" style="width:40px"></label>
  <label>dv min <input id="dvmin" value="150" style="width:40px"></label>
  <label>tBurn min <input id="tbmin" value="3" style="width:34px"></label>
  <label>tToApo max (0=off) <input id="tapomax" value="0" style="width:44px"></label>
  <label>trim % <input id="trim" value="10" style="width:38px"></label>
</div>
<div class="row">
  <button id="go">Run bootstrap</button>
  <input id="dbgCase" value="800 0.62 36000 2.27" placeholder="alt G MECO bias" style="width:180px">
  <button class="alt" id="dbgGo">Debug single</button>
  <button id="stop" class="alt">Stop</button>
  <button id="copy" class="alt">Copy log</button>
</div>
<div id="status">idle</div>
<pre id="log"></pre>

<script src="../lib/worker-pool.js"></script>
<script src="../lib/bootstrap.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'); let logText = '';
  function log(s, cls) { logText += s + '\n'; const d = document.createElement('span'); if (cls) d.className = cls; d.textContent = s + '\n'; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; }

  function params() {
    const num = (id) => parseFloat($(id).value);
    return {
      alt: num('alt'), K: parseInt($('K').value, 10) || 3, bmax: num('bmax'),
      mLo: Math.round(num('mlo')), mHi: Math.round(num('mhi')), mN: Math.max(3, parseInt($('mn').value, 10) || 7), mq: Math.max(1, Math.round(num('mq'))),
      gLoI: Math.round(num('glo') * 100), gHiI: Math.round(num('ghi') * 100), gStep: Math.max(1, Math.round(num('gstep') * 100)),
      Tn: Math.round(num('T') / 0.000125), li: Math.round(5.64 / 0.0125),
      predTarget: num('pt'), predMin: num('pmin'), predMax: num('pmax'),
      ideal: Math.min(1, Math.max(0, parseFloat($('ideal').value) || 0)),
      eps: 0.002, tScale: 0.3,
      dpts: Math.max(3, parseInt($('dpts').value, 10) || 5),
      nbr: Math.max(3, parseInt($('nbr').value, 10) || 5),
      tol: num('tol'), tolHi: num('tolhi'), tfrac: num('tfrac'), kc: num('kc'),
      dvMin: num('dvmin'), tbMin: num('tbmin'), tApoMax: num('tapomax') || 0,
      trim: num('trim') / 100,
      bres: 0.01,
    };
  }

  let pool = null;
  const abortRef = { aborted: false };
  async function getPool() {
    if (pool) return pool;
    let n = parseInt($('nw').value, 10); if (!(n > 0)) n = TunerCore.defaultWorkers();
    pool = new TunerCore.WorkerPool(n, { workerPath: '../lib/worker-sim.js' });
    log('pool: ' + n + ' workers, booting...', 'dim');
    await pool.waitReady();
    const errs = pool.readyErrors.filter(Boolean);
    if (errs.length) log('worker boot errors: ' + errs.join(' | '), 'bad');
    return pool;
  }

  $('go').onclick = async () => {
    $('go').disabled = true; abortRef.aborted = false;
    try {
      await getPool();
      pool.snaps.clear(); pool.saStats = { build: 0, hit: 0, failHit: 0 };
      const P = params();
      await TunerCore.runBootstrap({
        pool, params: P, onLog: log, abortRef,
        onStatus: (s) => { $('status').textContent = s; },
      });
      $('status').textContent = 'done';
    } catch (e) { log('ERROR: ' + ((e && e.message) || e), 'bad'); }
    $('go').disabled = false;
  };

  $('dbgGo').onclick = async () => {
    $('dbgGo').disabled = true; abortRef.aborted = false;
    try {
      const parts = $('dbgCase').value.trim().split(/\s+/).map(Number);
      const alt = parts[0], G = parts[1], M = parts[2], b = parts[3];
      if (![alt, G, M, b].every(Number.isFinite)) throw new Error('bad input: alt G MECO bias');
      await getPool();
      const P = params();
      const Gi = Math.round(G * 100), bi = Math.round(b / 0.0001);
      await TunerCore.verifyPointSingle({ pool, params: P, alt, Gi, M, bi, onLog: log, abortRef });
    } catch (e) { log('DEBUG ERROR: ' + ((e && e.message) || e), 'bad'); }
    $('dbgGo').disabled = false;
  };

  $('stop').onclick = () => { abortRef.aborted = true; $('status').textContent = 'stopping...'; };
  $('copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(logText); };
})();
</script>
</body>
</html>
