<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guidance test</title>
<style>
  body { background: #0a0d14; color: #dbe6f5; font-family: monospace; padding: 20px; font-size: 13px; }
  h2 { color: #35d6ff; margin-top: 20px; }
  pre { background: #101a30; padding: 10px; border-radius: 6px; line-height: 1.5; }
</style>
</head>
<body>
<h2>Guidance console tests — output niche hai</h2>
<pre id="out"></pre>

<script src="js/simJs/guidance/imu.js"></script>
<script src="js/simJs/guidance/guidance.js"></script>
<script src="js/simJs/guidance/derivation.js"></script>
<script src="js/simJs/guidance/guidercs.js"></script>

<script>
const log = (s) => { console.log(s); document.getElementById('out').textContent += s + '\n'; };
const section = (t) => log('\n=== ' + t + ' ===');

// ============================================================
// 1. Boot data
// ============================================================
section('Boot');
log('imu.js loaded: ' + (typeof measure === 'function'));
log('guidance.js loaded: ' + (typeof Guidance === 'object'));
log('SENSOR_SPECS keys: ' + Object.keys(SENSOR_SPECS).join(', '));

// ============================================================
// 2. Fake stack — matches the shape workerBridge.js will send
// ============================================================
const fakeStack = {
  members: [
    { id: 'falcon9-default', stageRole: 'booster', height: 41.2, width: 3.7,
      engineTypeId: 'octaweb-merlin9', rcsTypeId: 'rcs-4pod-2nozzle', recoveryTypeId: 'legs-swingout-4',
      hasRecovery: true, bodyMetalTypeId: 'al-li-alloy', legsMetalTypeId: 'carbon-composite',
      bodyShellFactor: 0.01797,
      engineThrusters: {
        gimbal: { thrusterTypeId: 'merlin-1d-class', massFlowRate: 306 },
        fixed:  { thrusterTypeId: 'merlin-1d-class', massFlowRate: 306 },
      },
      fuel: { typeId: 'rp1-lox', tankHeight: 34.1, tankWidth: 3.7 },
      params: { octaRadius: 1.7 },
    },
    { id: 'falcon9-stage', stageRole: 'stage', height: 13.8, width: 3.7,
      engineTypeId: 'single-nozzle-vac', hasRecovery: false, bodyMetalTypeId: 'al-li-alloy',
      bodyShellFactor: 0.0147,
      engineThrusters: { gimbal: { thrusterTypeId: 'merlin-1d-vac-class', massFlowRate: 288 } },
      fuel: { typeId: 'rp1-lox', tankHeight: 8.0, tankWidth: 3.7 },
    },
    { id: 'falcon9-fairing', stageRole: 'payloadSpace', height: 13.1, width: 5.2,
      payloadSpaceTypeId: 'cap-bulged', payloadSpaceMetalTypeId: 'carbon-composite',
      bodyShellFactor: 0.0026,
      params: { capHeight: 13.1, capWidth: 3.7, bulgeWidth: 5.2 },
    },
  ],
  types: {
    'octaweb-merlin9': { frame: { slots: [
      { gimbalCapable: true, angleDeg: null },
      ...Array.from({length: 8}, (_, i) => ({ gimbalCapable: false, angleDeg: i * 45 })),
    ] } },
    'single-nozzle-vac': { frame: { slots: [{ gimbalCapable: true, angleDeg: null }] } },
    'merlin-1d-class':     { parameterSchema: [{ key: 've', value: 2766 }, { key: 'twr', value: 184 }] },
    'merlin-1d-vac-class': { parameterSchema: [{ key: 've', value: 3412 }, { key: 'twr', value: 200 }] },
    'rp1-lox':             { parameterSchema: [{ key: 'propellantDensity', value: 1080 }] },
    'al-li-alloy':         { parameterSchema: [{ key: 'density', value: 2700 }] },
    'carbon-composite':    { parameterSchema: [{ key: 'density', value: 1600 }] },
    'legs-swingout-4':     { kind: 'legsOnVehicle', capabilities: { deploysOnVehicle: true } },
    'cap-bulged':          {},
  },
  stackPayloadMass: 12000,
  env: {
    EARTH_RADIUS: 6371000, GM_EARTH: 3.986e14, EARTH_OMEGA: 7.2921e-5,
    G0: 9.80665, SEA_LEVEL_DENSITY: 1.225, SCALE_HEIGHT: 8500,
    DRAG_CD: 0.6, LAUNCH_SITE_ALTITUDE: 0, LAUNCH_SITE_ANGLE_0: 0,
  },
};

Guidance.setStackData(fakeStack);
log('Stack loaded: ' + fakeStack.members.length + ' members, ' + Object.keys(fakeStack.types).length + ' types');

// ============================================================
// 3. Fake snapshot — full F9 stack, tilted a bit for nonzero torque
// ============================================================
const fakeSnap = {
  simTime: 0,
  activeBodyIndex: 0,
  halted: false,
  wind: { enabled: false, speed: 0, directionDeg: 0 },
  bodies: [{
    rx: 6371000, ry: 0,
    vx: 0, vy: 100,
    theta: 0.1, omega: 0,
    ax: 0, ay: 0,
    height: 68.1, width: 5.2,   // stack aggregate — for reference
    dryMass: 43425,
    fuelMass: 488851,
    members: fakeStack.members,
    legs: { deployed: false, progress: 0 },
    slosh: { offset: 0, velocity: 0 },
    engines: [
      // Center engine gimbaling slightly
      { id: 'C', isCenter: true, gimbal: true, Ve: 2766, massFlowRate: 306, gimbalDeg: 3, x: 0 },
    ],
  }],
};

// ============================================================
// 4. Full derivation
// ============================================================
section('Full stack derivation');
const d = Guidance.derive(fakeSnap);

log('Kinematics:');
log('  r: ' + d.r.toFixed(1) + ' m');
log('  altitudeASL: ' + d.altitudeASL.toFixed(1) + ' m');
log('  theta: ' + d.theta.toFixed(4) + ' rad');

log('\nEnvironment:');
log('  gMag: ' + d.gMag.toFixed(4) + ' m/s²');
log('  rho:  ' + d.rho.toFixed(6) + ' kg/m³');
log('  Q:    ' + d.Q.toFixed(1) + ' Pa');
log('  alphaDeg: ' + d.alphaDeg.toFixed(3) + '°');

log('\nForces:');
log('  dragMag: ' + d.dragMag.toFixed(0) + ' N');
log('  thrustTotal: ' + d.thrustTotal.toFixed(0) + ' N');
log('  mdotTotal:   ' + d.mdotTotal.toFixed(2) + ' kg/s');

section('Mass properties');
log('  M:       ' + d.massProps.M.toFixed(1) + ' kg');
log('  dryMass: ' + d.massProps.dryMass.toFixed(1) + ' kg');
log('  fuelMass:' + d.massProps.fuelMass.toFixed(1) + ' kg');
log('  comX:    ' + d.massProps.comX.toExponential(3));
log('  comY:    ' + d.massProps.comY.toFixed(3) + ' m');
log('  I:       ' + d.massProps.I.toExponential(3) + ' kg·m²');

section('Torque');
log('  comY: ' + d.massProps.comY.toFixed(3) + ' m');
log('  τ_engine: ' + d.torqueEngine.toFixed(2) + ' N·m');
log('  τ_drag:   ' + d.torqueDrag.toFixed(2) + ' N·m');
log('  τ_rcs:    ' + d.torqueRcs.toFixed(2) + ' N·m');
log('  τ_total:  ' + d.torqueTotal.toFixed(2) + ' N·m');
log('  α (α/ I): ' + d.alphaAng.toExponential(4) + ' rad/s²');

section('Member breakdown');
d.memberBreakdown.forEach(m => {
  log(`[${m.index}] ${m.role.padEnd(13)} H=${m.H}m W=${m.W}m`);
  log(`     mass=${m.mass.toFixed(0)}kg  comY_stack=${m.comY_stack.toFixed(2)}  copY_stack=${m.copY_stack.toFixed(2)}  (linear=${m.copY_linear_stack !== null ? m.copY_linear_stack.toFixed(2) : '—'})`);
  log(`     area: axial=${m.aAxial.toFixed(1)}  broad=${m.aSide.toFixed(1)}  eff=${m.presentedArea.toFixed(1)}`);
  log(`     drag=${m.drag.toFixed(0)}N  Fn_lin=${m.Fnormal_linear.toFixed(0)}N  Fn_cross=${m.Fnormal_crossflow.toFixed(0)}N`);
});

section('Per-member drag torque');
d.memberBreakdown.forEach(m => {
  const tl = m.copY_linear_stack !== null ? (d.massProps.comY - m.copY_linear_stack) * m.Fnormal_linear : 0;
  const tc = (d.massProps.comY - m.copY_stack) * m.Fnormal_crossflow;
  log(`  [${m.index}] ${m.role.padEnd(13)} τ_lin=${tl.toFixed(1)}  τ_cross=${tc.toFixed(1)}`);
});

// ============================================================
// 5. Solo body (fairing half style)
// ============================================================
section('Solo body (member-less)');
const soloBody = {
  rx: 6371000, ry: 0,
  vx: 0, vy: -10,
  theta: 0, omega: 0,
  ax: 0, ay: 0,
  height: 13.1, width: 5.2,
  dryMass: 953, fuelMass: 0,
  members: [],
  legs: null, slosh: null, engines: [],
};
const soloSnap = {
  simTime: 5, activeBodyIndex: 0, halted: false,
  wind: { enabled: false, speed: 0, directionDeg: 0 },
  bodies: [soloBody],
};
const sd = Guidance.derive(soloSnap);
log('hasMembers: ' + sd.hasMembers);
log('M: ' + sd.massProps.M.toFixed(1) + ' kg');
log('comY: ' + sd.massProps.comY.toFixed(3) + ' m');
log('I: ' + sd.massProps.I.toFixed(0) + ' kg·m²');
log('memberBreakdown count: ' + sd.memberBreakdown.length);
log('H/W: ' + sd.memberBreakdown[0].H + '/' + sd.memberBreakdown[0].W);

section('Sum checks');
const compSum = d.massProps.components.reduce((s, c) => s + (c.mass || 0), 0);
const memSum = d.memberBreakdown.reduce((s, m) => s + m.mass, 0);
log('components sum: ' + compSum.toFixed(2));
log('member sum:     ' + memSum.toFixed(2));
log('M:              ' + d.massProps.M.toFixed(2));
log('all equal: ' + (Math.abs(compSum - d.massProps.M) < 0.5 && Math.abs(memSum - d.massProps.M) < 0.5));

section('All tests complete');
</script>
</body>
</html>
