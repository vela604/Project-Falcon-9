<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Simulator — Rocket Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/simulation.css">
</head>
<body>
<div id="app">

  <!-- ===================== Status / Toolbar ===================== -->
  <div id="statusBar">
    <div class="tb-scroll">

      <a class="tb-brand" href="index.html" title="Back to Rocket Sim home">
        <span class="tb-brand-icon">🚀</span><span class="tb-brand-text">ROCKET SIM</span>
      </a>

      <div class="tb-sep"></div>

      <div class="tb-group tb-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">STOPPED</span>
        <span class="tb-clock" id="missionClock">T+00:00.0</span>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group">
        <button class="btn btn-start" id="btnStart"><span class="btn-ic">▶</span>Start</button>
        <button class="btn btn-stop" id="btnStop"><span class="btn-ic">⏸</span>Stop</button>
        <button class="btn btn-reset" id="btnReset"><span class="btn-ic">↺</span>Reset</button>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group">
        <button class="btn icon-btn active" id="btnFollow" title="Follow rocket">🎯</button>
        <button class="btn icon-btn" id="btnFree" title="Free camera">🖐</button>
        <button class="btn icon-btn" id="btnZoomOut" title="Zoom out">−</button>
        <button class="btn icon-btn" id="btnZoomIn" title="Zoom in">+</button>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group">
        <label class="chip-toggle"><input type="checkbox" id="toggleGrid" checked><span>Grid</span></label>
        <label class="chip-toggle"><input type="checkbox" id="toggleVectors" checked><span>Vectors</span></label>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group tb-panel-buttons">
        <button class="btn panel-toggle-btn" id="btnMergePanel"><span class="btn-ic">⚙</span>Engines</button>
        <button class="btn panel-toggle-btn" id="btnSidePanel"><span class="btn-ic">🛰</span>Rocket</button>
        <button class="btn panel-toggle-btn" id="btnWindPanel"><span class="btn-ic">🌬</span>Wind</button>
        <button class="btn panel-toggle-btn" id="btnGraphPanel"><span class="btn-ic">📈</span>Graphs</button>
        <button class="btn panel-toggle-btn" id="btnGlossary"><span class="btn-ic">ⓘ</span>Info</button>
      </div>

    </div>
  </div>

  <!-- ===================== Viewport ===================== -->
  <div id="viewport">
    <canvas id="simCanvas"></canvas>

    <!-- Telemetry (compact notation) -->
    <div id="telemetryPanel">
      <div class="tele-head">TELEMETRY</div>
      <div class="tele-grid">
        <div class="tele-row"><span class="tele-sym">h</span><span class="tele-val" id="t-h">0</span></div>
        <div class="tele-row"><span class="tele-sym">v</span><span class="tele-val" id="t-v">0</span></div>
        <div class="tele-row"><span class="tele-sym">vx</span><span class="tele-val" id="t-vx">0</span></div>
        <div class="tele-row"><span class="tele-sym">vy</span><span class="tele-val" id="t-vy">0</span></div>
        <div class="tele-row"><span class="tele-sym">θ</span><span class="tele-val" id="t-theta">0</span></div>
        <div class="tele-row"><span class="tele-sym">ω</span><span class="tele-val" id="t-omega">0</span></div>
        <div class="tele-row"><span class="tele-sym">m</span><span class="tele-val" id="t-m">0</span></div>
        <div class="tele-row"><span class="tele-sym">mf</span><span class="tele-val" id="t-mf">0</span></div>
        <div class="tele-row"><span class="tele-sym">Ft</span><span class="tele-val" id="t-Ft">0</span></div>
        <div class="tele-row"><span class="tele-sym">γ</span><span class="tele-val" id="t-gimbal">0</span></div>
        <div class="tele-row"><span class="tele-sym">τ</span><span class="tele-val" id="t-torque">0</span></div>
        <div class="tele-row"><span class="tele-sym">g</span><span class="tele-val" id="t-g">0</span></div>
        <div class="tele-row"><span class="tele-sym">ρ</span><span class="tele-val" id="t-rho">0</span></div>
      </div>
    </div>

    <!-- Bottom control cluster -->
    <div id="bottomControls">
      <div class="bc-inner">
        <div id="slidersLeft" class="slider-rack"></div>

        <div class="center-cluster">
          <button class="rcs-btn" id="rcsNW" style="grid-column:1;grid-row:1;">↖</button>
          <button class="rcs-btn" id="rcsN" style="grid-column:2;grid-row:1;">↑</button>
          <button class="rcs-btn" id="rcsNE" style="grid-column:3;grid-row:1;">↗</button>

          <button class="gimbal-btn" id="gimbalACW" style="grid-column:1;grid-row:2;" title="Gimbal ACW">⟲</button>
          <div class="thrust-col" style="grid-column:2;grid-row:2;">
            <div id="centerThrustValue">0%</div>
            <input type="range" id="centerThrustSlider" min="0" max="100" value="0">
            <div class="thrust-col-label">MAIN</div>
          </div>
          <button class="gimbal-btn" id="gimbalCW" style="grid-column:3;grid-row:2;" title="Gimbal CW">⟳</button>

          <button class="rcs-btn" id="rcsW" style="grid-column:1;grid-row:2;align-self:end;">←</button>
          <button class="rcs-btn" id="rcsE" style="grid-column:3;grid-row:2;align-self:end;">→</button>

          <button class="rcs-btn" id="rcsSW" style="grid-column:1;grid-row:3;">↙</button>
          <button class="rcs-btn" id="rcsS" style="grid-column:2;grid-row:3;">↓</button>
          <button class="rcs-btn" id="rcsSE" style="grid-column:3;grid-row:3;">↘</button>

          <div class="rotate-row">
            <button class="rcs-btn rotate" id="rcsACW"><span>⟲</span>ACW</button>
            <button class="rcs-btn rotate" id="rcsCW"><span>⟳</span>CW</button>
          </div>
        </div>

        <div id="slidersRight" class="slider-rack"></div>
      </div>
    </div>

    <!-- ===================== Panel dock (right side, stacks — no overlap) ===================== -->
    <div id="panelDock">

      <!-- Engine merge / octaweb diagram panel -->
      <div class="panel" id="mergePanel" data-pause-sim="true">
        <div class="panel-header"><span class="panel-title">⚙ ENGINE GROUPS</span><button class="panel-close" data-target="mergePanel">✕</button></div>
        <svg id="mergeSvg" width="180" height="180" viewBox="0 0 180 180"></svg>
        <div class="merge-mode-row">
          <button class="btn active" id="mergeModeSymmetric">Symmetric</button>
          <button class="btn" id="mergeModeAsymmetric">Asymmetric</button>
        </div>
        <div class="panel-hint">Tap two engine dots to merge them onto one slider.</div>
        <div id="mergeLegend"></div>
        <button class="btn btn-block" id="btnResetMerges">Reset Merges</button>
      </div>

      <!-- Rocket figure side panel — open by default, user asked to keep this nearly always visible -->
      <div class="panel" id="sidePanel" style="display:block;">
        <div class="panel-header"><span class="panel-title">🛰 ROCKET FIGURE</span><button class="panel-close" data-target="sidePanel">✕</button></div>
        <canvas id="figureCanvas" width="260" height="260"></canvas>
        <div class="panel-subtitle">BASAL VIEW (engines)</div>
        <canvas id="basalCanvas" width="260" height="180"></canvas>
      </div>

      <!-- Wind panel -->
      <div class="panel" id="windPanel">
        <div class="panel-header"><span class="panel-title">🌬 WIND</span><button class="panel-close" data-target="windPanel">✕</button></div>
        <label class="chip-toggle chip-toggle-block"><input type="checkbox" id="windEnabled"><span>Enabled</span></label>
        <div class="field-row">
          <div class="field-label"><span>Speed</span><span id="windSpeedLabel">0 m/s</span></div>
          <input type="range" id="windSpeed" min="0" max="60" value="0">
        </div>
        <div class="field-row">
          <div class="field-label"><span>Direction</span><span id="windDirLabel">0°</span></div>
          <input type="range" id="windDir" min="0" max="360" value="0">
        </div>
      </div>

      <!-- Graphs panel (pauses sim while open) -->
      <div class="panel" id="graphPanel" data-pause-sim="true">
        <div class="panel-header"><span class="panel-title">📈 LIVE GRAPHS</span><button class="panel-close" data-target="graphPanel">✕</button></div>
        <div class="graph-block"><div class="graph-label">Altitude</div><canvas class="mini-graph" id="graphAlt"></canvas></div>
        <div class="graph-block"><div class="graph-label">Velocity</div><canvas class="mini-graph" id="graphVel"></canvas></div>
        <div class="graph-block"><div class="graph-label">Thrust</div><canvas class="mini-graph" id="graphThrust"></canvas></div>
      </div>

      <!-- Glossary / info panel -->
      <div class="panel" id="glossaryPanel">
        <div class="panel-header"><span class="panel-title">ⓘ NOTATION GLOSSARY</span><button class="panel-close" data-target="glossaryPanel">✕</button></div>
        <div id="glossaryList"></div>
      </div>

    </div>
  </div>
</div>

<script src="js/fleet.js"></script>
<script src="js/config.js"></script>
<script src="js/simJs/environment.js"></script>
<script src="js/simJs/vehicle.js"></script>
<script src="js/simJs/rcs.js"></script>
<script src="js/simJs/physics.js"></script>
<script src="js/simJs/controls.js"></script>
<script src="js/simJs/render.js"></script>
<script src="js/simJs/telemetry.js"></script>
<script src="js/simJs/main.js"></script>
</body>
</html>
